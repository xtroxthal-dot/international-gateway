<script>
(function(){

  "use strict";

  if(window.__IG_FINAL_CHECKOUT_REPAIR_2026){
    return;
  }

  window.__IG_FINAL_CHECKOUT_REPAIR_2026 = true;


  /* =========================================================
     UTILIDADES
     ========================================================= */

  function waitForCheckout(callback){

    let attempts = 0;

    const timer = setInterval(function(){

      attempts++;

      const form =
        document.getElementById("checkoutForm");

      if(form){

        clearInterval(timer);

        callback(form);

        return;
      }

      if(attempts >= 100){

        clearInterval(timer);

        console.warn(
          "International Gateway: no se encontró checkoutForm."
        );

      }

    },100);

  }


  function message(text,type){

    if(typeof setMessage === "function"){

      setMessage(
        "checkoutMessage",
        text,
        type || "error"
      );

      return;
    }

    const box =
      document.getElementById(
        "checkoutMessage"
      );

    if(box){

      box.textContent = text;

      box.className =
        "notice " +
        (type || "error");

    }

  }


  function readValue(id){

    const element =
      document.getElementById(id);

    return element
      ? String(element.value || "").trim()
      : "";

  }


  /* =========================================================
     OPCIONES DE ENTREGA
     ========================================================= */

  function getDeliveryMethod(){

    const selected =
      document.querySelector(
        'input[name="igDeliveryMethod"]:checked'
      );

    return selected
      ? selected.value
      : "pickup";

  }


  function setShippingVisibility(){

    const shippingBox =
      document.getElementById(
        "igShippingBox"
      );

    if(!shippingBox){
      return;
    }

    const method =
      getDeliveryMethod();

    if(method === "shipping"){

      shippingBox.classList.remove(
        "ig-hidden-shipping"
      );

    }else{

      shippingBox.classList.add(
        "ig-hidden-shipping"
      );

    }

    document
      .querySelectorAll(
        "#igShippingBox input, #igShippingBox textarea"
      )
      .forEach(function(field){

        /*
         * Los campos siguen existiendo pero solo
         * son obligatorios cuando hay envío.
         */

        if(
          field.id === "igShipName" ||
          field.id === "igShipPhone" ||
          field.id === "igShipAddress" ||
          field.id === "igShipNumber" ||
          field.id === "igShipLocality" ||
          field.id === "igShipProvince" ||
          field.id === "igShipPostal" ||
          field.id === "igShipCountry"
        ){

          field.required =
            method === "shipping";

        }

        if(method !== "shipping"){

          field.setCustomValidity("");

        }

      });


    document
      .querySelectorAll(
        ".ig-delivery-option"
      )
      .forEach(function(option){

        const input =
          option.querySelector(
            'input[name="igDeliveryMethod"]'
          );

        option.classList.toggle(
          "ig-selected",
          !!input && input.checked
        );

      });

  }


  function injectDeliverySelector(){

    const form =
      document.getElementById(
        "checkoutForm"
      );

    const shippingBox =
      document.getElementById(
        "igShippingBox"
      );

    if(!form || !shippingBox){
      return false;
    }


    if(
      document.getElementById(
        "igDeliveryMethodBox"
      )
    ){

      setShippingVisibility();

      return true;
    }


    const box =
      document.createElement("div");

    box.id =
      "igDeliveryMethodBox";


    box.innerHTML = `

      <h3>
        📦 ¿Cómo quieres recibir tu pedido?
      </h3>

      <p>
        Elegí una opción para continuar.
      </p>

      <div class="ig-delivery-options">

        <label class="ig-delivery-option">

          <input
            type="radio"
            name="igDeliveryMethod"
            value="pickup"
            checked>

          <span>

            <strong>
              🛍️ Retiro en el local
            </strong>

            <small>
              Retirá tu pedido personalmente.
              No se cobra envío y no necesitás
              completar los datos de domicilio.
            </small>

          </span>

        </label>


        <label class="ig-delivery-option">

          <input
            type="radio"
            name="igDeliveryMethod"
            value="shipping">

          <span>

            <strong>
              🚚 Envío a domicilio
            </strong>

            <small>
              Completá los datos de entrega.
              El administrador calculará el costo
              del envío antes de habilitar el pago.
            </small>

          </span>

        </label>

      </div>

      <div
        id="igDeliveryNote"
        class="ig-delivery-note">

        🛍️ Seleccionaste retiro en el local.
        No hace falta completar datos de envío.

      </div>

    `;


    /*
     * Colocamos el selector inmediatamente
     * antes del módulo de envío.
     */

    shippingBox.parentNode.insertBefore(
      box,
      shippingBox
    );


    function update(){

      const method =
        getDeliveryMethod();

      const note =
        document.getElementById(
          "igDeliveryNote"
        );

      if(note){

        if(method === "shipping"){

          note.className =
            "ig-delivery-note shipping";

          note.innerHTML =
            "🚚 Seleccionaste envío a domicilio. " +
            "Completá los datos de entrega para " +
            "solicitar la cotización.";

        }else{

          note.className =
            "ig-delivery-note";

          note.innerHTML =
            "🛍️ Seleccionaste retiro en el local. " +
            "No hace falta completar datos de envío.";

        }

      }

      setShippingVisibility();

    }


    box
      .querySelectorAll(
        'input[name="igDeliveryMethod"]'
      )
      .forEach(function(input){

        input.addEventListener(
          "change",
          update
        );

      });


    update();

    return true;

  }


  /* =========================================================
     LECTURA DE DATOS DE ENVÍO
     ========================================================= */

  function readShipping(){

    return {

      full_name:
        readValue("igShipName"),

      phone:
        readValue("igShipPhone"),

      address:
        readValue("igShipAddress"),

      address_number:
        readValue("igShipNumber"),

      floor_department:
        readValue("igShipFloor"),

      locality:
        readValue("igShipLocality"),

      province:
        readValue("igShipProvince"),

      postal_code:
        readValue("igShipPostal"),

      country:
        readValue("igShipCountry") ||
        "Argentina",

      delivery_notes:
        readValue("igShipNotes")

    };

  }


  /* =========================================================
     VALIDACIÓN DE ENVÍO
     ========================================================= */

  function validateShipping(shipping){

    const required = [

      [
        "Nombre y apellido",
        shipping.full_name
      ],

      [
        "Teléfono / WhatsApp",
        shipping.phone
      ],

      [
        "Dirección",
        shipping.address
      ],

      [
        "Número",
        shipping.address_number
      ],

      [
        "Localidad",
        shipping.locality
      ],

      [
        "Provincia",
        shipping.province
      ],

      [
        "Código postal",
        shipping.postal_code
      ],

      [
        "País",
        shipping.country
      ]

    ];


    const missing =
      required
        .filter(function(item){
          return !item[1];
        })
        .map(function(item){
          return item[0];
        });


    if(missing.length){

      message(
        "Completá los siguientes datos de envío: " +
        missing.join(", ") +
        ".",
        "error"
      );

      return false;
    }


    return true;

  }


  /* =========================================================
     CREACIÓN SEGURA DE COTIZACIÓN
     
     IMPORTANTE:
     No hacemos:
       .from("ig_shipping_quotes")
       .insert(...)
       .select(...)
     
     porque eso provoca el problema RLS.
     
     Usamos exclusivamente el RPC seguro.
     ========================================================= */

  async function createShippingQuote(
    orderNumber,
    email,
    shipping
  ){

    const result =
      await supabaseClient.rpc(
        "crear_cotizacion_envio_international_gateway",
        {

          p_order_number:
            Number(orderNumber),

          p_customer_email:
            String(email),

          p_full_name:
            String(
              shipping.full_name || ""
            ),

          p_phone:
            String(
              shipping.phone || ""
            ),

          p_address:
            String(
              shipping.address || ""
            ),

          p_address_number:
            String(
              shipping.address_number || ""
            ),

          p_floor_department:
            String(
              shipping.floor_department || ""
            ),

          p_locality:
            String(
              shipping.locality || ""
            ),

          p_province:
            String(
              shipping.province || ""
            ),

          p_postal_code:
            String(
              shipping.postal_code || ""
            ),

          p_delivery_notes:
            String(
              shipping.delivery_notes || ""
            )

        }
      );


    if(result.error){

      throw result.error;

    }


    if(
      !result.data ||
      result.data.success !== true
    ){

      throw new Error(
        "No se pudo registrar la solicitud de envío."
      );

    }


    return {

      id:
        result.data.id || null,

      access_token:
        result.data.access_token || null

    };

  }


  /* =========================================================
     LIMPIEZA DE PEDIDO
     ========================================================= */

  async function cleanupOrder(orderId){

    if(!orderId){
      return;
    }


    try{

      /*
       * Primero eliminamos los ítems.
       */

      await supabaseClient
        .from("ig_order_items")
        .delete()
        .eq(
          "order_id",
          orderId
        );


    }catch(error){

      console.warn(
        "International Gateway: error limpiando ítems:",
        error
      );

    }


    try{

      /*
       * Después eliminamos el pedido.
       */

      await supabaseClient
        .from("ig_orders")
        .delete()
        .eq(
          "id",
          orderId
        );


    }catch(error){

      console.warn(
        "International Gateway: error limpiando pedido:",
        error
      );

    }

  }


  /* =========================================================
     CHECKOUT REPARADO
     ========================================================= */

  async function repairedCreateOrder(event){

    event.preventDefault();

    if(event.stopImmediatePropagation){
      event.stopImmediatePropagation();
    }


    if(
      !window.supabaseClient ||
      typeof supabaseClient.from !== "function"
    ){

      message(
        "No se pudo conectar con el sistema de pedidos.",
        "error"
      );

      return;

    }


    if(
      !Array.isArray(window.cart) &&
      typeof cart === "undefined"
    ){

      message(
        "No se pudo acceder al carrito.",
        "error"
      );

      return;

    }


    /*
     * Utilizamos la variable cart existente.
     */

    const currentCart =
      typeof cart !== "undefined"
        ? cart
        : window.cart;


    if(
      !Array.isArray(currentCart) ||
      !currentCart.length
    ){

      message(
        "El carrito está vacío.",
        "error"
      );

      return;

    }


    const name =
      readValue("customerName");

    const phone =
      readValue("customerPhone");

    const email =
      readValue("customerEmail");

    const paymentMethod =
      document
        .getElementById("paymentMethod")
        ?.value || "";


    if(
      !name ||
      !phone ||
      !email ||
      !paymentMethod
    ){

      message(
        "Completá todos los datos del cliente y seleccioná un método de pago.",
        "error"
      );

      return;

    }


    const deliveryMethod =
      getDeliveryMethod();


    const shipping =
      readShipping();


    /*
     * =======================================================
     * OBTENER PRODUCTOS ACTUALES
     *
     * No confiamos en precios guardados en localStorage.
     * Consultamos Supabase para conservar la seguridad
     * del checkout existente.
     * =======================================================
     */

    let validItems = [];
    let subtotal = 0;


    try{

      const productIds =
        currentCart
          .map(function(item){

            return item.product_id ||
                   item.id ||
                   item.productId;

          })
          .filter(Boolean);


      if(!productIds.length){

        throw new Error(
          "No se encontraron productos válidos en el carrito."
        );

      }


      const productsResult =
        await supabaseClient
          .from("ig_products")
          .select(`
            id,
            name,
            price,
            available
          `)
          .in(
            "id",
            productIds
          );


      if(productsResult.error){

        throw productsResult.error;

      }


      const currentProducts =
        productsResult.data || [];


      for(
        const item of currentCart
      ){

        const productId =
          item.product_id ||
          item.id ||
          item.productId;


        const product =
          currentProducts.find(function(p){

            return String(p.id) ===
                   String(productId);

          });


        if(!product){

          continue;

        }


        /*
         * Si available es falso, no permitimos
         * que se genere un pedido de ese producto.
         */

        if(
          product.available === false ||
          product.available === 0
        ){

          throw new Error(
            "El producto \"" +
            product.name +
            "\" ya no está disponible."
          );

        }


        const quantity =
          Math.max(
            1,
            Number(
              item.quantity || 1
            )
          );


        const price =
          Number(product.price);


        if(
          !Number.isFinite(price) ||
          price < 0
        ){

          throw new Error(
            "Precio inválido para \"" +
            product.name +
            "\"."
          );

        }


        const itemSubtotal =
          price * quantity;


        validItems.push({

          product_id:
            product.id,

          product_name:
            product.name,

          product_price:
            price,

          quantity:
            quantity,

          subtotal:
            itemSubtotal

        });


        subtotal +=
          itemSubtotal;

      }


      if(!validItems.length){

        throw new Error(
          "No hay productos válidos para registrar."
        );

      }


    }catch(error){

      console.error(
        "International Gateway checkout products:",
        error
      );

      message(
        error.message ||
        "No se pudieron comprobar los productos.",
        "error"
      );

      return;

    }


    /*
     * =======================================================
     * CREAR PEDIDO
     * =======================================================
     */

    const orderId =
      crypto.randomUUID();

    const orderNumber =
      Date.now();


    let orderCreated = false;


    try{

      const orderResult =
        await supabaseClient
          .from("ig_orders")
          .insert({

            id:
              orderId,

            order_number:
              orderNumber,

            customer_name:
              name,

            customer_phone:
              phone,

            customer_email:
              email,

            payment_method:
              paymentMethod,

            payment_status:
              "pending",

            order_status:
              "pending",

            subtotal:
              subtotal,

            total:
              subtotal

          });


      if(orderResult.error){

        throw orderResult.error;

      }


      orderCreated = true;


      /*
       * =====================================================
       * INSERTAR ÍTEMS
       * =====================================================
       */

      const itemRows =
        validItems.map(function(item){

          return {

            order_id:
              orderId,

            product_id:
              item.product_id,

            product_name:
              item.product_name,

            product_price:
              item.product_price,

            quantity:
              item.quantity,

            subtotal:
              item.subtotal

          };

        });


      const itemsResult =
        await supabaseClient
          .from("ig_order_items")
          .insert(itemRows);


      if(itemsResult.error){

        throw itemsResult.error;

      }


      /*
       * =====================================================
       * ENVÍO OPCIONAL
       *
       * RETIRO:
       *   No hacemos absolutamente nada sobre
       *   ig_shipping_quotes.
       *
       * ENVÍO:
       *   Utilizamos el RPC seguro.
       * =====================================================
       */

      let shippingRow = null;


      if(
        deliveryMethod === "shipping"
      ){

        if(
          !validateShipping(shipping)
        ){

          throw new Error(
            "Faltan datos obligatorios de envío."
          );

        }


        shippingRow =
          await createShippingQuote(
            orderNumber,
            email,
            shipping
          );


        /*
         * Guardamos únicamente una referencia local
         * para el seguimiento del cliente.
         */

        localStorage.setItem(
          "ig_shipping_order",
          JSON.stringify({

            order_number:
              orderNumber,

            phone:
              shipping.phone,

            access_token:
              shippingRow.access_token,

            delivery_method:
              "shipping"

          })
        );


      }else{

        /*
         * RETIRO EN EL LOCAL
         *
         * No se crea cotización.
         */

        localStorage.setItem(
          "ig_shipping_order",
          JSON.stringify({

            order_number:
              orderNumber,

            phone:
              phone,

            access_token:
              null,

            delivery_method:
              "pickup"

          })
        );

      }


      /*
       * Guardamos información local adicional.
       */

      localStorage.setItem(
        "ig_last_order_delivery_method",
        deliveryMethod
      );


      localStorage.setItem(
        "ig_last_order_number",
        String(orderNumber)
      );


      /*
       * =====================================================
       * VACIAR CARRITO
       * =====================================================
       */

      if(
        typeof saveCart === "function"
      ){

        /*
         * La variable cart existente se vacía
         * para respetar la implementación actual.
         */

        cart = [];

        saveCart();

      }else{

        localStorage.removeItem(
          "ig_cart"
        );

      }


      if(
        typeof updateCartCount === "function"
      ){

        updateCartCount();

      }


      /*
       * =====================================================
       * CONFIRMACIÓN
       * =====================================================
       */

      if(
        typeof showConfirmation === "function"
      ){

        showConfirmation(
          {

            id:
              orderId,

            order_number:
              orderNumber,

            total:
              subtotal,

            subtotal:
              subtotal,

            delivery_method:
              deliveryMethod,

            shipping:
              shippingRow

          },
          paymentMethod
        );


      }else{

        /*
         * Respaldo por si la función de confirmación
         * no estuviera disponible.
         */

        message(
          "Pedido #" +
          orderNumber +
          " registrado correctamente.",
          "success"
        );

      }


      /*
       * Intentamos adaptar el texto de confirmación
       * al método elegido sin tocar la función original.
       */

      setTimeout(function(){

        const confirmation =
          document.querySelector(
            "#confirmationView, .confirmation, [data-confirmation]"
          );


        if(
          deliveryMethod === "pickup"
        ){

          document
            .querySelectorAll(
              "body *"
            )
            .forEach(function(element){

              /*
               * Solo reemplazamos textos claramente
               * relacionados con envío pendiente.
               */

              if(
                element.children.length === 0 &&
                /Envío pendiente de cotización/i.test(
                  element.textContent || ""
                )
              ){

                element.textContent =
                  "🛍️ Retiro en el local";

              }

            });

        }

      },100);


    }catch(error){

      console.error(
        "International Gateway checkout repair:",
        error
      );


      /*
       * Si el pedido llegó a crearse y después
       * falló algo, intentamos limpiarlo.
       *
       * No tocamos ig_shipping_quotes aquí:
       * el RPC es SECURITY DEFINER y el cliente
       * no debe intentar borrar cotizaciones.
       */

      if(orderCreated){

        await cleanupOrder(
          orderId
        );

      }


      message(
        error.message ||
        "No se pudo registrar el pedido.",
        "error"
      );

    }

  }


  /* =========================================================
     INSTALACIÓN
     ========================================================= */

  function install(form){

    /*
     * Primero instalamos selector de entrega.
     */

    let selectorReady =
      injectDeliverySelector();


    /*
     * El módulo de envío existente puede crearse
     * ligeramente después. Reintentamos.
     */

    if(!selectorReady){

      let attempts = 0;

      const retry =
        setInterval(function(){

          attempts++;

          if(
            injectDeliverySelector()
          ){

            clearInterval(retry);

          }

          if(attempts >= 100){

            clearInterval(retry);

          }

        },100);

    }


    /*
     * =======================================================
     * INTERCEPTOR CAPTURE
     *
     * Se ejecuta ANTES que el listener antiguo.
     * Por eso no necesitamos modificar ni borrar
     * createOrder() original.
     * =======================================================
     */

    form.addEventListener(
      "submit",
      function(event){

        /*
         * Evitamos que el listener antiguo continúe.
         */

        if(
          event.stopImmediatePropagation
        ){

          event.stopImmediatePropagation();

        }

        repairedCreateOrder(event);

      },
      true
    );


    /*
     * Aseguramos que los campos de envío
     * no queden obligatorios al cargar.
     */

    setTimeout(
      setShippingVisibility,
      150
    );


    console.log(
      "International Gateway: checkout reparado correctamente."
    );

  }


  if(
    document.readyState === "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      function(){

        waitForCheckout(
          install
        );

      },
      {once:true}
    );

  }else{

    waitForCheckout(
      install
    );

  }


})();
</script>
    <script>
(function () {
  "use strict";

  if (window.__IG_CHECKOUT_MESSAGE_REPAIR) return;
  window.__IG_CHECKOUT_MESSAGE_REPAIR = true;

  function limpiarMensajeEnvioParaRetiro() {
    const radios = document.querySelectorAll(
      'input[name="igDeliveryMethod"]'
    );

    let pickup = false;

    radios.forEach(function (radio) {
      if (
        radio.checked &&
        (
          radio.value === "pickup" ||
          radio.value === "retiro" ||
          radio.value === "local"
        )
      ) {
        pickup = true;
      }
    });

    if (!pickup) return;

    document.querySelectorAll("body *").forEach(function (element) {
      if (element.children.length > 0) return;

      const texto = (element.textContent || "").trim();

      if (
        texto ===
        "Completá todos los datos necesarios para presupuestar el envío."
      ) {
        element.style.display = "none";
      }
    });
  }

  function observarCambios() {
    limpiarMensajeEnvioParaRetiro();

    const observer = new MutationObserver(function () {
      limpiarMensajeEnvioParaRetiro();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      observarCambios,
      { once: true }
    );
  } else {
    observarCambios();
  }
})();

<script>
(function () {
  "use strict";

  if (window.__IG_ADMIN_DELETE_ORDERS_LOADED) return;
  window.__IG_ADMIN_DELETE_ORDERS_LOADED = true;

  async function igDeleteOrder(orderId, orderNumber, card) {

    if (!orderId) {
      showToast?.("No se pudo identificar el pedido.");
      return;
    }

    const confirmar = confirm(
      "⚠️ ¿Seguro que quieres borrar el pedido #" +
      orderNumber +
      "?\n\n" +
      "Se eliminarán el pedido, sus productos asociados " +
      "y los datos de envío.\n\n" +
      "Esta acción no se puede deshacer."
    );

    if (!confirmar) return;

    try {

      showToast?.("Borrando pedido...");

      /*
       * Primero eliminamos los datos relacionados.
       */

      const { error: shippingError } =
        await supabaseClient
          .from("ig_shipping_quotes")
          .delete()
          .eq("order_id", orderId);

      if (shippingError) {
        throw shippingError;
      }

      const { error: itemsError } =
        await supabaseClient
          .from("ig_order_items")
          .delete()
          .eq("order_id", orderId);

      if (itemsError) {
        throw itemsError;
      }

      /*
       * Finalmente eliminamos el pedido.
       */

      const { error: orderError } =
        await supabaseClient
          .from("ig_orders")
          .delete()
          .eq("id", orderId);

      if (orderError) {
        throw orderError;
      }

      /*
       * Quitar inmediatamente la tarjeta de pantalla.
       */

      if (card) {
        card.style.transition =
          "opacity .2s ease, transform .2s ease";

        card.style.opacity = "0";
        card.style.transform = "translateY(-8px)";

        setTimeout(function () {
          card.remove();
        }, 220);
      }

      showToast?.(
        "✅ Pedido #" +
        orderNumber +
        " eliminado correctamente."
      );

      /*
       * Recargar estadísticas/listado si existe
       * la función original.
       */

      if (
        typeof window.loadAdminOrders ===
        "function"
      ) {
        setTimeout(function () {
          window.loadAdminOrders();
        }, 300);
      }

    } catch (error) {

      console.error(
        "International Gateway — borrar pedido:",
        error
      );

      showToast?.(
        error?.message ||
        "No se pudo borrar el pedido."
      );
    }
  }

  window.igDeleteOrder =
    igDeleteOrder;


  function igAddDeleteButtons() {

    const container =
      document.getElementById(
        "adminOrdersList"
      );

    if (!container) return;

    const cards =
      container.querySelectorAll(
        ".order-card"
      );

    cards.forEach(function (card) {

      if (
        card.querySelector(
          "[data-ig-delete-order='1']"
        )
      ) {
        return;
      }

      /*
       * El ID real está guardado en el botón
       * existente de gestión del pedido o,
       * si no lo encontramos, se obtiene del
       * atributo onclick de los controles.
       */

      let orderId = null;
      let orderNumber = null;

      const html =
        card.innerHTML || "";

      /*
       * Buscar un UUID de pedido dentro
       * de onclick/data-* existentes.
       */

      const uuidMatch =
        html.match(
          /[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/i
        );

      if (uuidMatch) {
        orderId = uuidMatch[0];
      }

      /*
       * Obtener número de pedido desde el
       * encabezado de la tarjeta.
       */

      const strong =
        card.querySelector(
          ".order-head strong"
        );

      if (strong) {

        const match =
          strong.textContent.match(
            /#\s*(\d+)/
          );

        if (match) {
          orderNumber = match[1];
        }
      }

      /*
       * Si el UUID no está visible en el HTML,
       * buscamos botones con onclick que tengan
       * un identificador.
       */

      if (!orderId) {

        const buttons =
          card.querySelectorAll(
            "button"
          );

        buttons.forEach(function (button) {

          if (orderId) return;

          const onclick =
            button.getAttribute(
              "onclick"
            ) || "";

          const match =
            onclick.match(
              /['"]([0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})['"]/i
            );

          if (match) {
            orderId = match[1];
          }
        });
      }

      /*
       * Si no podemos encontrar el ID,
       * no añadimos un botón que pueda borrar
       * el pedido equivocado.
       */

      if (!orderId) {
        console.warn(
          "IG: no se pudo identificar el ID del pedido para añadir botón de borrado."
        );
        return;
      }

      const actions =
        card.querySelector(
          ".admin-actions"
        );

      const target =
        actions ||
        card;

      const button =
        document.createElement(
          "button"
        );

      button.type = "button";

      button.className =
        "button danger";

      button.setAttribute(
        "data-ig-delete-order",
        "1"
      );

      button.innerHTML =
        "🗑️ Borrar pedido";

      button.addEventListener(
        "click",
        function () {
          igDeleteOrder(
            orderId,
            orderNumber || orderId,
            card
          );
        }
      );

      target.appendChild(button);
    });
  }


  /*
   * Esperar a que el administrador haya
   * terminado de cargar los pedidos.
   */

  function boot() {

    igAddDeleteButtons();

    setTimeout(
      igAddDeleteButtons,
      300
    );

    setTimeout(
      igAddDeleteButtons,
      1000
    );
  }

  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      boot,
      { once: true }
    );

  } else {

    boot();

  }

  /*
   * Detectar cuando loadAdminOrders()
   * vuelve a pintar las tarjetas.
   */

  const observer =
    new MutationObserver(
      function () {
        igAddDeleteButtons();
      }
    );

  function startObserver() {

    if (!document.body) return;

    observer.observe(
      document.body,
      {
        childList: true,
        subtree: true
      }
    );
  }

  startObserver();

})();

<script>
(function () {
  "use strict";

  if (window.__IG_FINAL_CHECKOUT_REPAIR) return;
  window.__IG_FINAL_CHECKOUT_REPAIR = true;

  let installed = false;

  function getDeliveryMethod() {
    const selected = document.querySelector(
      'input[name="igDeliveryMethod"]:checked'
    );

    return selected ? selected.value : "pickup";
  }

  function message(text, type) {
    try {
      if (typeof setMessage === "function") {
        setMessage(
          "checkoutMessage",
          text,
          type || "error"
        );
        return;
      }
    } catch (e) {}

    try {
      if (typeof showToast === "function") {
        showToast(text);
      }
    } catch (e) {}

    console.error(text);
  }

  function readValue(id) {
    const el = document.getElementById(id);
    return el ? String(el.value || "").trim() : "";
  }

  function readShipping() {
    return {
      full_name: readValue("igShipName"),
      phone: readValue("igShipPhone"),
      address: readValue("igShipAddress"),
      address_number: readValue("igShipNumber"),
      floor_department: readValue("igShipFloor"),
      locality: readValue("igShipLocality"),
      province: readValue("igShipProvince"),
      postal_code: readValue("igShipPostal"),
      country: readValue("igShipCountry"),
      delivery_notes: readValue("igShipNotes")
    };
  }

  function disableNativeSubmit() {
    const form = document.getElementById("checkoutForm");
    if (form) {
      form.noValidate = true;
    }
  }

  async function createFinalOrder() {

    if (
      typeof supabaseClient === "undefined" ||
      !supabaseClient
    ) {
      message(
        "No se pudo conectar con la tienda.",
        "error"
      );
      return;
    }

    if (!Array.isArray(cart) || !cart.length) {
      message(
        "El carrito está vacío.",
        "error"
      );
      return;
    }

    const name = readValue("customerName");
    const phone = readValue("customerPhone");
    const email = readValue("customerEmail");

    const paymentMethod =
      document.getElementById("paymentMethod")?.value || "";

    const deliveryMethod =
      getDeliveryMethod();

    if (!name || !phone || !email) {
      message(
        "Completá nombre, teléfono y correo electrónico.",
        "error"
      );
      return;
    }

    if (!paymentMethod) {
      message(
        "Seleccioná un método de pago.",
        "error"
      );
      return;
    }

    const shipping =
      readShipping();

    /*
     * SOLO si eligió envío se validan
     * los datos de domicilio.
     */
    if (deliveryMethod === "shipping") {

      const required = [
        shipping.full_name,
        shipping.phone,
        shipping.address,
        shipping.address_number,
        shipping.locality,
        shipping.province,
        shipping.postal_code,
        shipping.country
      ];

      if (required.some(value => !value)) {

        message(
          "Completá todos los datos necesarios para presupuestar el envío.",
          "error"
        );

        return;
      }
    }

    const button =
      document.getElementById(
        "finishOrderButton"
      );

    if (button) {
      button.disabled = true;
      button.textContent =
        "Registrando pedido...";
    }

    let orderId = null;
    let orderNumber = null;

    try {

      /*
       * =====================================================
       * 1. VERIFICAR PRODUCTOS
       * =====================================================
       */

      const productIds =
        cart.map(item => item.id);

      const {
        data: currentProducts,
        error: productsError
      } =
        await supabaseClient
          .from("ig_products")
          .select(`
            id,
            name,
            price,
            available,
            active
          `)
          .in("id", productIds);

      if (productsError) {
        throw productsError;
      }

      const validItems = [];
      let subtotal = 0;

      for (const item of cart) {

        const product =
          (currentProducts || [])
            .find(
              p => p.id === item.id
            );

        if (
          !product ||
          product.active === false ||
          product.available === false
        ) {
          throw new Error(
            'El producto "' +
            (item.name || "") +
            '" ya no está disponible.'
          );
        }

        const quantity =
          Math.max(
            1,
            Number(item.quantity || 1)
          );

        const price =
          Number(product.price || 0);

        const itemSubtotal =
          price * quantity;

        validItems.push({
          product_id: product.id,
          product_name: product.name,
          product_price: price,
          quantity: quantity,
          subtotal: itemSubtotal
        });

        subtotal += itemSubtotal;
      }

      /*
       * =====================================================
       * 2. CREAR PEDIDO
       * =====================================================
       */

      orderId =
        crypto.randomUUID();

      orderNumber =
        Date.now();

      const {
        error: orderError
      } =
        await supabaseClient
          .from("ig_orders")
          .insert({
            id: orderId,
            order_number: orderNumber,
            customer_name: name,
            customer_phone: phone,
            customer_email: email,
            payment_method: paymentMethod,
            payment_status: "pending",
            order_status: "pending",
            subtotal: subtotal,
            total: subtotal
          });

      if (orderError) {
        throw orderError;
      }

      /*
       * =====================================================
       * 3. GUARDAR PRODUCTOS DEL PEDIDO
       * =====================================================
       */

      const {
        error: itemsError
      } =
        await supabaseClient
          .from("ig_order_items")
          .insert(
            validItems.map(item => ({
              order_id: orderId,
              ...item
            }))
          );

      if (itemsError) {
        throw itemsError;
      }

      /*
       * =====================================================
       * 4. SI ES ENVÍO → CREAR COTIZACIÓN
       *
       * IMPORTANTE:
       * Usamos el RPC seguro.
       * NO usamos .insert().select() sobre
       * ig_shipping_quotes.
       * =====================================================
       */

      let shippingResult = null;

      if (deliveryMethod === "shipping") {

        const {
          data,
          error
        } =
          await supabaseClient.rpc(
            "crear_cotizacion_envio_international_gateway",
            {
              p_order_number:
                Number(orderNumber),

              p_customer_email:
                String(email),

              p_full_name:
                String(shipping.full_name),

              p_phone:
                String(shipping.phone),

              p_address:
                String(shipping.address),

              p_address_number:
                String(shipping.address_number),

              p_floor_department:
                String(
                  shipping.floor_department || ""
                ),

              p_locality:
                String(shipping.locality),

              p_province:
                String(shipping.province),

              p_postal_code:
                String(shipping.postal_code),

              p_delivery_notes:
                String(
                  shipping.delivery_notes || ""
                )
            }
          );

        if (error) {
          throw error;
        }

        if (
          !data ||
          data.success !== true
        ) {
          throw new Error(
            "No se pudo registrar la solicitud de envío."
          );
        }

        shippingResult = data;

        localStorage.setItem(
          "ig_shipping_order",
          JSON.stringify({
            order_number: orderNumber,
            phone: shipping.phone,
            access_token:
              data.access_token || null
          })
        );

      } else {

        /*
         * RETIRO EN EL LOCAL
         *
         * No se crea ninguna cotización.
         */

        localStorage.setItem(
          "ig_shipping_order",
          JSON.stringify({
            order_number: orderNumber,
            phone: phone,
            access_token: null,
            delivery_method: "pickup"
          })
        );
      }

      /*
       * =====================================================
       * 5. LIMPIAR CARRITO
       * =====================================================
       */

      cart = [];

      if (typeof saveCart === "function") {
        saveCart();
      }

      if (typeof updateCartCount === "function") {
        updateCartCount();
      }

      localStorage.setItem(
        "ig_last_order_delivery_method",
        deliveryMethod
      );

      /*
       * =====================================================
       * 6. MOSTRAR CONFIRMACIÓN REAL
       * =====================================================
       *
       * Reutilizamos la función original de la aplicación.
       * Así no rompemos Mercado Pago ni pago al contado.
       */

      if (
        typeof showConfirmation ===
        "function"
      ) {

        showConfirmation(
          {
            id: orderId,
            order_number: orderNumber,
            total: subtotal
          },
          paymentMethod
        );

      } else {

        /*
         * Respaldo por si la función original
         * no estuviera disponible.
         */

        document
          .getElementById("storeView")
          ?.classList.add("hidden");

        document
          .getElementById("cartView")
          ?.classList.add("hidden");

        document
          .getElementById("checkoutView")
          ?.classList.add("hidden");

        document
          .getElementById("confirmationView")
          ?.classList.remove("hidden");

        const number =
          document.getElementById(
            "confirmationNumber"
          );

        if (number) {
          number.textContent =
            "#" + orderNumber;
        }

        const total =
          document.getElementById(
            "confirmationTotal"
          );

        if (total) {

          if (typeof money === "function") {
            total.textContent =
              money(subtotal);
          } else {
            total.textContent =
              new Intl.NumberFormat(
                "es-AR",
                {
                  style: "currency",
                  currency: "ARS"
                }
              ).format(subtotal);
          }
        }

        const paymentBox =
          document.getElementById(
            "paymentAction"
          );

        if (paymentBox) {

          paymentBox.innerHTML =
            deliveryMethod === "pickup"
              ? `
                <div class="notice success">
                  <strong>
                    ✅ Pedido confirmado
                  </strong>
                  <br><br>
                  Tu pedido fue registrado correctamente.
                  <br><br>
                  🛍️ Elegiste retirar el pedido
                  en el local.
                </div>
              `
              : `
                <div class="notice success">
                  <strong>
                    ✅ Pedido registrado
                  </strong>
                  <br><br>
                  Tu solicitud de envío quedó pendiente
                  de cotización.
                </div>
              `;
        }
      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    } catch (error) {

      console.error(
        "IG — error definitivo de checkout:",
        error
      );

      /*
       * Intentar limpiar lo creado si falló
       * una etapa posterior.
       */

      if (orderId) {

        try {
          await supabaseClient
            .from("ig_shipping_quotes")
            .delete()
            .eq("order_id", orderId);
        } catch (e) {}

        try {
          await supabaseClient
            .from("ig_order_items")
            .delete()
            .eq("order_id", orderId);
        } catch (e) {}

        try {
          await supabaseClient
            .from("ig_orders")
            .delete()
            .eq("id", orderId);
        } catch (e) {}
      }

      message(
        error?.message ||
        "No se pudo registrar el pedido.",
        "error"
      );

    } finally {

      if (button) {
        button.disabled = false;
        button.textContent =
          "Confirmar pedido";
      }
    }
  }


  function install() {

    const form =
      document.getElementById(
        "checkoutForm"
      );

    const button =
      document.getElementById(
        "finishOrderButton"
      );

    if (!form || !button) {
      return false;
    }

    /*
     * Quitamos la validación HTML nativa.
     * Nosotros validamos exactamente lo que
     * corresponde a retiro o envío.
     */

    form.noValidate = true;

    if (
      button.dataset.igFinalCheckout
    ) {
      return true;
    }

    /*
     * Muy importante:
     * convertimos el botón en botón normal.
     * Así no se dispara el submit antiguo.
     */

    button.type = "button";

    button.addEventListener(
      "click",
      function (event) {

        event.preventDefault();
        event.stopPropagation();

        createFinalOrder();

      },
      false
    );

    button.dataset.igFinalCheckout =
      "1";

    installed = true;

    return true;
  }


  function boot() {

    if (install()) {
      return;
    }

    setTimeout(install, 300);
    setTimeout(install, 700);
    setTimeout(install, 1500);
    setTimeout(install, 2500);
  }

  boot();

  const observer =
    new MutationObserver(function () {

      if (!installed) {
        install();
      }

    });

  if (document.body) {

    observer.observe(
      document.body,
      {
        childList: true,
        subtree: true
      }
    );
  }

})();

  /* ---------------------------------------------------------
     AUTENTICACIÓN
     --------------------------------------------------------- */

  async function register() {
    if (!supabaseReady()) {
      showAuthMessage(
        "Supabase todavía no está disponible.",
        true
      );
      return;
    }

    const name =
      document.getElementById("igRegisterName").value.trim();

    const phone =
      document.getElementById("igRegisterPhone").value.trim();

    const email =
      document.getElementById("igRegisterEmail").value.trim()
        .toLowerCase();

    const password =
      document.getElementById("igRegisterPassword").value;

    if (!name || !email || !password) {
      showAuthMessage(
        "Completá nombre, correo y contraseña.",
        true
      );
      return;
    }

    if (password.length < 6) {
      showAuthMessage(
        "La contraseña debe tener al menos 6 caracteres.",
        true
      );
      return;
    }

    showAuthMessage("Creando tu cuenta…", false);

    try {
      const result =
        await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: name,
              phone: phone
            }
          }
        });

      if (result.error) {
        throw result.error;
      }

      if (result.data && result.data.user) {
        currentUser = result.data.user;
      }

      if (
        result.data &&
        result.data.session
      ) {
        showAuthMessage(
          "Cuenta creada correctamente.",
          false
        );

        await loadProfile();
        renderAccount();
        await linkVisibleConfirmationOrder();
        await loadOrders();
      } else {
        showAuthMessage(
          "Cuenta creada. Revisá tu correo para confirmar la cuenta y después iniciá sesión.",
          false
        );
      }

    } catch (error) {
      showAuthMessage(
        error && error.message
          ? error.message
          : "No se pudo crear la cuenta.",
        true
      );
    }
  }

  async function login() {
    if (!supabaseReady()) {
      showAuthMessage(
        "Supabase todavía no está disponible.",
        true
      );
      return;
    }

    const email =
      document.getElementById("igAccountEmail").value.trim()
        .toLowerCase();

    const password =
      document.getElementById("igAccountPassword").value;

    if (!email || !password) {
      showAuthMessage(
        "Completá correo y contraseña.",
        true
      );
      return;
    }

    showAuthMessage("Iniciando sesión…", false);

    try {
      const result =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (result.error) {
        throw result.error;
      }

      currentUser =
        result.data && result.data.user
          ? result.data.user
          : null;

      await loadProfile();
      await linkVisibleConfirmationOrder();

      renderAccount();
      await loadOrders();

      notify(
        "Sesión iniciada correctamente.",
        "success"
      );

    } catch (error) {
      showAuthMessage(
        error && error.message
          ? error.message
          : "Correo o contraseña incorrectos.",
        true
      );
    }
  }

  async function sendPasswordRecovery() {
    if (!supabaseReady()) return;

    const email =
      document.getElementById("igAccountEmail").value.trim()
        .toLowerCase();

    if (!email) {
      showAuthMessage(
        "Escribí tu correo electrónico primero.",
        true
      );
      return;
    }

    try {
      const result =
        await supabaseClient.auth.resetPasswordForEmail(
          email,
          {
            redirectTo: window.location.href
          }
        );

      if (result.error) {
        throw result.error;
      }

      showAuthMessage(
        "Te enviamos las instrucciones para recuperar tu contraseña.",
        false
      );

    } catch (error) {
      showAuthMessage(
        error && error.message
          ? error.message
          : "No se pudo enviar el correo de recuperación.",
        true
      );
    }
  }

  async function logout() {
    if (!supabaseReady()) return;

    try {
      await supabaseClient.auth.signOut();
    } catch (e) {}

    currentUser = null;
    profile = null;

    updateAccountButton();
    renderAccount();
  }

  function showAuthMessage(message, error) {
    const box =
      document.getElementById("igAccountAuthMessage");

    if (!box) return;

    box.innerHTML =
      '<div class="' +
      (error
        ? "ig-account-error"
        : "ig-account-success") +
      '">' +
      esc(message) +
      "</div>";
  }

  /* ---------------------------------------------------------
     PERFIL
     --------------------------------------------------------- */

  async function loadProfile() {
    if (!currentUser || !supabaseReady()) return;

    try {
      const result =
        await supabaseClient
          .from("ig_customer_profiles")
          .select("*")
          .eq("user_id", currentUser.id)
          .maybeSingle();

      if (result.error) {
        console.error(
          "International Gateway: error cargando perfil",
          result.error
        );
        return;
      }

      profile = result.data || null;

      if (!profile) {
        const insertResult =
          await supabaseClient
            .from("ig_customer_profiles")
            .insert({
              user_id: currentUser.id,
              full_name:
                currentUser.user_metadata &&
                currentUser.user_metadata.full_name
                  ? currentUser.user_metadata.full_name
                  : "",
              phone:
                currentUser.user_metadata &&
                currentUser.user_metadata.phone
                  ? currentUser.user_metadata.phone
                  : "",
              email: currentUser.email || ""
            })
            .select("*")
            .single();

        if (!insertResult.error) {
          profile = insertResult.data;
        }
      }

    } catch (error) {
      console.error(
        "International Gateway: error de perfil",
        error
      );
    }
  }

  async function saveProfile() {
    if (!currentUser || !supabaseReady()) return;

    const data = {
      full_name:
        document
          .getElementById("igProfileName")
          .value.trim(),

      phone:
        document
          .getElementById("igProfilePhone")
          .value.trim(),

      address:
        document
          .getElementById("igProfileAddress")
          .value.trim(),

      address_number:
        document
          .getElementById("igProfileAddressNumber")
          .value.trim(),

      floor_department:
        document
          .getElementById("igProfileFloor")
          .value.trim(),

      locality:
        document
          .getElementById("igProfileLocality")
          .value.trim(),

      province:
        document
          .getElementById("igProfileProvince")
          .value.trim(),

      postal_code:
        document
          .getElementById("igProfilePostal")
          .value.trim(),

      country:
        document
          .getElementById("igProfileCountry")
          .value.trim() || "Argentina",

      delivery_notes:
        document
          .getElementById("igProfileNotes")
          .value.trim(),

      email: currentUser.email || ""
    };

    try {
      const result =
        await supabaseClient
          .from("ig_customer_profiles")
          .upsert(
            {
              user_id: currentUser.id,
              ...data,
              updated_at: new Date().toISOString()
            },
            {
              onConflict: "user_id"
            }
          )
          .select("*")
          .single();

      if (result.error) {
        throw result.error;
      }

      profile = result.data;

      notify(
        "Datos guardados correctamente.",
        "success"
      );

    } catch (error) {
      notify(
        "No se pudieron guardar los datos.",
        "error"
      );

      console.error(
        "International Gateway: error guardando perfil",
        error
      );
    }
  }

  /* ---------------------------------------------------------
     PEDIDOS DEL CLIENTE
     --------------------------------------------------------- */

  async function loadOrders() {
    if (!currentUser || !supabaseReady()) return;

    const container =
      document.getElementById("igCustomerOrders");

    try {
      const result =
        await supabaseClient.rpc(
          "ig_get_my_customer_orders"
        );

      if (result.error) {
        throw result.error;
      }

      const orders =
        Array.isArray(result.data)
          ? result.data
          : [];

      renderOrders(orders);

      updateQuoteBadge(orders);

    } catch (error) {
      console.error(
        "International Gateway: error cargando pedidos",
        error
      );

      if (container) {
        container.innerHTML = `
          <div class="ig-account-error">
            No se pudieron cargar tus pedidos en este momento.
          </div>
        `;
      }
    }
  }

  function renderOrders(orders) {
    const container =
      document.getElementById("igCustomerOrders");

    if (!container) return;

    if (!orders.length) {
      container.innerHTML = `
        <div class="ig-account-empty">
          <div style="font-size:35px;margin-bottom:8px;">
            📦
          </div>
          <strong>Todavía no tenés compras asociadas.</strong>
          <p class="ig-account-muted">
            Cuando realices una compra usando el mismo
            correo de tu cuenta, podremos vincularla.
          </p>
        </div>
      `;
      return;
    }

    container.innerHTML = orders
      .map(renderOrder)
      .join("");
  }

  function renderOrder(order) {
    const items =
      Array.isArray(order.items)
        ? order.items
        : [];

    const shipping =
      order.shipping || null;

    let itemsHtml = "";

    if (items.length) {
      itemsHtml = items
        .map(function (item) {
          return `
            <div class="ig-account-item">
              <span>
                ${esc(item.product_name)}
                × ${Number(item.quantity || 0)}
              </span>
              <strong>
                ${money(item.subtotal)}
              </strong>
            </div>
          `;
        })
        .join("");
    }

    let shippingHtml = "";

    if (shipping) {
      const quoted =
        shipping.status === "quoted" ||
        shipping.status === "accepted";

      shippingHtml = `
        <div class="ig-account-shipping ${
          quoted ? "" : "pending"
        }">

          <strong>
            🚚 Envío:
            ${esc(shippingStatusLabel(shipping.status))}
          </strong>

          <div style="margin-top:7px;">
            ${
              quoted
                ? "Costo de envío: <strong>" +
                  money(shipping.shipping_cost) +
                  "</strong>"
                : "El administrador todavía está calculando el costo del envío."
            }
          </div>

          ${
            quoted
              ? `
                <div style="margin-top:5px;">
                  Total actualizado:
                  <strong>
                    ${money(
                      Number(order.subtotal || 0) +
                      Number(shipping.shipping_cost || 0)
                    )}
                  </strong>
                </div>
              `
              : ""
          }

          ${
            shipping.admin_notes
              ? `
                <div class="ig-account-note">
                  <strong>Mensaje del administrador:</strong><br>
                  ${esc(shipping.admin_notes)}
                </div>
              `
              : ""
          }

        </div>
      `;
    }

    const date =
      order.created_at
        ? new Date(order.created_at).toLocaleString(
            "es-AR",
            {
              dateStyle: "medium",
              timeStyle: "short"
            }
          )
        : "";

    return `
      <div class="ig-account-order">

        <div class="ig-account-order-head">

          <div>
            <div class="ig-account-order-number">
              Pedido #${esc(order.order_number)}
            </div>

            <div class="ig-account-muted">
              ${esc(date)}
            </div>
          </div>

          <div>
            <span class="ig-account-status">
              ${esc(statusLabel(order.order_status))}
            </span>
          </div>

        </div>

        <div>
          ${itemsHtml}
        </div>

        <div class="ig-account-total">
          Productos:
          ${money(order.subtotal)}
        </div>

        ${shippingHtml}

        <div class="ig-account-actions">

          <button
            class="ig-account-btn whatsapp"
            type="button"
            data-ig-order="${esc(order.order_number)}">
            💬 Consultar este pedido
          </button>

        </div>

      </div>
    `;
  }

  /* ---------------------------------------------------------
     VINCULAR PEDIDO CONFIRMADO CON LA CUENTA
     
     No toca showConfirmation().
     Observa únicamente el número mostrado en:
     #confirmationNumber
     --------------------------------------------------------- */

  async function linkVisibleConfirmationOrder() {
    if (!currentUser || !supabaseReady()) return;

    const confirmation =
      document.getElementById("confirmationNumber");

    if (!confirmation) return;

    const text =
      confirmation.textContent || "";

    const match =
      text.match(/#?\s*(\d+)/);

    if (!match) return;

    const orderNumber =
      Number(match[1]);

    if (!Number.isFinite(orderNumber)) return;

    try {
      const result =
        await supabaseClient.rpc(
          "ig_link_order_by_number_current_customer",
          {
            p_order_number: orderNumber
          }
        );

      if (result.error) {
        console.warn(
          "International Gateway: no se pudo vincular el pedido",
          result.error
        );
        return;
      }

      if (result.data === true) {
        console.log(
          "International Gateway: pedido vinculado a la cuenta.",
          orderNumber
        );
      }

    } catch (error) {
      console.warn(
        "International Gateway: error vinculando pedido",
        error
      );
    }
  }

  /* ---------------------------------------------------------
     OBSERVAR CONFIRMACIÓN SIN INTERVENIR EN CHECKOUT
     --------------------------------------------------------- */

  function watchConfirmation() {
    const observer =
      new MutationObserver(function () {
        if (currentUser) {
          linkVisibleConfirmationOrder();
        }
      });

    observer.observe(document.body, {
      childList: true,
      subtree: true,
      characterData: true
    });

    window.__IG_CUSTOMER_ACCOUNT_CONFIRMATION_OBSERVER =
      observer;
  }

  /* ---------------------------------------------------------
     BADGE DE COTIZACIÓN
     --------------------------------------------------------- */

  function updateQuoteBadge(orders) {
    const badge =
      document.getElementById(
        "igCustomerAccountBadge"
      );

    if (!badge) return;

    const hasQuote =
      orders.some(function (order) {
        return (
          order.shipping &&
          order.shipping.status === "quoted"
        );
      });

    badge.style.display =
      hasQuote ? "inline-block" : "none";
  }

  /* ---------------------------------------------------------
     WHATSAPP
     --------------------------------------------------------- */

  function openWhatsApp(orderNumber) {
    let message =
      "Hola International Gateway. ";

    if (orderNumber) {
      message +=
        "Quiero consultar mi pedido #" +
        orderNumber +
        ".";
    } else {
      message +=
        "Quiero consultar mi cuenta y mi pedido.";
    }

    const url =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      encodeURIComponent(message);

    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );
  }

  async function initializeAuth() {
    if (!supabaseReady()) {
      setTimeout(initializeAuth, 500);
      return;
    }

    try {
      const result =
        await supabaseClient.auth.getUser();

      if (
        result.data &&
        result.data.user
      ) {
        currentUser =
          result.data.user;

        await loadProfile();

        if (accountOpen) {
          renderAccount();
        }

        await linkVisibleConfirmationOrder();
      }

    } catch (error) {
      console.warn(
        "International Gateway: no se pudo comprobar la sesión.",
        error
      );
    }

    try {
      const authResult =
        supabaseClient.auth.onAuthStateChange(
          function (event, session) {

            currentUser =
              session && session.user
                ? session.user
                : null;

            if (!currentUser) {
              profile = null;
            }

            updateAccountButton();

            if (accountOpen) {
              setTimeout(function () {
                if (currentUser) {
                  loadProfile().then(function () {
                    renderAccount();
                    linkVisibleConfirmationOrder();
                  });
                } else {
                  renderAccount();
                }
              }, 0);
            }

          }
        );

      authSubscription =
        authResult.data &&
        authResult.data.subscription
          ? authResult.data.subscription
          : null;

    } catch (error) {
      console.warn(
        "International Gateway: no se pudo registrar el listener de Auth.",
        error

  function updateAccountButton() {

  /* ---------------------------------------------------------
     ACTUALIZACIÓN PERIÓDICA

  function startRefresh() {
    if (refreshTimer) {
      clearInterval(refreshTimer);
    }

    refreshTimer =
      setInterval(function () {

        if (
          currentUser &&
          accountOpen
        ) {
          loadProfile();
          loadOrders();
          linkVisibleConfirmationOrder();
        }

      }, 15000);
  }

  /* ---------------------------------------------------------
     ARRANQUE
     --------------------------------------------------------- */

  function start() {
    injectStyles();
    createInterface();
    watchConfirmation();
    startRefresh();
    updateAccountButton();
    initializeAuth();
  }

  if (
    document.readyState === "loading"
  ) {
    document.addEventListener(

      start,

    );
  } else {
    start();

})();

      return;

    const overlay = document.createElement("div");

      .getElementById("igCustomerNotificationClose")

        closeNotifications();
      }
    });
  }

    createModal();

    const overlay =
      document.getElementById("igCustomerNotificationOverlay");

    if (!overlay) return;

    overlay.style.display = "flex";
    loadNotifications();
  }

  function closeNotifications() {

      document.getElementById("igCustomerNotificationOverlay");

    if (overlay) {
      overlay.style.display = "none";
    }
  }

  /* ---------------------------------------------------------
     SESIÓN
     --------------------------------------------------------- */
  async function getCurrentUser() {
    try {
      if (
        typeof supabaseClient === "undefined" ||
        !supabaseClient ||
        !supabaseClient.auth
      ) {
        return null;
      }

      const result =
        await supabaseClient.auth.getUser();

      return result && result.data
        ? result.data.user || null
        : null;

    } catch (error) {
      console.warn(
        "International Gateway: no se pudo obtener el usuario.",
        error
      );

      return null;
    }
  }

  /* ---------------------------------------------------------
     CARGAR NOTIFICACIONES
     --------------------------------------------------------- */
  async function loadNotifications() {
    const list =
      document.getElementById(
        "igCustomerNotificationList"
      );

    if (!list) return;

    const user = await getCurrentUser();

    if (!user) {
      list.innerHTML = `
        <div id="igCustomerNotificationEmpty">
          <strong>Inicia sesión para ver tus notificaciones.</strong>
          <br><br>
          Tus avisos de pedidos aparecerán aquí.
        </div>
      `;

      updateBadge(0);
      return;
    }

    list.innerHTML = `
      <div id="igCustomerNotificationEmpty">
        Cargando notificaciones...
      </div>
    `;

    try {
      const result =
        await supabaseClient.rpc(
          "ig_get_my_customer_notifications"
        );

      if (result.error) {
        throw result.error;
      }

      const notifications =
        Array.isArray(result.data)
          ? result.data
          : [];

      renderNotifications(notifications);

    } catch (error) {
      console.error(
        "International Gateway: error cargando notificaciones:",
        error
      );

      list.innerHTML = `
        <div id="igCustomerNotificationEmpty">
          No se pudieron cargar las notificaciones.
          <br><br>
          <button
            type="button"
            onclick="window.__IGReloadCustomerNotifications && window.__IGReloadCustomerNotifications()">
            Reintentar
          </button>
        </div>
      `;
    }
  }

  /* ---------------------------------------------------------
     RENDER
     --------------------------------------------------------- */
  function renderNotifications(notifications) {
    const list =
      document.getElementById(
        "igCustomerNotificationList"
      );

    if (!list) return;

    if (!notifications.length) {
      list.innerHTML = `
        <div id="igCustomerNotificationEmpty">
          <div style="font-size:34px;margin-bottom:10px;">
            🔔
          </div>
          <strong>No tienes notificaciones nuevas.</strong>
          <br>
          Aquí aparecerán las actualizaciones de tus pedidos.
        </div>
      `;

      updateBadge(0);
      return;
    }

    let unread = 0;

    list.innerHTML = notifications
      .map(function (notification) {
        const isUnread =
          !notification.read_at;

        if (isUnread) {
          unread++;
        }

        const safeTitle =
          escapeHtml(notification.title || "Actualización");

        const safeMessage =
          escapeHtml(notification.message || "");

        const orderNumber =
          notification.order_number
            ? "#" + notification.order_number
            : "";

        const date =
          formatDate(notification.created_at);

        return `
          <div
            class="igCustomerNotificationItem ${isUnread ? "unread" : "read"}"
            data-notification-id="${escapeHtml(String(notification.id))}"
            role="button"
            tabindex="0">

            <div class="igCustomerNotificationTitle">
              ${
                isUnread
                  ? '<span class="igCustomerNotificationUnread"></span>'
                  : ""
              }
              ${safeTitle}
            </div>

            <div class="igCustomerNotificationMessage">
              ${safeMessage}
            </div>

            <div class="igCustomerNotificationMeta">
              <span>${orderNumber}</span>
              <span>${date}</span>
            </div>
          </div>
        `;
      })
      .join("");

    list
      .querySelectorAll(
        ".igCustomerNotificationItem"
      )
      .forEach(function (item) {

        async function mark() {
          const id =
            item.getAttribute(
              "data-notification-id"
            );

          if (!id) return;

          await markAsRead(id);

          item.classList.remove("unread");
          item.classList.add("read");

          const dot =
            item.querySelector(
              ".igCustomerNotificationUnread"
            );

          if (dot) {
            dot.remove();
          }

          updateBadge(
            Math.max(0, unread - 1)
          );
        }

        item.addEventListener("click", mark);

        item.addEventListener("keydown", function (event) {
          if (
            event.key === "Enter" ||
            event.key === " "
          ) {
            event.preventDefault();
            mark();
          }
        });
      });

    updateBadge(unread);
  }

  /* ---------------------------------------------------------
     MARCAR COMO LEÍDA
     --------------------------------------------------------- */
  async function markAsRead(notificationId) {
    try {
      const result =
        await supabaseClient.rpc(
          "ig_mark_customer_notification_read",
          {
            p_notification_id: notificationId
          }
        );

      if (result.error) {
        console.warn(
          "International Gateway: no se pudo marcar como leída.",
          result.error
        );
      }

    } catch (error) {
      console.warn(
        "International Gateway: error marcando notificación.",
        error
      );
    }
  }

  /* ---------------------------------------------------------
     BADGE
     --------------------------------------------------------- */
  function updateBadge(count) {
    const badge =
      document.getElementById(
        "igCustomerNotificationBadge"
      );

    if (!badge) return;

    const number = Number(count) || 0;

    if (number <= 0) {
      badge.style.display = "none";
      badge.textContent = "";
      return;
    }

    badge.textContent =
      number > 99 ? "99+" : String(number);

    badge.style.display = "flex";
  }

  /* ---------------------------------------------------------
     ACTUALIZAR BADGE SIN ABRIR MODAL
     --------------------------------------------------------- */
  async function refreshBadge() {
    const user = await getCurrentUser();

    if (!user) {
      updateBadge(0);
      return;
    }

    try {
      const result =
        await supabaseClient.rpc(
          "ig_get_my_customer_notifications"
        );

      if (result.error) {
        return;
      }

      const notifications =
        Array.isArray(result.data)
          ? result.data
          : [];

      const unread =
        notifications.filter(
          function (item) {
            return !item.read_at;
          }
        ).length;

      updateBadge(unread);

    } catch (error) {
      console.warn(
        "International Gateway: no se pudo actualizar el contador.",
        error
      );
    }
  }

  /* ---------------------------------------------------------
     UTILIDADES
     --------------------------------------------------------- */
  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(value) {
    if (!value) return "";

    try {
      const date = new Date(value);

      if (isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleString(
        "es-AR",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    } catch (error) {
      return "";
    }
  }

  /* ---------------------------------------------------------
     FUNCIÓN PÚBLICA DE RECARGA
     --------------------------------------------------------- */
  window.__IGReloadCustomerNotifications =
    loadNotifications;

  /* ---------------------------------------------------------
     INICIO
     --------------------------------------------------------- */
  function init() {
    createButton();
    createModal();
    refreshBadge();

    /*
     * Actualiza el contador periódicamente.
     * No modifica pedidos ni checkout.
     */
    setInterval(
      refreshBadge,
      15000
    );
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      init,
      { once: true }
    );
  } else {
    init();
  }

})();
