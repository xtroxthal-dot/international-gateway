  /* ==========================================================
     DETECTAR BOTONES DE LAS DOS SECCIONES
     ========================================================== */

  function conectarBotones() {

    const elementos =
      document.querySelectorAll(
        "button, a, [role='button']"
      );


    elementos.forEach(elemento => {

      if (
        elemento.dataset
          .igSpecialConnected === "1"
      ) {

        return;

      }


      const texto =
        normalizar(
          elemento.textContent
        );


      let categoria = null;


      if (
        texto.includes(
          normalizar(
            "Granja lo de Nico"
          )
        )
      ) {

        /*
         * No interceptamos cualquier título.
         * Solo elementos que además indiquen
         * que sirven para ver/entrar a productos.
         */

        if (
          texto.includes("ver productos") ||
          texto.includes("productos")
        ) {

          categoria =
            CATEGORIA_GRANJA;

        }

      }


      if (
        texto.includes(
          normalizar(
            "Iberian Mediterránea"
          )
        )
      ) {

        if (
          texto.includes("ver productos") ||
          texto.includes("productos")
        ) {

          categoria =
            CATEGORIA_IBERIAN;

        }

      }


      if (!categoria) {
        return;
      }


      elemento.dataset
        .igSpecialConnected = "1";


      elemento.addEventListener(
        "click",
        function (event) {

          event.preventDefault();

          event.stopImmediatePropagation();


          mostrarCategoriaEspecial(
            categoria
          );

        },
        true
      );

    });

  }


  /* ==========================================================
     API PÚBLICA
     ========================================================== */

  window.InternationalGatewaySpecialCategories = {

    showGranja:
      function () {

        mostrarCategoriaEspecial(
          CATEGORIA_GRANJA
        );

      },

    showIberian:
      function () {

        mostrarCategoriaEspecial(
          CATEGORIA_IBERIAN
        );

      },

    reload:
      function () {

        conectarBotones();

      }

  };


  /* ==========================================================
     ARRANQUE
     ========================================================== */

  function iniciar() {

    conectarBotones();


    /*
     * La aplicación genera parte del contenido
     * dinámicamente, así que volvemos a conectar
     * cuando aparecen nuevos elementos.
     */

    const observer =
      new MutationObserver(
        function () {

          conectarBotones();

        }
      );


    if (document.body) {

      observer.observe(
        document.body,
        {
          childList: true,
          subtree: true
        }
      );

    }

  }


  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      iniciar,
      {
        once: true
      }
    );

  } else {

    iniciar();

  }


  console.log(
    "[International Gateway] Reparador de Granja lo de Nico + Iberian Mediterránea activo."
  );

})();

    /*

      card.querySelector(":scope > img");

        "igMainGatewayContent"

      image.style.position =
        "relative";

    if (content) {

      content.style.position =
        "relative";

    }


    return true;

  function conectarInicio() {

    const botones =
      document.querySelectorAll(
        'button[onclick="showStore()"]'

      if (

          .igHomeRepairConnected === "1"

        .igHomeRepairConnected = "1";

            ocultarCatalogo,

        false
      );

    });

            /* Actualizar Pedidos */

            try {

              if (
                typeof loadAdminOrders ===
                "function"
              ) {

                loadAdminOrders();

              }

            }

            catch (error) {

              console.warn(
                "[IG Order Alert] Pedidos:",
                error
              );

            }


            /* Actualizar Dashboard */

            try {

              if (
                typeof loadAdminDashboard ===
                "function"
              ) {

                loadAdminDashboard();

              }

            }

            catch (error) {

              console.warn(
                "[IG Order Alert] Dashboard:",
                error
              );

            }

          }
        );


    orderAlertChannel =
      currentChannel;


    /* ========================================================
       ESTADO DE LA CONEXIÓN
       ======================================================== */

    currentChannel.subscribe(
      function (status, error) {

        console.log(
          "[IG Order Alert] Realtime:",
          status,
          error || ""
        );


        /* CONECTADO */

        if (
          status ===
          "SUBSCRIBED"
        ) {

          console.log(
            "[IG Order Alert] ✅ CONECTADO — escuchando nuevos pedidos."
          );

          return;

        }


        /* ERROR / TIMEOUT / CIERRE */

        if (
          status ===
            "CHANNEL_ERROR" ||
          status ===
            "TIMED_OUT" ||
          status ===
            "CLOSED"
        ) {

          console.warn(
            "[IG Order Alert] Realtime desconectado:",
            status,
            error || ""
          );


          try {

            supabaseClient
              .removeChannel(
                currentChannel
              );

          }

          catch (removeError) {

            console.warn(
              "[IG Order Alert] Error cerrando canal:",
              removeError
            );

          }


          if (
            orderAlertChannel ===
            currentChannel
          ) {

            orderAlertChannel =
              null;

          }


          scheduleReconnect();

        }

      }
    );

  }


  /* ==========================================================
     ACTIVAR SISTEMA
     ========================================================== */

  function activateOrderAlert() {

    unlockAudio();

    requestNotificationPermission();

    startOrderAlert();

  }


  /* ==========================================================
     DETECTAR APERTURA DEL ADMINISTRADOR
     
     No dependemos de openAdminPanel().
     No dependemos del botón "Pedidos".
     Observamos directamente si el panel
     de administración deja de estar oculto.
     ========================================================== */

  function checkAdminPanel() {

    var panel =
      document.getElementById(
        "adminPanel"
      );


    if (!panel) {
      return;
    }


    var style =
      window.getComputedStyle(
        panel
      );


    var visible =
      !panel.classList.contains(
        "hidden"
      ) &&
      style.display !==
        "none" &&
      style.visibility !==
        "hidden";


    if (visible) {

      activateOrderAlert();

    }

  }


  /* ==========================================================
     OBSERVADOR DEL PANEL ADMIN
     ========================================================== */

  function startAdminObserver() {

    var panel =
      document.getElementById(
        "adminPanel"
      );


    if (!panel) {

      setTimeout(
        startAdminObserver,
        1000
      );

      return;

    }


    var observer =
      new MutationObserver(
        function () {

          checkAdminPanel();

        }
      );


    observer.observe(
      panel,
      {
        attributes: true,
        attributeFilter: [
          "class",
          "style"
        ]
      }
    );


    checkAdminPanel();

  }


  /* ==========================================================
     CLIC DENTRO DEL ADMIN
     
     Sirve además para desbloquear
     el audio del navegador mediante
     una interacción real del usuario.
     ========================================================== */

  document.addEventListener(
    "click",
    function (event) {

      var target =
        event.target &&
        event.target.closest
          ? event.target.closest(
              "#adminPanel"
            )
          : null;


      if (target) {

        activateOrderAlert();

      }

    },
    true
  );


  /* ==========================================================
     VOLVER A ACTIVAR AL REGRESAR A LA PÁGINA
     ========================================================== */

  document.addEventListener(
    "visibilitychange",
    function () {

      if (
        !document.hidden
      ) {

        checkAdminPanel();

      }

    }
  );


  window.addEventListener(
    "focus",
    function () {

      checkAdminPanel();

    }
  );


  /* ==========================================================
     ARRANQUE
     ========================================================== */

  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      startAdminObserver,
      {
        once: true
      }
    );

  }

  else {

    startAdminObserver();

  }


  /* ==========================================================
     LIMPIEZA
     ========================================================== */

  window.addEventListener(
    "beforeunload",
    stopOrderAlert
  );


  console.log(
    "[IG Order Alert] V2 FINAL activa."
  );


})();

<script>
(function(){

  /* =========================================================
     💳 COLOCAR CRÉDITO EXACTAMENTE DEBAJO DEL CARRITO
     ========================================================= */

  function colocarCreditoDebajoDelCarrito(){

    var credito =
      document.getElementById(
        "igExternalCreditSearch"
      );

    var carrito =
      document.querySelector(
        ".cart-button"
      );

    if(!credito || !carrito){
      return;
    }

    var rect =
      carrito.getBoundingClientRect();

    /*
     * El borde derecho del crédito coincide
     * con el borde derecho del carrito.
     */
    var right =
      window.innerWidth - rect.right;

    /*
     * Lo colocamos inmediatamente debajo
     * del carrito.
     */
    var top =
      rect.bottom + 6;

    credito.style.setProperty(
      "right",
      Math.max(8, right) + "px",
      "important"
    );

    credito.style.setProperty(
      "left",
      "auto",
      "important"
    );

    credito.style.setProperty(
      "top",
      Math.max(8, top) + "px",
      "important"
    );

  }


  /* =========================================================
     🔧 ESPERAR A QUE LOS BOTONES DINÁMICOS EXISTAN
     ========================================================= */

  function repararPosiciones(){

    colocarCreditoDebajoDelCarrito();

  }


  /*
   * Primera ejecución.
   */
  repararPosiciones();


  /*
   * Refuerzos porque International Gateway
   * genera algunos elementos dinámicamente.
   */
  setTimeout(
    repararPosiciones,
    100
  );

  setTimeout(
    repararPosiciones,
    500
  );

  setTimeout(
    repararPosiciones,
    1200
  );


  /*
   * Si cambia el tamaño/orientación del teléfono,
   * recalculamos la posición del crédito.
   */
  window.addEventListener(
    "resize",
    repararPosiciones,
    {passive:true}
  );


  /*
   * Al desplazarse, volvemos a comprobar
   * la posición del carrito sticky.
   */
  window.addEventListener(
    "scroll",
    colocarCreditoDebajoDelCarrito,
    {passive:true}
  );


  /*
   * Observamos solamente la creación de elementos.
   * No modificamos productos ni contenido.
   */
  if(
    document.body &&
    typeof MutationObserver !== "undefined"
  ){

    var observer =
      new MutationObserver(
        function(){

          colocarCreditoDebajoDelCarrito();

        }
      );

    observer.observe(
      document.body,
      {
        childList:true,
        subtree:true
      }
    );

  }

})();

  <!-- =========================================================

<script>
(function(){

  "use strict";

  const FAVORITES_KEY = "ig_favorite_products_v2";

  function obtenerIdsFavoritos(){

    try{

      const datos =
        JSON.parse(
          localStorage.getItem(FAVORITES_KEY) || "[]"
        );

      return Array.isArray(datos)
        ? datos.map(String)
        : [];

    }catch(e){

      return [];

    }

  }


  function buscarTarjetaProducto(id){

    const corazones =
      document.querySelectorAll(
        ".ig-favorite-button"
      );

    for(let i = 0; i < corazones.length; i++){

      const boton =
        corazones[i];

      if(
        String(
          boton.dataset.productId || ""
        ) === String(id)
      ){

        return boton.closest(
          ".product-card"
        );

      }

    }

    return null;

  }


  function repararListaFavoritos(){

    const lista =
      document.getElementById(
        "igFavoritesList"
      );

    if(!lista){
      return;
    }


    const ids =
      obtenerIdsFavoritos();


    /*
     * Si realmente no hay favoritos,
     * dejamos actuar al sistema original.
     */
    if(!ids.length){
      return;
    }


    /*
     * Si el sistema original ya consiguió
     * mostrar correctamente los productos,
     * no tocamos absolutamente nada.
     */
    const items =
      lista.querySelectorAll(
        ".ig-favorite-item"
      );

    if(items.length){
      return;
    }


    /*
     * Reconstruimos la lista utilizando
     * las tarjetas reales que ya existen.
     */
    const encontrados = [];


    ids.forEach(function(id){

      const card =
        buscarTarjetaProducto(id);

      if(!card){
        return;
      }


      const titulo =
        card.querySelector("h3");


      const precio =
        card.querySelector(".price");


      const imagen =
        card.querySelector(
          ".product-image img"
        );


      encontrados.push({

        id:String(id),

        name:
          titulo
            ? titulo.textContent.trim()
            : "Producto",

        price:
          precio
            ? precio.textContent.trim()
            : "",

        image:
          imagen
            ? imagen.src
            : ""

      });

    });


    /*
     * Si encontramos productos,
     * reconstruimos solamente el contenido
     * de la lista.
     */
    if(encontrados.length){

      lista.innerHTML = "";


      encontrados.forEach(function(product){

        const item =
          document.createElement("div");

        item.className =
          "ig-favorite-item";


        const imageBox =
          document.createElement("div");

        imageBox.className =
          "ig-favorite-item-image";


        if(product.image){

          const img =
            document.createElement("img");

          img.src =
            product.image;

          img.alt =
            product.name;

          imageBox.appendChild(img);

        }else{

          imageBox.textContent =
            "🛍️";

        }


        const info =
          document.createElement("div");

        info.className =
          "ig-favorite-item-info";


        const name =
          document.createElement("strong");

        name.textContent =
          product.name;


        const price =
          document.createElement("div");

        price.className =
          "ig-favorite-item-price";

        price.textContent =
          product.price;


        info.appendChild(name);
        info.appendChild(price);


        const remove =
          document.createElement("button");

        remove.type =
          "button";

        remove.className =
          "ig-favorite-remove";

        remove.textContent =
          "×";

        remove.title =
          "Quitar de favoritos";


        remove.addEventListener(
          "click",
          function(){

            const actuales =
              obtenerIdsFavoritos()
                .filter(function(id){

                  return String(id) !==
                    String(product.id);

                });


            localStorage.setItem(
              FAVORITES_KEY,
              JSON.stringify(actuales)
            );


            /*
             * Actualizar corazón correspondiente.
             */
            const corazones =
              document.querySelectorAll(
                ".ig-favorite-button"
              );


            corazones.forEach(function(btn){

              if(
                String(
                  btn.dataset.productId || ""
                ) === String(product.id)
              ){

                btn.classList.remove("active");

                btn.textContent = "♡";

                btn.setAttribute(
                  "aria-pressed",
                  "false"
                );

              }

            });


            /*
             * Actualizar contador.
             */

<script>
(function(){

  "use strict";

  if(window.__IG_FAVORITES_BUY_PATCH){
    return;
  }

  window.__IG_FAVORITES_BUY_PATCH = true;


  /*
   * Busca el nombre del producto mostrado
   * dentro del favorito.
   */
  function obtenerNombre(item){

    const nombre =
      item.querySelector(
        ".ig-favorite-item-info strong"
      );

    return nombre
      ? nombre.textContent.trim()
      : "";

  }


  /*
   * Busca el producto real en products.
   */
  function obtenerProducto(nombre){

    try{

      if(
        Array.isArray(window.products)
      ){

        return window.products.find(
          function(product){

            return(
              product &&
              String(
                product.name || ""
              ).trim() === nombre
            );

          }
        ) || null;

      }

    }catch(error){}

    return null;

  }


  /*
   * Agrega utilizando el MISMO carrito
   * que utiliza la tienda.
   */
  function agregarAlCarrito(item){

    const nombre =
      obtenerNombre(item);


    if(!nombre){
      return false;
    }


    /*
     * Productos normales.
     */
    const producto =
      obtenerProducto(nombre);


    if(
      producto &&
      typeof window.addToCart === "function"
    ){

      window.addToCart(
        producto.id
      );

      return true;

    }


    /*
     * Segunda posibilidad:
     * localizar la tarjeta original.
     */
    const cards =
      document.querySelectorAll(
        "#productsContainer .product-card"
      );


    for(
      let i = 0;
      i < cards.length;
      i++
    ){

      const card =
        cards[i];


      const titulo =
        card.querySelector("h3");


      if(
        !titulo ||
        titulo.textContent.trim() !== nombre
      ){
        continue;
      }


      /*
       * Botón normal del producto.
       */
      const boton =
        card.querySelector(
          "button[onclick*='addToCart']"
        );


      if(boton){

        boton.click();

        return true;

      }


      /*
       * Productos especiales.
       */
      const especial =
        card.querySelector(
          "[data-ig-special-add]"
        );


      if(especial){

        especial.click();

        return true;

      }

    }


    return false;

  }


  /*
   * Añade el botón a cada favorito.
   */
  function instalarBotones(){

    const lista =
      document.getElementById(
        "igFavoritesList"
      );


    if(!lista){
      return;
    }


    const favoritos =
      lista.querySelectorAll(
        ".ig-favorite-item"
      );


    favoritos.forEach(
      function(item){

        /*
         * Evitar duplicados.
         */
        if(
          item.querySelector(
            ".ig-favorite-buy"
          )
        ){
          return;
        }


        const boton =
          document.createElement(
            "button"
          );


        boton.type =
          "button";


        boton.className =
          "ig-favorite-buy";


        boton.textContent =
          "🛒 Agregar";


        boton.title =
          "Agregar al carrito";


        boton.setAttribute(
          "aria-label",
          "Agregar al carrito"
        );


        boton.addEventListener(
          "click",
          function(event){

            event.preventDefault();

            event.stopPropagation();


            const agregado =
              agregarAlCarrito(item);


            if(!agregado){

              if(
                typeof window.showToast ===
                "function"
              ){

                window.showToast(
                  "No se pudo agregar este producto al carrito."
                );

              }

              return;

            }


            boton.textContent =
              "✓ Agregado";


            boton.disabled =
              true;


            /*
             * Después vuelve a estar disponible
             * por si el usuario quiere aumentar
             * la cantidad desde favoritos.
             */
            setTimeout(
              function(){

                if(
                  document.body.contains(
                    boton
                  )
                ){

                  boton.textContent =
                    "🛒 Agregar";

                  boton.disabled =
                    false;

                }

              },
              1400
            );

          }
        );


        /*
         * Lo colocamos justo antes del botón
         * de quitar de favoritos.
         */
        const quitar =
          item.querySelector(
            ".ig-favorite-remove"
          );


        if(quitar){

          item.insertBefore(
            boton,
            quitar
          );

        }else{

          item.appendChild(
            boton
          );

        }

      }
    );

  }


  /*
   * Cuando se abre Favoritos,
   * el sistema original construye la lista.
   * Nosotros esperamos y añadimos solamente
   * el botón de compra.
   */
  function programar(){

    setTimeout(
      instalarBotones,
      80
    );

    setTimeout(
      instalarBotones,
      300
    );

    setTimeout(
      instalarBotones,
      800
    );

    setTimeout(
      instalarBotones,
      1500
    );

  }


  document.addEventListener(
    "click",
    function(event){

      if(
        event.target.closest &&
        event.target.closest(
          "#igFavoritesLauncher"
        )
      ){

        programar();

      }

    },
    true
  );


  /*
   * Detecta cuando renderFavorites()
   * vuelve a construir la lista.
   */
  function observarLista(){

    const lista =
      document.getElementById(
        "igFavoritesList"
      );


    if(!lista){
      return;
    }


    if(
      lista.__IG_BUY_OBSERVER
    ){
      return;
    }


    const observer =
      new MutationObserver(
        function(){

          instalarBotones();

        }
      );


    observer.observe(
      lista,
      {
        childList:true,
        subtree:true
      }
    );


    lista.__IG_BUY_OBSERVER =
      observer;


    instalarBotones();

  }


  function iniciar(){

    observarLista();

    programar();

  }


  if(
    document.readyState ===
    "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      iniciar,
      {once:true}
    );

  }else{

    iniciar();

  }


})();
</script>

<script>

/* =========================================================
   UTILIDADES

function igPR_escape(value){

  return String(
    value == null ? "" : value
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function igPR_money(value){

  var number = Number(value || 0);

  try{

    return number.toLocaleString(
      "es-AR",
      {
        style:"currency",
        currency:"ARS",
        minimumFractionDigits:2
      }
    );

  }catch(error){

    return "$ " + number.toFixed(2);

  }

}


function igPR_message(message){

  try{

    if(
      typeof showToast === "function"
    ){

      showToast(message);
      return;

    }

  }catch(error){}

  alert(message);

}

/* =========================================================

   ========================================================= */

async function igPR_loadReviewStats(){

  igReviewStats = {};


  var result =
    await supabaseClient
      .from("ig_product_reviews")
      .select("product_id,rating")
      .eq("approved",true);


  if(result.error){

    console.error(
      "[IG Reviews]",
      result.error
    );

    return;

  }


  (result.data || []).forEach(
    function(row){

      var id =
        String(row.product_id);


      if(!igReviewStats[id]){

        igReviewStats[id] = {
          count:0,
          sum:0,
          avg:0
        };

      }


      igReviewStats[id].count++;

      igReviewStats[id].sum +=
        Number(row.rating || 0);

    }
  );


  Object.keys(igReviewStats).forEach(
    function(id){

      var item =
        igReviewStats[id];


      item.avg =
        item.sum / item.count;

    }
  );

}


/* =========================================================
   CARGAR PRODUCTOS PROMOCIONALES
   ========================================================= */

async function igPR_loadPromoProducts(){

  if(
    typeof supabaseClient ===
    "undefined"
  ){

    return;

  }


  var result =
    await supabaseClient
      .from("ig_products")
      .select(
        "id,name,description,price,original_price,promo_section,is_featured,active,available,ig_product_images(public_url,is_primary,sort_order)"
      )
      .eq("active",true)
      .eq("available",true);


  if(result.error){

    console.error(
      "[IG Promos]",
      result.error
    );

    return;

  }


  igPromoProducts =
    result.data || [];


  igPromoImages = {};


  igPromoProducts.forEach(
    function(product){

      var images =
        (
          product.ig_product_images ||
          []
        ).slice();


      images.sort(
        function(a,b){

          if(
            a.is_primary &&
            !b.is_primary
          ){

            return -1;

          }


          if(
            !a.is_primary &&
            b.is_primary
          ){

            return 1;

          }


          return (
            Number(a.sort_order || 0) -
            Number(b.sort_order || 0)
          );

        }
      );


      var image =
        images[0];


      igPromoImages[
        String(product.id)
      ] =
        image &&
        image.public_url
          ? image.public_url
          : "";

    }
  );


  await igPR_loadReviewStats();

  igPR_renderPromos();

}


/* =========================================================
   TARJETA PROMOCIONAL
   ========================================================= */

function igPR_card(
  product,
  label
){

  var id =
    String(product.id);


  var image =
    igPromoImages[id] || "";


  var price =
    Number(product.price || 0);


  var original =
    Number(product.original_price || 0);


  var stats =
    igReviewStats[id] || {
      count:0,
      avg:0
    };


  var priceHTML =
    igPR_money(price);


  if(
    original > price
  ){

    priceHTML +=
      ' <del style="' +
      'font-size:13px;' +
      'color:#777;' +
      'font-weight:normal;' +
      '">' +
      igPR_money(original) +
      '</del>';

  }


  var reviewText =
    stats.count
      ? (
          "⭐ " +
          stats.avg.toFixed(1) +
          " · " +
          stats.count +
          (
            stats.count === 1
              ? " reseña"
              : " reseñas"
          )
        )
      : "Sin reseñas todavía";


  return (

    '<article class="product-card">' +

      '<div class="product-image">' +

        (
          image

          ?

          '<img src="' +
          igPR_escape(image) +
          '" alt="' +
          igPR_escape(product.name) +
          '">' 

          :

          '<span>Sin imagen</span>'
        ) +

      '</div>' +


      '<div class="product-content">' +

        '<div class="product-category">' +
          igPR_escape(label) +
        '</div>' +


        '<h3>' +
          igPR_escape(product.name) +
        '</h3>' +


        (
          product.description

          ?

          '<p class="product-description">' +
            igPR_escape(
              product.description
            ) +
          '</p>'

          :

          ''
        ) +


        '<div class="price">' +
          priceHTML +
        '</div>' +


        '<div style="' +
        'font-size:13px;' +
        'color:#555;' +
        'margin-bottom:12px;' +
        '">' +

          reviewText +

        '</div>' +


        '<div style="' +
        'display:grid;' +
        'gap:8px;' +
        '">' +

          '<button ' +
          'type="button" ' +
          'class="button" ' +
          'data-ig-promo-buy="' +
          igPR_escape(id) +
          '">' +

            '🛒 Agregar al carrito' +

          '</button>' +


          '<button ' +
          'type="button" ' +
          'class="button secondary" ' +
          'data-ig-promo-reviews="' +
          igPR_escape(id) +
          '">' +

            '⭐ Ver reseñas' +

          '</button>' +

        '</div>' +

      '</div>' +

    '</article>'

  );

}

function igPR_renderPromos(){

  var host =
    document.getElementById(
      "igPromoBlocks"
    );

    return;

  }


  var groups = [

    ["offers","🔥 Ofertas"],

    ["new","🆕 Nuevos productos"],

    ["featured","⭐ Destacados"],

    ["clearance","💥 Liquidación"]

  ];


  var html = "";


  groups.forEach(
    function(group){

      var products =
        igPromoProducts.filter(
          function(product){

            if(
              group[0] ===
              "featured"
            ){

              return !!product.is_featured;

            }


            return (
              product.promo_section ===
              group[0]
            );

          'margin-bottom:16px;' +

            group[1] +

          '</h3>' +

          '<div class="products">' +

            products.map(
              function(product){

                return igPR_card(
                  product,
                  group[1]
                );

        '</div>';

          'aparecerán aquí.' +

        '</div>' +

        '<div class="field">' +

          '<label>Comentario</label>' +

          '<textarea ' +
          'id="igReviewComment" ' +
          'maxlength="1000" ' +
          'minlength="3" ' +
          'required></textarea>' +

        '</div>' +

        '<button ' +
        'type="submit" ' +
        'class="button full">' +

          '⭐ Enviar reseña' +

        '</button>' +

      '</form>'
    );


  var form =
    document.getElementById(
      "igReviewForm"
    );


  if(!form){

    return;

  }


  modal
    .querySelectorAll(
      "[data-ig-rating]"
    )
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            var rating =
              Number(
                button.getAttribute(
                  "data-ig-rating"
                )
              );


            document.getElementById(
              "igReviewRating"
            ).value =
              rating;


            modal
              .querySelectorAll(
                "[data-ig-rating]"
              )
              .forEach(
                function(other){

                  if(
                    Number(
                      other.getAttribute(
                        "data-ig-rating"
                      )
                    ) === rating
                  ){

                    other.classList.remove(
                      "secondary"
                    );

                  }else{

                    other.classList.add(
                      "secondary"
                    );

                  }

                }
              );

          }
        );

      }
    );


  form.addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      var button =
        form.querySelector(
          'button[type="submit"]'
        );


      button.disabled =
        true;


      var payload = {

        product_id:
          document.getElementById(
            "igReviewProductId"
          ).value,

        order_id:
          document.getElementById(
            "igReviewOrderId"
          ).value,

        customer_name:
          document.getElementById(
            "igReviewName"
          ).value.trim(),

        rating:
          Number(
            document.getElementById(
              "igReviewRating"
            ).value
          ),

        comment:
          document.getElementById(
            "igReviewComment"
          ).value.trim(),

        approved:false

      };


      var result =
        await supabaseClient
          .from("ig_product_reviews")
          .insert(payload);


      if(result.error){

        button.disabled =
          false;


        igPR_message(
          "No se pudo enviar la reseña: " +
          (
            result.error.message ||
            "error"
          )
        );

        return;

      }


      modal.remove();


      igPR_message(
        "⭐ Reseña enviada. Quedará pendiente de aprobación."
      );


      await igPR_loadPromoProducts();

    }
  );

}

/* =========================================================
   DETECTAR PEDIDO CREADO
   ========================================================= */

function igPR_startOrderPolling(
  previousNumber
){

  clearInterval(
    igReviewPoll
  );


  var started =
    Date.now();


  igReviewPoll =
    setInterval(
      async function(){

        if(
          Date.now() - started >
          90000
        ){

          clearInterval(
            igReviewPoll
          );

          igReviewPoll =
            null;

          return;

        }


        var numberElement =
          document.getElementById(
            "confirmationNumber"
          );


        var currentNumber =
          numberElement
            ? String(
                numberElement.textContent || ""
              )
                .replace(/^#/,"")
                .trim()
            : "";


        if(
          !currentNumber ||
          currentNumber ===
          previousNumber
        ){

          return;

        }


        var result =
          await supabaseClient
            .from("ig_orders")
            .select(
              "id,order_number,customer_name"
            )
            .eq(
              "order_number",
              currentNumber
            )
            .maybeSingle();


        if(
          result.error ||
          !result.data
        ){

          return;

        }


        clearInterval(
          igReviewPoll
        );

        igReviewPoll =
          null;


        igPR_renderOrderReviews(
          result.data
        );

      },
      1000
    );

}


/* =========================================================
   GANCHO DEL BOTÓN DE COMPRA
   NO CANCELA EL CHECKOUT EXISTENTE
   ========================================================= */

function igPR_installCheckoutHook(){

  var button =
    document.getElementById(
      "finishOrderButton"
    );


  if(
    !button ||
    button.dataset.igReviewHook
  ){

    return;

  }


  button.dataset.igReviewHook =
    "1";


  button.addEventListener(
    "click",
    function(){

      var previousNumber =
        document.getElementById(
          "confirmationNumber"
        );


      previousNumber =
        previousNumber
          ? String(
              previousNumber.textContent || ""
            )
              .replace(/^#/,"")
              .trim()
          : "";


      igPR_startOrderPolling(
        previousNumber
      );

    },
    true
  );

}

/* =========================================================

   ========================================================= */

async function igPR_loadAdmin(){

  var section =
    document.getElementById(
      "admin-promotions"
    );


  if(!section){

    return;

  }


  section.innerHTML =
    '<div class="card">' +
      'Cargando promociones y reseñas…' +
    '</div>';


  var productsResult =
    await supabaseClient
      .from("ig_products")
      .select(
        "id,name,price,original_price,promo_section,is_featured"
      )
      .order("name");


  var reviewsResult =
    await supabaseClient
      .from("ig_product_reviews")
      .select(
        "id,product_id,order_id,customer_name,rating,comment,approved,created_at"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(productsResult.error){

    section.innerHTML =
      '<div class="notice error">' +
        'No se pudieron cargar los productos.' +
      '</div>';

    return;

  }


  if(reviewsResult.error){

    section.innerHTML =
      '<div class="notice error">' +
        'No se pudieron cargar las reseñas.' +
      '</div>';

    return;

  }


  var products =
    productsResult.data || [];


  var reviews =
    reviewsResult.data || [];


  var productHTML =
    products.map(
      function(product){

        return (

          '<div class="card" ' +
          'style="margin-bottom:10px;">' +

            '<strong>' +
              igPR_escape(product.name) +
            '</strong>' +

            '<div style="' +
            'display:grid;' +
            'grid-template-columns:1fr 1fr;' +
            'gap:8px;' +
            'margin-top:10px;' +
            '">' +

              '<select ' +
              'data-ig-promo="' +
              igPR_escape(product.id) +
              '">' +

                '<option value="none">' +
                  'Sin promoción' +
                '</option>' +

                '<option value="offers">' +
                  '🔥 Ofertas' +
                '</option>' +

                '<option value="new">' +
                  '🆕 Nuevos productos' +
                '</option>' +

                '<option value="clearance">' +
                  '💥 Liquidación' +
                '</option>' +

              '</select>' +

              '<input ' +
              'type="number" ' +
              'min="0" ' +
              'step="0.01" ' +
              'data-ig-original="' +
              igPR_escape(product.id) +
              '" ' +
              'value="' +
              (
                product.original_price ==
                null
                  ? ""
                  : igPR_escape(
                      product.original_price
                    )
              ) +
              '" ' +
              'placeholder="Precio original">' +

            '</div>' +

            '<label style="' +
            'display:flex;' +
            'gap:8px;' +
            'align-items:center;' +
            'margin-top:8px;' +
            '">' +

              '<input ' +
              'type="checkbox" ' +
              'data-ig-featured="' +
              igPR_escape(product.id) +
              '" ' +
              (
                product.is_featured
                  ? "checked"
                  : ""
              ) +
              '>' +

              ' ⭐ Destacado' +

            '</label>' +

            '<button ' +
            'type="button" ' +
            'class="button" ' +
            'data-ig-save-promo="' +
            igPR_escape(product.id) +
            '" ' +
            'style="margin-top:10px;">' +

              'Guardar promoción' +

            '</button>' +

          '</div>'

        );

      }
    ).join("");


  var reviewHTML =
    reviews.map(
      function(review){

        return (

          '<div class="card" ' +
          'style="margin-bottom:10px;">' +

            '<strong>' +
              igPR_escape(
                review.customer_name
              ) +
            '</strong>' +

            '<div>' +
              "⭐".repeat(
                Number(review.rating || 0)
              ) +
            '</div>' +

            '<p>' +
              igPR_escape(
                review.comment
              ) +
            '</p>' +

            '<small>' +
              'Producto: ' +
              igPR_escape(
                review.product_id
              ) +
            '</small>' +

            '<br>' +

            '<button ' +
            'type="button" ' +
            'class="button" ' +
            'data-ig-review-toggle="' +
            igPR_escape(review.id) +
            '" ' +
            'style="margin-top:10px;">' +

              (
                review.approved
                  ? "Ocultar reseña"
                  : "Aprobar reseña"
              ) +

            '</button>' +

          '</div>'

        );

      }
    ).join("");


  section.innerHTML =

    '<div class="card" ' +
    'style="margin-bottom:20px;">' +

      '<h2>🎁 Ofertas y promociones</h2>' +

      '<p>' +
        'Configurá las promociones sin modificar el funcionamiento del catálogo.' +
      '</p>' +

    '</div>' +

    (
      productHTML ||
      '<div class="empty">No hay productos.</div>'
    ) +

    '<div class="card" ' +
    'style="margin:25px 0 15px;">' +

      '<h2>⭐ Reseñas</h2>' +

      '<p>' +
        'Aprobá u ocultá las reseñas recibidas.' +
      '</p>' +

    '</div>' +

    (
      reviewHTML ||
      '<div class="empty">No hay reseñas todavía.</div>'
    );


  products.forEach(
    function(product){

      var select =
        section.querySelector(
          '[data-ig-promo="' +
          product.id +
          '"]'
        );


      if(select){

        select.value =
          product.promo_section ||
          "none";

      }

    }
  );


  section
    .querySelectorAll(
      "[data-ig-save-promo]"
    )
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          async function(){

            var id =
              button.getAttribute(
                "data-ig-save-promo"
              );


            var select =
              section.querySelector(
                '[data-ig-promo="' +
                id +
                '"]'
              );


            var original =
              section.querySelector(
                '[data-ig-original="' +
                id +
                '"]'
              );


            var featured =
              section.querySelector(
                '[data-ig-featured="' +
                id +
                '"]'
              );


            if(
              !select ||
              !original ||
              !featured
            ){

              return;

            }


            button.disabled =
              true;


            var result =
              await supabaseClient
                .from("ig_products")
                .update({

                  promo_section:
                    select.value,

                  original_price:
                    original.value.trim() === ""
                      ? null
                      : Number(
                          original.value
                        ),

                  is_featured:
                    !!featured.checked

                })
                .eq(
                  "id",
                  id
                );


            button.disabled =
              false;


            if(result.error){

              igPR_message(
                "No se pudo guardar: " +
                result.error.message
              );

              return;

            }


            igPR_message(
              "✅ Promoción guardada."
            );


            await igPR_loadPromoProducts();

          }
        );

      }
    );


  section
    .querySelectorAll(
      "[data-ig-review-toggle]"
    )
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          async function(){

            var id =
              button.getAttribute(
                "data-ig-review-toggle"
              );


            var review =
              reviews.find(
                function(item){

                  return (
                    String(item.id) ===
                    String(id)
                  );

                }
              );


            if(!review){

              return;

            }


            button.disabled =
              true;


            var result =
              await supabaseClient
                .from("ig_product_reviews")
                .update({
                  approved:
                    !review.approved
                })
                .eq(
                  "id",
                  id
                );


            button.disabled =
              false;


            if(result.error){

              igPR_message(
                "No se pudo actualizar la reseña: " +
                result.error.message
              );

              return;

            }


            igPR_message(
              review.approved
                ? "Reseña ocultada."
                : "⭐ Reseña aprobada."
            );


            await igPR_loadAdmin();
            await igPR_loadPromoProducts();

          }
        );

      }
    );

}


/* =========================================================
   ARRANQUE
   ========================================================= */

function igPR_boot(){

  if(
    typeof supabaseClient ===
    "undefined"
  ){

    return;

  }


  igPR_createPublicSection();
  igPR_installCheckoutHook();
  igPR_createAdminSection();


  if(
    !window.__IG_PROMOS_LOADED
  ){

    window.__IG_PROMOS_LOADED = true;

    igPR_loadPromoProducts();

  }

}


/*
 * Reintentos limitados.
 * No hay MutationObserver global.
 */

function igPR_start(){

  igPR_boot();


  setTimeout(
    function(){

      igPR_createPublicSection();
      igPR_installCheckoutHook();
      igPR_createAdminSection();

    },
    500
  );


  setTimeout(
    function(){

      igPR_createPublicSection();
      igPR_installCheckoutHook();
      igPR_createAdminSection();

    },
    1500
  );


  setTimeout(
    function(){

      igPR_createPublicSection();
      igPR_installCheckoutHook();
      igPR_createAdminSection();

    },
    3000
  );

}


if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    igPR_start,
    {once:true}
  );

}else{

  igPR_start();

}

})();

<style>
.ig-remove-promo-button{
  margin-top:8px !important;
  width:100% !important;
  background:#b00020 !important;
  color:#fff !important;

.ig-remove-promo-button:hover{
  opacity:.9 !important;

.ig-remove-promo-button:disabled{
  opacity:.55 !important;
  cursor:default !important;
}
</style>

<script>
(function(){

  "use strict";

  if(window.__IG_REMOVE_PROMO_PATCH){
    return;
  }

  window.__IG_REMOVE_PROMO_PATCH = true;


  function instalarBotones(){

    var section =
      document.getElementById(
        "admin-promotions"
      );

    if(!section){
      return;
    }


    var saveButtons =
      section.querySelectorAll(
        "[data-ig-save-promo]"
      );


    saveButtons.forEach(
      function(saveButton){

        var id =
          saveButton.getAttribute(
            "data-ig-save-promo"
          );


        if(!id){
          return;
        }


        /*
         * Evitar duplicar el botón.
         */
        if(
          section.querySelector(
            '[data-ig-remove-promo="' +
            id +
            '"]'
          )
        ){

          return;

        }


        var removeButton =
          document.createElement(
            "button"
          );


        removeButton.type =
          "button";


        removeButton.className =
          "ig-remove-promo-button";


        removeButton.setAttribute(
          "data-ig-remove-promo",
          id
        );


        removeButton.textContent =
          "🗑️ Quitar promoción";


        removeButton.title =
          "Quitar completamente la promoción de este producto";


        removeButton.addEventListener(
          "click",
          function(){

            var select =
              section.querySelector(
                '[data-ig-promo="' +
                id +
                '"]'
              );


            var original =
              section.querySelector(
                '[data-ig-original="' +
                id +
                '"]'
              );


            var featured =
              section.querySelector(
                '[data-ig-featured="' +
                id +
                '"]'
              );


            if(
              !select ||
              !original ||
              !featured
            ){

              return;

            }


            var confirmed =
              confirm(
                "¿Quitar completamente la promoción de este producto?\n\n" +
                "Se eliminará la oferta/promoción y el precio original asociado.\n\n" +
                "El producto, su precio actual, fotos, stock y pedidos NO se eliminarán."
              );


            if(!confirmed){
              return;
            }


            /*
             * Restauramos solamente
             * los campos de promoción.
             */
            select.value =
              "none";


            original.value =
              "";


            featured.checked =
              false;


            /*
             * Utilizamos el botón Guardar
             * ORIGINAL del sistema.
             *
             * De esta manera no duplicamos
             * la lógica Supabase existente.
             */
            removeButton.disabled =
              true;


            saveButton.click();


            /*
             * Volvemos a habilitarlo después
             * de que el sistema existente
             * termine su operación.
             */
            setTimeout(
              function(){

                if(
                  document.body.contains(
                    removeButton
                  )
                ){

                  removeButton.disabled =
                    false;

                }

              },
              1800
            );

          }
        );


        /*
         * El botón queda inmediatamente
         * debajo de "Guardar promoción".
         */
        saveButton.insertAdjacentElement(
          "afterend",
          removeButton
        );

      }
    );

  }


  /*
   * La sección de promociones se reconstruye
   * mediante innerHTML cuando se recarga.
   *
   * Observamos SOLAMENTE esa sección.
   * No usamos MutationObserver sobre todo
   * el documento.
   */
  function observar(){

    var section =
      document.getElementById(
        "admin-promotions"
      );


    if(!section){
      return;
    }


    if(
      section.__IG_REMOVE_PROMO_OBSERVER
    ){

      instalarBotones();

      return;

    }


    var observer =
      new MutationObserver(
        function(){

          instalarBotones();

        }
      );


    observer.observe(
      section,
      {
        childList:true,
        subtree:true
      }
    );


    section.__IG_REMOVE_PROMO_OBSERVER =
      observer;


    instalarBotones();

  }


  function iniciar(){

    observar();


    /*
     * El módulo de promociones
     * se crea dinámicamente.
     */
    setTimeout(
      observar,
      300
    );


    setTimeout(
      observar,
      800
    );


    setTimeout(
      observar,
      1500
    );


    setTimeout(
      observar,
      3000
    );

  }


  if(
    document.readyState ===
    "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      iniciar,
      {once:true}
    );

  }else{

    iniciar();

  }

})();
</script>

  <script>
/* =========================================================
   INTERNATIONAL GATEWAY
   RESEÑAS — ENGANCHAR DIRECTAMENTE A LA CONFIRMACIÓN
   PARCHE QUIRÚRGICO
   ========================================================= */

(function(){

  function igFixReviewsOnConfirmation(){

    if(
      typeof window.showConfirmation !== "function" ||
      typeof window.igPR_renderOrderReviews !== "function"
    ){
      return false;
    }

    if(
      window.__IG_DIRECT_REVIEW_CONFIRMATION
    ){
      return true;
    }

    const originalShowConfirmation =
      window.showConfirmation;

    window.showConfirmation =
      function(order,paymentMethod){

        /*
         * Ejecutar primero la confirmación original.
         * No se modifica el proceso de compra.
         */
        originalShowConfirmation.apply(
          this,
          arguments
        );

        /*
         * Cuando la confirmación ya está visible,
         * mostrar directamente las reseñas usando
         * el ID REAL del pedido recién creado.
         */
        if(
          order &&
          order.id &&
          typeof window.igPR_renderOrderReviews ===
            "function"
        ){

          setTimeout(
            function(){

              try{

                window.igPR_renderOrderReviews(
                  {
                    id: order.id,
                    order_number:
                      order.order_number,
                    customer_name:
                      order.customer_name || ""
                  }
                );

              }catch(error){

                console.error(
                  "[IG Reviews] Error mostrando reseñas:",
                  error
                );

              }

            },
            150
          );

        }

      };

    window.__IG_DIRECT_REVIEW_CONFIRMATION =
      true;

    return true;

  }


  if(
    !igFixReviewsOnConfirmation()
  ){

    setTimeout(
      igFixReviewsOnConfirmation,
      300
    );

    setTimeout(
      igFixReviewsOnConfirmation,
      800
    );

    setTimeout(
      igFixReviewsOnConfirmation,
      1500
    );

  }

})();
</script>

  <script>
/* =========================================================
   INTERNATIONAL GATEWAY
   RESEÑAS EN PRODUCTOS NORMALES
   PARCHE AISLADO
   ========================================================= */

(function(){

  "use strict";

  if(window.__IG_NORMAL_PRODUCTS_REVIEWS){
    return;
  }

  window.__IG_NORMAL_PRODUCTS_REVIEWS = true;


  async function igNormalProductReviews(){

    var container =
      document.getElementById(
        "productsContainer"
      );

    if(!container){
      return;
    }


    /*
     * Esperamos a que el catálogo original
     * termine de renderizar.
     */
    var cards =
      container.querySelectorAll(
        ".product-card"
      );

    if(!cards.length){
      return;
    }


    if(
      typeof window.supabaseClient ===
      "undefined"
    ){
      return;
    }


    /*
     * Los productos que corresponden
     * a estas tarjetas son los productos
     * normales del catálogo.
     */
    var normalProducts =
      Array.isArray(window.products)
        ? window.products
        : products;


    if(
      !normalProducts ||
      !normalProducts.length
    ){
      return;
    }


    var ids =
      normalProducts.map(
        function(product){
          return String(product.id);
        }
      );


    var result =
      await supabaseClient
        .from("ig_product_reviews")
        .select(
          "product_id,rating"
        )
        .in(
          "product_id",
          ids
        )
        .eq(
          "approved",
          true
        );


    if(result.error){

      console.error(
        "[IG Reviews normales]",
        result.error
      );

      return;
    }


    var stats = {};


    (result.data || []).forEach(
      function(row){

        var id =
          String(row.product_id);


        if(!stats[id]){

          stats[id] = {
            count:0,
            sum:0
          };

        }


        stats[id].count++;

        stats[id].sum +=
          Number(row.rating || 0);

      }
    );


    cards.forEach(
      function(card,index){

        var product =
          normalProducts[index];


        if(!product){
          return;
        }


        var productId =
          String(product.id);


        var productStats =
          stats[productId] || {
            count:0,
            sum:0
          };


        var content =
          card.querySelector(
            ".product-content"
          );


        if(!content){
          return;
        }


        /*
         * Evitar duplicados.
         */
        if(
          content.querySelector(
            "[data-ig-normal-review]"
          )
        ){
          return;
        }


        var reviewBox =
          document.createElement("div");


        reviewBox.setAttribute(
          "data-ig-normal-review",
          productId
        );


        reviewBox.style.cssText =
          "font-size:13px;" +
          "color:#555;" +
          "margin:10px 0 12px;" +
          "display:grid;" +
          "gap:8px;";


        var reviewText =
          productStats.count
            ? (
                "⭐ " +
                (
                  productStats.sum /
                  productStats.count
                ).toFixed(1) +
                " · " +
                productStats.count +
                (
                  productStats.count === 1
                    ? " reseña"
                    : " reseñas"
                )
              )
            : "Sin reseñas todavía";


        reviewBox.innerHTML =

          '<div>' +
            reviewText +
          '</div>' +

          '<button ' +
          'type="button" ' +
          'class="button secondary" ' +
          'data-ig-normal-show-reviews>' +
            '⭐ Ver reseñas' +
          '</button>';


        var cartButton =
          content.querySelector(
            'button[onclick*="addToCart"]'
          );


        if(cartButton){

          cartButton.insertAdjacentElement(
            "beforebegin",
            reviewBox
          );

        }else{

          content.appendChild(
            reviewBox
          );

        }


        var reviewButton =
          reviewBox.querySelector(
            "[data-ig-normal-show-reviews]"
          );


        if(reviewButton){

          reviewButton.addEventListener(
            "click",
            function(){

              if(
                typeof window.igPR_showReviewsPublic ===
                "function"
              ){

                window.igPR_showReviewsPublic(
                  product.id,
                  product.name
                );

              }

            }
          );

        }

      }
    );

  }


  /*
   * Conservamos completamente la función
   * original y solamente añadimos las reseñas
   * después de que renderProducts() termine.
   */
  var originalRenderProducts =
    window.renderProducts;


  if(
    typeof originalRenderProducts !==
    "function"
  ){

    console.error(
      "[IG Reviews normales] renderProducts no encontrado."
    );

    return;
  }


  window.renderProducts =
    function(){

      originalRenderProducts.apply(
        this,
        arguments
      );


      setTimeout(
        function(){

          igNormalProductReviews();

        },
        50
      );

    };


})();
</script>
</body>
</html>
