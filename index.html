<div id="app"></div>

<!-- MODAL ADMIN LOGIN -->

<div id="adminLoginModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

        ×

</div>

<!-- MODAL PRODUCTO -->

<div id="productModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="productModalTitle">
        Nuevo producto
      </h2>

      <button
        class="close"
        onclick="closeProductModal()">
        ×
      </button>

    </div>

    <form id="productForm" class="form">

      <input
        id="productId"
        type="hidden">

      <div class="form-grid">

        <div class="field">

          <label>
            Nombre del producto *
          </label>

          <input
            id="productName"

        </div>

        <div class="field">

          <label>
            Precio *
          </label>

          <input
            id="productPrice"
            type="number"

        </div>

        <div class="field">

          <label>
            Categoría

          <input

        </div>

            Disponibilidad

              Disponible

            <option value="false">
              Agotado
            </option>

          </select>

        </div>

        <div class="field full-field">

          <label>
            Descripción
          </label>

          <textarea
            id="productDescription"></textarea>

        </div>

        <div class="field full-field">

          <label>
            Características
          </label>

          <textarea
            id="productCharacteristics"
            placeholder="Ejemplo:
5 velocidades
600 W
Vaso de 1,5 L
Función pulso"></textarea>

        </div>

        <div class="field full-field">

          <label>

      <button
        class="button full"
        type="submit">
        Guardar producto
      </button>

    </form>

  </div>

</div>

<script>

const supabaseClient =

  );

const STORAGE_BUCKET =
  "international-gateway";

let products = [];

let cart =
  JSON.parse(
    localStorage.getItem("ig_cart") || "[]"
  );

let adminUser = null;

let adminProducts = [];

let editingProduct = null;

let installPrompt = null;

let settings = {
  store_name:"International Gateway",

};


/* =========================================================
   UTILIDADES
   ========================================================= */

function money(value){

  return new Intl.NumberFormat(
    "es-AR",
    {
      style:"currency",
      currency:"ARS",
      maximumFractionDigits:2
    }
  ).format(
    Number(value || 0)
  );

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent=message;

  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },3000);

}


function setMessage(
  id,
  message,
  type=""
){

  const el =
    document.getElementById(id);

  if(!el)return;

  el.innerHTML =
    message
      ? `<div class="notice ${type}">
          ${escapeHtml(message)}
        </div>`
      : "";

}


function saveCart(){

  localStorage.setItem(
    "ig_cart",
    JSON.stringify(cart)
  );

}


function cartCount(){

  return cart.reduce(
    (sum,item)=>
      sum+item.quantity,
    0
  );

}


function cartTotal(){

  return cart.reduce(
    (sum,item)=>
      sum+
      (
        Number(item.price)*
        item.quantity
      ),
    0
  );

}


/* =========================================================
   PWA — INSTALACIÓN
   ========================================================= */

function setupInstallPrompt(){

  window.addEventListener(
    "beforeinstallprompt",
    event=>{

      event.preventDefault();

      installPrompt=event;

      updateInstallButtons();

    }
  );


  window.addEventListener(
    "appinstalled",
    ()=>{

      installPrompt=null;

      updateInstallButtons();

      showToast(
        "International Gateway fue instalada correctamente."
      );

    }
  );


  updateInstallButtons();

}


function updateInstallButtons(){

  const button =
    document.getElementById(
      "installAppButton"
    );

  if(!button)return;

  if(installPrompt){

    button.hidden=false;

  }else{

    button.hidden=true;

  }

}


async function installApp(){

  if(!installPrompt){

    showToast(
      "La instalación todavía no está disponible en este navegador."
    );

    return;

  }

  const promptEvent=
    installPrompt;

  installPrompt=null;

  updateInstallButtons();

  try{

async function loadProducts(){

  const {
    data,
    error
  }=
    await supabaseClient
      .from("ig_products")
      .select(`
        id,
        name,
        description,
        characteristics,
        price,
        category,
        available,
        active,
        ig_product_images(
          id,
          storage_path,
          public_url,
          is_primary,
          sort_order
        )
      `)
      .eq("active",true)
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    console.error(error);

    products=[];

    return;

  }

  products =
    (data || [])
      .map(product=>{

        product.ig_product_images =
          (
            product.ig_product_images ||
            []
          ).sort((a,b)=>{

            if(
              a.is_primary &&
              !b.is_primary
            ){

              return -1;

            }

            if(
              !a.is_primary &&
              b.is_primary
            ){

              return 1;

            }

            return (
              a.sort_order -
              b.sort_order
            );

          });

        return product;

      });

  renderProducts();

}


function productImage(product){

        alt="${escapeHtml(product.name)}">

  }

  return `
    <span>

    </span>
  `;

}

function addToCart(productId){

  const product =
    products.find(
      p=>p.id===productId
    );

  if(
    !product ||
    !product.available
  ){

    showToast(
      "Este producto no está disponible."
    );

    return;

  }

  const existing =
    cart.find(
      item=>item.id===productId
    );

  if(existing){

    existing.quantity++;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:Number(product.price),

      image:
        product
          .ig_product_images?.[0]
          ?.public_url ||
        "",

      quantity:1

    });

  }

  saveCart();

  updateCartCount();

  showToast(
    "Producto agregado al carrito."
  );

}


function updateCartCount(){

  const el =
    document.getElementById(
      "cartCount"
    );

  if(el){

    el.textContent =
      cartCount();

  }

}

   CARRITO
   ========================================================= */

function changeCartQuantity(
  id,
  delta
){

  const item =
    cart.find(
      x=>x.id===id
    );

  if(!item)return;

  item.quantity += delta;

  if(item.quantity<=0){

    cart =
      cart.filter(
        x=>x.id!==id
      );

  }

  saveCart();

  renderCart();

  updateCartCount();

}


function removeFromCart(id){

  cart =
    cart.filter(
      x=>x.id!==id
    );

  saveCart();

  renderCart();

  updateCartCount();

}


function renderCart(){

  const container =
    document.getElementById(

    );

  if(!container)return;

  if(!cart.length){

    container.innerHTML=`

          onclick="showStore()">

    <div class="cart-list">

      ${cart.map(item=>`

        <div class="cart-item">

          <div class="cart-image">

            ${
              item.image
                ? `
                  <img
                    src="${escapeHtml(item.image)}"
                    alt="">

            }

          </div>

          <div class="cart-info">

            <h3>

          </strong>

          <button
            class="cart-remove"
            onclick="removeFromCart('${item.id}')">

            Eliminar

          </button>

        </div>

      `).join("")}

    </div>

    <div class="cart-summary">

      <div class="total-row">

        <span>
          Productos
        </span>

        <strong>
          ${cartCount()}
        </strong>

async function createOrder(event){

  event.preventDefault();

  if(!cart.length){

    showToast(
      "El carrito está vacío."
    );

    return;

  }

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();

  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();

  const email =
    document
      .getElementById("customerEmail")
      .value
      .trim();

  const paymentMethod =
    document
      .getElementById("paymentMethod")
      .value;

  if(
    !name ||
    !phone ||
    !email ||
    !paymentMethod
  ){

    setMessage(
      "checkoutMessage",
      "Completá todos los datos y seleccioná un método de pago.",
      "error"
    );

    return;

  }

  const button =
    document.getElementById(
      "finishOrderButton"
    );

  button.disabled=true;

  button.textContent=
    "Creando pedido...";

  try{

    const ids =
      cart.map(
        item=>item.id
      );

    const {
      data:currentProducts,
      error:productsError
    }=
      await supabaseClient
        .from("ig_products")
        .select(`
          id,
          name,
          price,
          available,
          active,
          ig_product_images(
            public_url,
            is_primary,
            sort_order
          )
        `)
        .in("id",ids);

    if(productsError)
      throw productsError;

    const normalized =
      (currentProducts || [])
        .map(p=>{

          p.ig_product_images =
            (
              p.ig_product_images ||
              []
            ).sort((a,b)=>{

              if(
                a.is_primary &&
                !b.is_primary
              ){

                return -1;

              }

              if(
                !a.is_primary &&
                b.is_primary
              ){

                return 1;

              }

              return (
                a.sort_order -
                b.sort_order
              );

            });

          return p;

        });


    let validItems=[];

    let total=0;


    for(
      const item of cart
    ){

      const p =
        normalized.find(
          x=>x.id===item.id
        );

      if(
        !p ||
        !p.active ||
        !p.available
      ){

        throw new Error(
          `El producto "${item.name}" ya no está disponible.`
        );

      }

      const quantity =
        Math.max(
          1,
          Number(item.quantity)
        );

      const price =
        Number(p.price);

      const subtotal =
        price*quantity;

      validItems.push({

        product_id:p.id,

        product_name:p.name,

        product_price:price,

        quantity,

        subtotal

      });

      total += subtotal;

    }


    /*
      Generamos el ID del pedido
      en el navegador.

      Esto permite crear el pedido
      sin hacer SELECT posterior
      sobre ig_orders.
    */

    const orderId =
      crypto.randomUUID();

    const orderNumber =
      Date.now();


    const {
      error:orderError
    }=
      await supabaseClient
        .from("ig_orders")
        .insert({

          id:orderId,

          order_number:orderNumber,

          customer_name:name,

          customer_phone:phone,

          customer_email:email,

          payment_method:
            paymentMethod,

          payment_status:
            "pending",

          order_status:
            "pending",

          subtotal:total,

          total:total

        });


    if(orderError)
      throw orderError;


    const items =
      validItems.map(item=>({

        order_id:orderId,

        ...item

      }));


    const {
      error:itemsError
    }=
      await supabaseClient
        .from("ig_order_items")
        .insert(items);


    if(itemsError){

      await supabaseClient
        .from("ig_orders")
        .delete()
        .eq(
          "id",
          orderId
        );

      throw itemsError;

    }


    cart=[];

    saveCart();

    updateCartCount();


    showConfirmation(
      {
        id:orderId,
        order_number:orderNumber,
        total:total
      },
      paymentMethod
    );


  }catch(error){

    console.error(error);

    setMessage(
      "checkoutMessage",
      error.message ||
        "No se pudo crear el pedido.",
      "error"
    );


  }finally{

    button.disabled=false;

    button.textContent=
      "Confirmar pedido";

  }

}


function showConfirmation(
  order,
  paymentMethod
){

  document
    .getElementById("storeView")
    .classList.add("hidden");

  document
    .getElementById("cartView")
    .classList.add("hidden");

  document
    .getElementById("checkoutView")
    .classList.add("hidden");

  document
    .getElementById("confirmationView")
    .classList.remove("hidden");


  document
    .getElementById("confirmationNumber")
    .textContent =
      "#" + order.order_number;


  document
    .getElementById("confirmationTotal")
    .textContent =
      money(order.total);


  const paymentBox =
    document.getElementById(
      "paymentAction"
    );


  if(
    paymentMethod==="mercado_pago"
  ){

    if(settings.mercadopago_url){

      paymentBox.innerHTML=`

        <div class="notice success">

          Tu pedido fue registrado correctamente.

        </div>

        <br>

        <button
          class="button success full"
          onclick="window.open('${escapeHtml(settings.mercadopago_url)}','_blank')">

          Pagar con Mercado Pago

        </button>

        <br><br>

        <small>

          Después del pago,
          el administrador podrá
          confirmar el estado del pedido.

        </small>

      `;

    }else{

      paymentBox.innerHTML=`

        <div class="notice warning">

          El pedido fue registrado,
          pero Mercado Pago todavía
          no está configurado.

          El administrador debe agregar
          el enlace de Mercado Pago
          desde Configuración.

        </div>

      `;

    }

  }else{

    paymentBox.innerHTML=`

      <div class="notice">

        Elegiste pago al contado.

        El administrador se pondrá
        en contacto para coordinar
        el pago.

      </div>

    `;

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

async function openAdmin(){

  document
    .getElementById("adminLoginModal")
    .classList.add("open");


  const {
    data
  }=
    await supabaseClient
      .auth
      .getSession();


  if(data?.session){

      );

    }

  }

}


function closeAdminLogin(){

  document
    .getElementById("adminLoginModal")
    .classList.remove("open");

}


async function verifyAdmin(user){

  if(!user)return false;


  const {
    data,
    error
  }=
    await supabaseClient
      .from("ig_admins")
      .select("user_id")
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(error){

    console.error(error);

    return false;

  }


  return !!data;

}


async function loginAdmin(event){

  event.preventDefault();


  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("loginPassword")
      .value;


  setMessage(
    "loginMessage",
    "Ingresando..."
  );


  const {
    data,
    error
  }=
    await supabaseClient
      .auth
      .signInWithPassword({
        email,
        password
      });


  if(error){

    setMessage(
      "loginMessage",
      error.message,
      "error"
    );

    return;

  }


  const ok =
    await verifyAdmin(
      data.user
    );


  if(!ok){

    await supabaseClient
      .auth
      .signOut();

    setMessage(
      "loginMessage",
      "El usuario existe, pero no tiene permisos de administrador.",
      "error"
    );

    return;

  }


  adminUser =
    data.user;

  closeAdminLogin();

  openAdminPanel();

}


async function resetAdminPassword(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  if(!email){

    setMessage(
      "loginMessage",
      "Escribí primero el correo del administrador.",
      "warning"
    );

    return;

  }


  const {
    error
  }=
    await supabaseClient
      .auth
      .resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin
        }
      );


  if(error){

    setMessage(
      "loginMessage",
      error.message,
      "error"
    );

    return;

  }


  setMessage(
    "loginMessage",
    "Si el correo es válido, recibirás instrucciones para recuperar la contraseña.",
    "success"
  );

}

function openAdminPanel(){

  document
    .getElementById("publicApp")
    .classList.add("hidden");

  document
    .getElementById("adminPanel")
    .classList.remove("hidden");

  showAdminSection(
    "dashboard"
  );

    loadAdminData();

  if (!document.getElementById("igPushEnableBtn")) {

    var pushButton = document.createElement("button");

    pushButton.id = "igPushEnableBtn";
    pushButton.type = "button";
    pushButton.className = "button secondary";
    pushButton.textContent =
      "🔔 Activar notificaciones de pedidos";

    pushButton.onclick = async function () {

            if (!window.IGPush) {

        await new Promise(function (resolve, reject) {

          var script =
            document.createElement("script");

          script.src = "./ig-push.js";

          script.onload = resolve;

          script.onerror = function () {
            reject(
              new Error(
                "No se pudo cargar ig-push.js"
              )
            );
          };

          document.head.appendChild(script);

        });

      }

      if (!window.IGPush) {
        throw new Error(
          "El sistema de notificaciones no está disponible."
        );
      }

      pushButton.disabled = true;
      pushButton.textContent = "🔔 Activando…";

      try {

        await window.IGPush.enable();

        pushButton.textContent =
          "✅ Notificaciones activadas";

        pushButton.style.display = "none";

        if (typeof showToast === "function") {
          showToast(
            "🔔 Notificaciones de pedidos activadas."
          );
        }

      } catch (error) {

        console.error(
          "[IG Push] Error:",
          error
        );

        pushButton.disabled = false;
        pushButton.textContent =
          "🔔 Activar notificaciones de pedidos";

        if (typeof showToast === "function") {
  showToast(
    "⚠️ " +
    (
      error &&
      error.message
        ? error.message
        : "Error desconocido al activar las notificaciones."
    )
  );
}

      }

    };

    var adminTopInner =
      document.querySelector(
        "#adminPanel .admin-top-inner"
      );

    if (adminTopInner) {
      adminTopInner.appendChild(pushButton);
    }

  }
}


function showAdminSection(

){

    .querySelectorAll(".admin-section")
    .forEach(el=>{
      el.classList.remove(

      );

  document
    .querySelectorAll(".admin-nav button")

      );

      "admin-"+section
    );

    target.classList.add(
      "active"
    );

  }


  const button =
    document.querySelector(
      `.admin-nav button[data-section="${section}"]`
    );


  if(button){

    );

  }


  if(
    section==="products"

    loadAdminProducts();

  }


  if(
    section==="orders"
  ){

  }


  if(
    section==="settings"
  ){

  }


  if(
    section==="dashboard"
  ){

    loadAdminDashboard();

  }

}

async function loadAdminDashboard(){

  const {
    data:orders,
    error
  }=
    await supabaseClient
      .from("ig_orders")
      .select(
        "total,payment_status,order_status"
      );


  if(error){

    console.error(error);

    return;

  }


  const all =
    orders || [];


  const paid =
    all.filter(
      o=>o.payment_status==="paid"
    );


  const revenue =
    paid.reduce(
      (sum,o)=>
        sum+
        Number(
          o.total || 0
        ),
      0
    );


  document
    .getElementById("statOrders")
    .textContent =
      all.length;


  document
    .getElementById("statPaid")
    .textContent =
      paid.length;


  document
    .getElementById("statRevenue")
    .textContent =
      money(revenue);


  const pending =
    all.filter(
      o=>o.order_status==="pending"
    ).length;


  document
    .getElementById("statPending")
    .textContent =
      pending;

}

    );


  if(!adminProducts.length){

    container.innerHTML=`

      <div class="empty">

        Todavía no hay productos.

      </div>

    `;

    return;

  }


  container.innerHTML =
    adminProducts
      .map(product=>{

        const images =
          (
            product.ig_product_images ||
            []
          ).sort((a,b)=>{

            if(
              a.is_primary &&
              !b.is_primary
            ){

              return -1;

            }

            if(
              !a.is_primary &&
              b.is_primary
            ){

              return 1;

            }

            return (
              a.sort_order -
              b.sort_order
            );

          });


        const image =
          images[0]?.public_url ||
          "";


        return`

          <div class="admin-product">

            <div class="admin-product-image">

              ${
                image
                  ? `
                    <img
                      src="${escapeHtml(image)}"
                      alt="">
                  `
                  : ""
              }

            </div>

            <div class="admin-product-info">

              <strong>
                ${escapeHtml(product.name)}
              </strong>

              <div>
                ${money(product.price)}
              </div>

              <small>

                ${
                  product.active
                    ? "Activo"
                    : "Oculto"
                }

                ·

                ${
                  product.available
                    ? "Disponible"
                    : "Agotado"
                }

              </small>

            </div>

            <div class="admin-actions">

              <button
                class="button secondary"
                onclick="editProduct('${product.id}')">

                Editar

              </button>

              <button
                class="button danger"
                onclick="deleteProduct('${product.id}')">

                Eliminar

              </button>

              <button
                class="button warning"
                onclick="toggleProduct('${product.id}',${!product.active})">

                ${
                  product.active
                    ? "Ocultar"
                    : "Mostrar"
                }

              </button>

            </div>

          </div>

        `;

      })
      .join("");

}

async function saveProduct(
  event
){

  event.preventDefault();


  if(!adminUser){

    showToast(
      "No hay sesión de administrador."
    );

    return;

  }


  const id =
    document
      .getElementById(
        "productId"
      )
      .value;


  const name =
    document
      .getElementById(
        "productName"
      )
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById(
          "productPrice"
        )
        .value
    );


  const category =
    document
      .getElementById(
        "productCategory"
      )
      .value
      .trim();


  const available =
    document
      .getElementById(
        "productAvailable"
      )
      .value==="true";


  const description =
    document
      .getElementById(
        "productDescription"
      )
      .value
      .trim();


  const characteristics =
    document
      .getElementById(
        "productCharacteristics"
      )
      .value
      .trim();


  if(!name){

    setMessage(
      "productFormMessage",
      "El nombre es obligatorio.",
      "error"
    );

    return;

  }


  if(
    price<0 ||
    Number.isNaN(price)
  ){

    setMessage(
      "productFormMessage",
      "El precio no es válido.",
      "error"
    );

    return;

  }


  const payload={

    name,

    description,

    characteristics,

    price,

    category,

    available,

    active:true

  };


  let productId=id;


  try{

    if(id){

      const {
        error
      }=
        await supabaseClient
          .from("ig_products")
          .update(payload)
          .eq("id",id);

      if(error)
        throw error;

    }else{

      const {
        data,
        error
      }=
        await supabaseClient
          .from("ig_products")
          .insert(payload)
          .select()
          .single();

      if(error)
        throw error;

      productId=
        data.id;

    }


    const files=[
      ...document
        .getElementById(
          "productImagesInput"
        )
        .files
    ];


    for(
      let i=0;
      i<files.length;
      i++
    ){

      const file =
        files[i];


      if(
        !file.type.startsWith(
          "image/"
        )
      ){

        continue;

      }


      const safeName =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "-"
        );


      const path =
        `products/${productId}/${Date.now()}-${i}-${safeName}`;


      const {
        error:uploadError
      }=
        await supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .upload(
            path,
            file,
            {
              cacheControl:"3600",
              upsert:false
            }
          );


      if(uploadError)
        throw uploadError;


      const {
        data:publicData
      }=
        supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .getPublicUrl(
            path
          );


      const {
        error:imageError
      }=
        await supabaseClient
          .from(
            "ig_product_images"
          )
          .insert({

            product_id:
              productId,

            storage_path:
              path,

            public_url:
              publicData.publicUrl,

            is_primary:
              i===0 &&
              !id,

            sort_order:
              i

          });


      if(imageError)
        throw imageError;

    }


    showToast(
      id
        ? "Producto actualizado."
        : "Producto creado."
    );


    closeProductModal();


    await loadAdminProducts();

    await loadProducts();


  }catch(error){

    console.error(error);


    setMessage(
      "productFormMessage",
      error.message ||
        "No se pudo guardar el producto.",
      "error"
    );

  }

}


async function deleteProduct(id){

  const product =
    adminProducts.find(
      p=>p.id===id
    );


  if(!product)return;


  const confirmed =
    confirm(
      `¿Eliminar definitivamente "${product.name}"?\n\n`+
      `Si nunca tuvo ventas, se eliminarán también sus fotos.\n`+
      `Si tuvo ventas, se conservará el historial del pedido.`
    );


  if(!confirmed)return;


  try{

    const {
      data:items,
      error:itemsError
    }=
      await supabaseClient
        .from(
          "ig_order_items"
        )
        .select("id")
        .eq(
          "product_id",
          id
        )
        .limit(1);


    if(itemsError)
      throw itemsError;


    const hadOrders =
      (items || []).length>0;


    const images =
      product.ig_product_images ||
      [];


    const paths =
      images
        .map(
          image=>image.storage_path
        )
        .filter(Boolean);


    if(paths.length){

      const {
        error:storageError
      }=
        await supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .remove(paths);


      if(storageError){

        console.warn(
          "No se pudieron eliminar algunas fotos:",
          storageError
        );

      }

    }


    const {
      error:deleteError
    }=
      await supabaseClient
        .from(
          "ig_products"
        )
        .delete()
        .eq(
          "id",
          id
        );


    if(deleteError)
      throw deleteError;


    if(hadOrders){

      showToast(
        "Producto eliminado del catálogo. El historial de pedidos se conserva."
      );

    }else{

      showToast(
        "Producto y sus fotos eliminados completamente."
      );

    }


    await loadAdminProducts();

    await loadProducts();


  }catch(error){

    console.error(error);


    showToast(
      error.message ||
        "No se pudo eliminar el producto."
    );

  }

}

async function deleteProductImage(
  imageId,
  path
){

  if(
    !confirm(
      "¿Eliminar esta foto?"
    )
  ){

    return;

  }


  try{

    const {
      error:storageError
    }=
      await supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .remove([path]);


    if(storageError)
      throw storageError;


    const {
      error
    }=
      await supabaseClient
        .from(
          "ig_product_images"
        )
        .delete()
        .eq(
          "id",
          imageId
        );


    if(error)
      throw error;


    showToast(
      "Foto eliminada."
    );


    await loadAdminProducts();


    const productId =
      document
        .getElementById(
          "productId"
        )
        .value;


    const product =
      adminProducts.find(
        p=>p.id===productId
      );


    renderProductImages(
      product
    );


    await loadProducts();


  }catch(error){

    console.error(error);


    showToast(
      error.message ||
        "No se pudo eliminar la foto."
    );

  }

}

  return (
    map[status] ||
    status
  );

}


function orderStatusLabel(
  status
){

  const map={

    pending:"Pendiente",

    confirmed:"Confirmado",

    preparing:"Preparando",

    ready:"Listo",

    delivered:"Entregado",

  };


  return (
    map[status] ||
    status
  );

}

async function uploadLogo(){

  const input =
    document.getElementById(
      "logoInput"
    );


  const file =
    input.files[0];


  if(!file){

    showToast(
      "Seleccioná una foto."
    );

    return;

  }


  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    showToast(
      "El archivo debe ser una imagen."
    );

    return;

  }


  try{

    const path =
      `site/logo-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"-")}`;


    const {
      error:uploadError
    }=
      await supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .upload(
          path,
          file,
          {
            cacheControl:"3600",
            upsert:false
          }
        );


    if(uploadError)
      throw uploadError;


    const {
      data:publicData
    }=
      supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .getPublicUrl(
          path
        );


    const oldLogo =
      settings.logo_url;


    const {
      error:dbError
    }=
      await supabaseClient
        .from(
          "ig_site_settings"
        )
        .upsert(
          {
            key:"logo_url",
            value:
              publicData.publicUrl
          },
          {
            onConflict:"key"
          }
        );


    if(dbError)
      throw dbError;


    settings.logo_url =
      publicData.publicUrl;


    if(oldLogo){

      const oldPath =
        extractStoragePath(
          oldLogo
        );


      if(oldPath){

        await supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .remove(
            [oldPath]
          );

      }

    }


    document
      .getElementById(
        "logoPreview"
      )
      .innerHTML=
        `
          <img
            src="${escapeHtml(settings.logo_url)}"
            alt="Logotipo">
        `;


    updateBrand();


    showToast(
      "Logotipo actualizado."
    );


  }catch(error){

    console.error(error);


    showToast(
      error.message ||
        "No se pudo subir el logotipo."
    );

  }

}


function extractStoragePath(
  url
){

  if(!url)return null;


  const marker =
    `/storage/v1/object/public/${STORAGE_BUCKET}/`;


  const index =
    url.indexOf(marker);


  if(index===-1)
    return null;


  return decodeURIComponent(
    url.substring(
      index+
      marker.length
    )
  );

}


function updateBrand(){

  const brandName =
    document.getElementById(
      "brandName"
    );


  if(brandName){

    brandName.textContent =
      settings.store_name;

  }


  const logo =

  if(logo){

    if(settings.logo_url){

        settings.logo_url;

      logo.classList.remove(
        "hidden"
      );

    }else{

      logo.classList.add(

      );

    }

  }


  const heroTitle =
    document.getElementById(

    );


  if(heroTitle){

    heroTitle.textContent =

  }

    if(ok){

      adminUser =
        data.session.user;

    }

  }


  supabaseClient
    .auth
    .onAuthStateChange(
      async(event,session)=>{

        if(
          event==="SIGNED_OUT"
        ){

          adminUser=null;

        }


        if(session){

          const ok =
            await verifyAdmin(
              session.user
            );


          if(ok){

            adminUser =
              session.user;

          }

        }

      }
    );

}

    total,
    visible
  ) {

    const old =
      document.getElementById(
        "igCategoryEmpty"
      );

    if (old) {

      old.remove();

    }

    if (
      currentCategory === "all"
    ) {

      return;

    }

    if (
      total > 0 &&
      visible === 0
    ) {

      const message =
        document.createElement(
          "div"
        );

      message.id =
        "igCategoryEmpty";

      message.innerHTML = `

        <h3>
          No hay productos en esta categoría
        </h3>

        <p>
          Probá con otra categoría.
        </p>

      `;

      container.appendChild(
        message
      );

    }

  }


  /* ==========================================================
     OBSERVAR NUEVOS RENDERIZADOS
     
     IMPORTANTE:
     La app actual ejecuta renderProducts().
     No la reemplazamos.
     
     Si renderProducts() vuelve a crear las tarjetas,
     este observador vuelve a aplicar el filtro.
     ========================================================== */

  function watchProducts() {

    const container =
      document.getElementById(
        "productsContainer"
      );

    if (!container) {

      return;

    }

    if (observer) {

      observer.disconnect();

    }

    observer =
      new MutationObserver(
        function () {

          requestAnimationFrame(
            function () {

              applyFilter();

            }
          );

        }
      );

    observer.observe(
      container,
      {
        childList:true,
        subtree:true
      }
    );

    applyFilter();

  }


  /* ==========================================================
     INICIALIZACIÓN
     ========================================================== */

  function initialize() {

    if (initialized) {

      return;

    }

    initialized = true;

    waitForStore(
      async function (productsContainer) {

        injectStyles();

        createCategoryArea(
          productsContainer
        );

        await loadCategories();

        watchProducts();

      }
    );

  }


  /* ==========================================================
     API DE DIAGNÓSTICO
     ========================================================== */

  window.InternationalGatewayCategories = {

    version:VERSION,

    current:function () {

      return currentCategory;

    },

    showAll:function () {

      selectCategory("all");

    },

    refresh:function () {

      loadCategories();

    }

  };


  /* ==========================================================
     ARRANQUE
     ========================================================== */

  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      initialize,
      {
        once:true
      }
    );

  } else {

    initialize();

  }

})();
</script>

<script>
(function(){

  "use strict";

  /* =======================================================
     CONFIGURACIÓN
  ======================================================= */

  const IG_SPLASH_BUCKET = "international-gateway";

  const IG_SPLASH_KEYS = {
    enabled: "splash_enabled",
    image: "splash_image_url",
    title: "splash_title",
    subtitle: "splash_subtitle",
    button: "splash_button_text"
  };

  let igSplashSettings = {
    enabled:false,
    image:"",
    title:"",
    subtitle:"",
    button:"Entrar a la tienda"
  };

  let igSplashStarted = false;
  let igSplashAdminInjected = false;


  /* =======================================================
     UTILIDADES
  ======================================================= */

  function igGetSupabase(){

    if(
      typeof window.supabaseClient !== "undefined" &&
      window.supabaseClient
    ){
      return window.supabaseClient;
    }

    if(
      typeof supabaseClient !== "undefined" &&
      supabaseClient
    ){
      return supabaseClient;
    }

    return null;
  }


  function igEscape(value){

    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  /* =======================================================
     LEER CONFIGURACIÓN DE SUPABASE
  ======================================================= */

  async function igLoadSplashSettings(){

    const client = igGetSupabase();

    if(!client){
      console.warn(
        "[International Gateway] Supabase aún no disponible."
      );
      return false;
    }

    try{

      const {data,error} = await client
        .from("ig_site_settings")
        .select("key,value")
        .in("key",[
          IG_SPLASH_KEYS.enabled,
          IG_SPLASH_KEYS.image,
          IG_SPLASH_KEYS.title,
          IG_SPLASH_KEYS.subtitle,
          IG_SPLASH_KEYS.button
        ]);

      if(error){
        console.warn(
          "[International Gateway] No se pudieron leer ajustes de pantalla de inicio:",
          error
        );
        return false;
      }

      const values = {};

      (data || []).forEach(row=>{
        values[row.key] = row.value;
      });

      igSplashSettings.enabled =
        values[IG_SPLASH_KEYS.enabled] === true ||
        values[IG_SPLASH_KEYS.enabled] === "true" ||
        values[IG_SPLASH_KEYS.enabled] === "1";

      igSplashSettings.image =
        values[IG_SPLASH_KEYS.image] || "";

      igSplashSettings.title =
        values[IG_SPLASH_KEYS.title] || "";

      igSplashSettings.subtitle =
        values[IG_SPLASH_KEYS.subtitle] || "";

      igSplashSettings.button =
        values[IG_SPLASH_KEYS.button] ||
        "Entrar a la tienda";

      return true;

    }catch(error){

      console.error(
        "[International Gateway] Error cargando pantalla de inicio:",
        error
      );

      return false;
    }
  }


  /* =======================================================
     MOSTRAR PANTALLA DE INICIO
  ======================================================= */

  function igShowSplash(){

    const screen =
      document.getElementById("igSplashScreen");

    const image =
      document.getElementById("igSplashImage");

    const title =
      document.getElementById("igSplashTitle");

    const subtitle =
      document.getElementById("igSplashSubtitle");

    const enter =
      document.getElementById("igSplashEnter");

    if(!screen || !image || !enter){
      return;
    }

    if(
      !igSplashSettings.enabled ||
      !igSplashSettings.image
    ){
      igHideSplash();
      return;
    }

    image.src = igSplashSettings.image;

    title.textContent =
      igSplashSettings.title || "";

    subtitle.textContent =
      igSplashSettings.subtitle || "";

    enter.textContent =
      igSplashSettings.button ||
      "Entrar a la tienda";

    screen.classList.add("ig-splash-visible");
    screen.setAttribute("aria-hidden","false");

    document.body.classList.add("ig-splash-lock");

    igSplashStarted = true;
  }


  /* =======================================================
     CERRAR
  ======================================================= */

  function igHideSplash(){

    const screen =
      document.getElementById("igSplashScreen");

    if(!screen){
      return;
    }

    screen.classList.remove("ig-splash-visible");
    screen.setAttribute("aria-hidden","true");

    document.body.classList.remove("ig-splash-lock");

  }


  /* =======================================================
     BOTÓN ENTRAR
  ======================================================= */

  document.addEventListener("click",function(event){

    const button =
      event.target.closest("#igSplashEnter");

    if(!button){
      return;
    }

    igHideSplash();

  });


  /* =======================================================
     INICIAR SIN INTERFERIR CON init()
  ======================================================= */

  async function igStartSplash(){

    if(igSplashStarted){
      return;
    }

    /*
      Esperamos a que la aplicación original haya creado
      Supabase y su estructura.
    */

    let attempts = 0;

    while(!igGetSupabase() && attempts < 50){

      await new Promise(resolve =>
        setTimeout(resolve,200)
      );

      attempts++;

    }

    if(!igGetSupabase()){
      return;
    }

    await igLoadSplashSettings();

    igShowSplash();

  }


  /* =======================================================
     PANEL ADMINISTRADOR
  ======================================================= */

  function igFindAdminSettingsSection(){

    const candidates = [
      "#adminSettings",
      "#settingsSection",
      "#admin-settings",
      '[data-section="settings"]'
    ];

    for(const selector of candidates){

      const element =
        document.querySelector(selector);

      if(element){
        return element;
      }

    }

    /*
      Si no encontramos un ID concreto, buscamos
      la sección que contenga "Configuración".
    */

    const sections =
      document.querySelectorAll(
        ".admin-section"
      );

    for(const section of sections){

      const text =
        (section.textContent || "").toLowerCase();

      if(
        text.includes("configuración") ||
        text.includes("configuracion")
      ){
        return section;
      }

    }

    return null;
  }


  function igCreateAdminPanel(){

    if(igSplashAdminInjected){
      return;
    }

    const section =
      igFindAdminSettingsSection();

    if(!section){
      return false;
    }

    /*
      Evitamos duplicarlo si se ejecuta más de una vez.
    */

    if(
      document.getElementById(
        "igSplashAdminBox"
      )
    ){
      igSplashAdminInjected = true;
      return true;
    }

    const box =
      document.createElement("div");

    box.id = "igSplashAdminBox";

    box.innerHTML = `

      <h3>📱 Pantalla de inicio</h3>

      <div class="ig-help">
        Configura la pantalla que aparecerá antes
        de entrar a la tienda. La fotografía se puede
        seleccionar directamente desde la galería del celular.
      </div>

      <div class="ig-admin-grid">

        <label>
          <input
            type="checkbox"
            id="igSplashEnabled"
          >
          Activar pantalla de inicio
        </label>

        <div>

          <label>
            Fotografía de inicio
          </label>

          <input
            type="file"
            id="igSplashFile"
            accept="image/*"
          >

          <div id="igSplashAdminPreview">
            <img
              id="igSplashAdminPreviewImg"
              src=""
              alt="Vista previa"
            >
          </div>

        </div>

        <div>

          <label>
            Título
          </label>

          <input
            type="text"
            id="igSplashAdminTitle"
            placeholder="International Gateway"
          >

        </div>

        <div>

          <label>
            Subtítulo
          </label>

          <textarea
            id="igSplashAdminSubtitle"
            placeholder="Bienvenido a nuestra tienda"
          ></textarea>

        </div>

        <div>

          <label>
            Texto del botón
          </label>

          <input
            type="text"
            id="igSplashAdminButton"
            placeholder="Entrar a la tienda"
          >

        </div>

        <div class="ig-splash-admin-actions">

          <button
            type="button"
            class="button"
            id="igSplashSave"
          >
            💾 Guardar pantalla de inicio
          </button>

          <button
            type="button"
            class="button secondary"
            id="igSplashTest"
          >
            👁️ Probar pantalla
          </button>

        </div>

        <div
          id="igSplashAdminStatus"
          class="ig-splash-admin-status"
        >
          Sin cambios.
        </div>

      </div>

    `;

    section.appendChild(box);

    igSplashAdminInjected = true;

    igFillAdminValues();

    igSetupAdminEvents();

    return true;
  }


  /* =======================================================
     CARGAR VALORES EN ADMIN
  ======================================================= */

  function igFillAdminValues(){

    const enabled =
      document.getElementById(
        "igSplashEnabled"
      );

    const title =
      document.getElementById(
        "igSplashAdminTitle"
      );

    const subtitle =
      document.getElementById(
        "igSplashAdminSubtitle"
      );

    const button =
      document.getElementById(
        "igSplashAdminButton"
      );

    const preview =
      document.getElementById(
        "igSplashAdminPreview"
      );

    const previewImg =
      document.getElementById(
        "igSplashAdminPreviewImg"
      );

    if(enabled){
      enabled.checked =
        igSplashSettings.enabled;
    }

    if(title){
      title.value =
        igSplashSettings.title;
    }

    if(subtitle){
      subtitle.value =
        igSplashSettings.subtitle;
    }

    if(button){
      button.value =
        igSplashSettings.button ||
        "Entrar a la tienda";
    }

    if(
      preview &&
      previewImg &&
      igSplashSettings.image
    ){

      previewImg.src =
        igSplashSettings.image;

      preview.style.display =
        "block";
    }

  }


  /* =======================================================
     EVENTOS ADMIN
  ======================================================= */

  function igSetupAdminEvents(){

    const file =
      document.getElementById(
        "igSplashFile"
      );

    const save =
      document.getElementById(
        "igSplashSave"
      );

    const test =
      document.getElementById(
        "igSplashTest"
      );

    if(file){

      file.addEventListener(
        "change",
        function(){

          const selected =
            file.files &&
            file.files[0];

          if(!selected){
            return;
          }

          if(
            !selected.type.startsWith("image/")
          ){

            igSetAdminStatus(
              "El archivo seleccionado no es una imagen.",
              true
            );

            file.value = "";

            return;
          }

          const url =
            URL.createObjectURL(selected);

          const preview =
            document.getElementById(
              "igSplashAdminPreview"
            );

          const previewImg =
            document.getElementById(
              "igSplashAdminPreviewImg"
            );

          if(preview && previewImg){

            previewImg.src = url;
            preview.style.display = "block";

          }

        }
      );

    }


    if(save){

      save.addEventListener(
        "click",
        igSaveSplash
      );

    }


    if(test){

      test.addEventListener(
        "click",
        function(){

          const enabled =
            document.getElementById(
              "igSplashEnabled"
            );

          const title =
            document.getElementById(
              "igSplashAdminTitle"
            );

          const subtitle =
            document.getElementById(
              "igSplashAdminSubtitle"
            );

          const button =
            document.getElementById(
              "igSplashAdminButton"
            );

          igSplashSettings.enabled =
            true;

          igSplashSettings.title =
            title?.value || "";

          igSplashSettings.subtitle =
            subtitle?.value || "";

          igSplashSettings.button =
            button?.value ||
            "Entrar a la tienda";

          if(
            !igSplashSettings.image
          ){

            igSetAdminStatus(
              "Primero selecciona y guarda una fotografía.",
              true
            );

            if(enabled){
              enabled.checked = false;
            }

            return;
          }

          igShowSplash();

        }
      );

    }

  }


  /* =======================================================
     GUARDAR
  ======================================================= */

  async function igSaveSplash(){

    const client =
      igGetSupabase();

    if(!client){

      igSetAdminStatus(
        "Supabase todavía no está disponible.",
        true
      );

      return;
    }

    const enabled =
      document.getElementById(
        "igSplashEnabled"
      );

    const title =
      document.getElementById(
        "igSplashAdminTitle"
      );

    const subtitle =
      document.getElementById(
        "igSplashAdminSubtitle"
      );

    const button =
      document.getElementById(
        "igSplashAdminButton"
      );

    const file =
      document.getElementById(
        "igSplashFile"
      );

    try{

      igSetAdminStatus(
        "Guardando...",
        false
      );

      let imageUrl =
        igSplashSettings.image;

      /*
        Si se seleccionó una nueva foto,
        la subimos al bucket existente.
      */

      if(
        file &&
        file.files &&
        file.files[0]
      ){

        const selected =
          file.files[0];

        if(
          !selected.type.startsWith("image/")
        ){
          throw new Error(
            "El archivo debe ser una imagen."
          );
        }

        const extension =
          (
            selected.name
              .split(".")
              .pop() ||
            "jpg"
          )
          .toLowerCase()
          .replace(/[^a-z0-9]/g,"");

        const fileName =
          "splash_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2) +
          "." +
          extension;

        const storagePath =
          "site/" + fileName;

        const upload =
          await client
            .storage
            .from(IG_SPLASH_BUCKET)
            .upload(
              storagePath,
              selected,
              {
                cacheControl:"3600",
                upsert:false,
                contentType:selected.type
              }
            );

        if(upload.error){
          throw upload.error;
        }

        const publicResult =
          client
            .storage
            .from(IG_SPLASH_BUCKET)
            .getPublicUrl(
              storagePath
            );

        imageUrl =
          publicResult.data.publicUrl;

      }


      const rows = [

        {
          key:IG_SPLASH_KEYS.enabled,
          value:String(
            !!enabled?.checked
          )
        },

        {
          key:IG_SPLASH_KEYS.image,
          value:imageUrl || ""
        },

        {
          key:IG_SPLASH_KEYS.title,
          value:title?.value || ""
        },

        {
          key:IG_SPLASH_KEYS.subtitle,
          value:subtitle?.value || ""
        },

        {
          key:IG_SPLASH_KEYS.button,
          value:
            button?.value ||
            "Entrar a la tienda"
        }

      ];


      const result =
        await client
          .from("ig_site_settings")
          .upsert(
            rows,
            {
              onConflict:"key"
            }
          );

      if(result.error){
        throw result.error;
      }


      /*
        Actualizamos memoria local.
      */

      igSplashSettings = {

        enabled:
          !!enabled?.checked,

        image:
          imageUrl || "",

        title:
          title?.value || "",

        subtitle:
          subtitle?.value || "",

        button:
          button?.value ||
          "Entrar a la tienda"

      };


      igSetAdminStatus(
        "✓ Pantalla de inicio guardada correctamente.",
        false
      );


      /*
        Limpiamos input para permitir seleccionar
        nuevamente la misma fotografía.
      */

      if(file){
        file.value = "";
      }

    }catch(error){

      console.error(
        "[International Gateway] Error guardando pantalla de inicio:",
        error
      );

      igSetAdminStatus(
        "No se pudo guardar: " +
        (error?.message || error),
        true
      );

    }

  }


  function igSetAdminStatus(
    message,
    isError
  ){

    const status =
      document.getElementById(
        "igSplashAdminStatus"
      );

    if(!status){
      return;
    }

    status.textContent =
      message;

    status.classList.toggle(
      "error",
      !!isError
    );

    status.classList.toggle(
      "ok",
      !isError &&
      message.startsWith("✓")
    );

  }


  /* =======================================================
     COMPARTIR PRODUCTOS
  ======================================================= */

  async function igShareProduct(product){

    if(!product || !product.id){
      return;
    }

    const url =
      new URL(
        window.location.href
      );

    /*
      Quitamos parámetros anteriores para que
      el enlace identifique exactamente este producto.
    */

    url.search = "";
    url.hash = "";

    url.searchParams.set(
      "producto",
      String(product.id)
    );

    const shareUrl =
      url.toString();

    const title =
      product.name ||
      "Producto de International Gateway";

    const text =
      (
        "Mirá este producto de International Gateway: " +
        title
      );

    try{

      if(
        navigator.share &&
        typeof navigator.share === "function"
      ){

        await navigator.share({

          title:title,

          text:text,

          url:shareUrl

        });

        return;

      }

      if(
        navigator.clipboard &&
        navigator.clipboard.writeText
      ){

        await navigator.clipboard.writeText(
          shareUrl
        );

        if(
          typeof window.showToast === "function"
        ){
          window.showToast(
            "✓ Enlace del producto copiado"
          );
        }else{
          alert(
            "✓ Enlace del producto copiado."
          );
        }

        return;

      }

      window.prompt(
        "Copiá el enlace del producto:",
        shareUrl
      );

    }catch(error){

      /*
        Cancelar el menú nativo de compartir
        no debe generar un error visible.
      */

      if(
        error &&
        error.name === "AbortError"
      ){
        return;
      }

      console.warn(
        "[International Gateway] Error compartiendo producto:",
        error
      );

    }

  }


  /* =======================================================
     BUSCAR PRODUCTO ACTUAL
  ======================================================= */

  function igFindProductFromCard(card){

    if(!card){
      return null;
    }

    /*
      Si en el futuro el producto ya tiene ID,
      lo utilizamos directamente.
    */

    const directId =
      card.dataset.productId ||
      card.getAttribute(
        "data-product-id"
      );

    if(
      directId &&
      Array.isArray(window.products)
    ){

      const direct =
        window.products.find(
          p =>
            String(p.id) ===
            String(directId)
        );

      if(direct){
        return direct;
      }

    }

    /*
      La versión actual de la aplicación
      muestra el nombre dentro de h3.
    */

    const nameElement =
      card.querySelector(
        "h3"
      );

    const name =
      nameElement?.textContent
        ?.trim();

    if(!name){
      return null;
    }

    /*
      Intentamos primero con la variable
      global existente.
    */

    if(
      Array.isArray(window.products)
    ){

      const found =
        window.products.find(
          p =>
            String(p.name || "")
              .trim() === name
        );

      if(found){
        return found;
      }

    }

    /*
      Compatibilidad si products existe
      como variable global pero no está
      expuesta explícitamente.
    */

    try{

      if(
        typeof products !== "undefined" &&
        Array.isArray(products)
      ){

        return products.find(
          p =>
            String(p.name || "")
              .trim() === name
        ) || null;

      }

    }catch(e){}

    return null;

  }


  /* =======================================================
     INYECTAR BOTONES SIN MODIFICAR RENDERPRODUCTS
  ======================================================= */

  function igInjectShareButtons(){

    const cards =
      document.querySelectorAll(
        ".product-card"
      );

    cards.forEach(card=>{

      if(
        card.querySelector(
          ".ig-product-share"
        )
      ){
        return;
      }

      const product =
        igFindProductFromCard(card);

      if(!product){
        return;
      }

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "ig-product-share";

      button.innerHTML =
        "📤 Compartir producto";

      button.addEventListener(
        "click",
        function(event){

          event.preventDefault();
          event.stopPropagation();

          igShareProduct(product);

        }
      );

      /*
        Lo ponemos al final de la zona de
        contenido, sin alterar botones existentes.
      */

      const content =
        card.querySelector(
          ".product-content"
        );

      if(content){
        content.appendChild(button);
      }else{
        card.appendChild(button);
      }

    });

  }


  /* =======================================================
     OBSERVADOR DE PRODUCTOS
  ======================================================= */

  function igObserveProducts(){

    const container =
      document.getElementById(
        "productsContainer"
      );

    if(!container){
      return false;
    }

    igInjectShareButtons();

    /*
      Si renderProducts() vuelve a dibujar los
      productos, los botones se vuelven a insertar.
    */

    const observer =
      new MutationObserver(
        function(){

          igInjectShareButtons();

        }
      );

    observer.observe(
      container,
      {
        childList:true,
        subtree:true
      }
    );

    return true;

  }


  /* =======================================================
     ENLACE DIRECTO A PRODUCTO
  ======================================================= */

  async function igOpenSharedProduct(){

    const params =
      new URLSearchParams(
        window.location.search
      );

    const productId =
      params.get("producto");

    if(!productId){
      return;
    }

    /*
      Esperamos a que la aplicación haya
      cargado sus productos.
    */

    let attempts = 0;

    while(attempts < 60){

      let list = null;

      try{

        if(
          typeof products !== "undefined" &&
          Array.isArray(products)
        ){
          list = products;
        }

      }catch(e){}

      if(
        !list &&
        Array.isArray(window.products)
      ){
        list = window.products;
      }

      if(
        list &&
        list.length
      ){

        const product =
          list.find(
            p =>
              String(p.id) ===
              String(productId)
          );

        if(product){

          /*
            Si existe una función de detalle
            ya creada por la aplicación,
            la utilizamos.

            Si no existe, mostramos una
            presentación segura del producto.
          */

          if(
            typeof window.viewProduct ===
            "function"
          ){

            window.viewProduct(
              product.id
            );

            return;

          }

          if(
            typeof window.showProduct ===
            "function"
          ){

            window.showProduct(
              product.id
            );

            return;

          }

          /*
            Fallback: desplazamos hasta la tarjeta.
          */

          igScrollToProductCard(
            product
          );

          return;

        }

      }

      await new Promise(
        resolve =>
          setTimeout(resolve,200)
      );

      attempts++;

    }

  }


  function igScrollToProductCard(product){

    const cards =
      document.querySelectorAll(
        ".product-card"
      );

    for(const card of cards){

      const candidate =
        igFindProductFromCard(card);

      if(
        candidate &&
        String(candidate.id) ===
        String(product.id)
      ){

        card.scrollIntoView({
          behavior:"smooth",
          block:"center"
        });

        card.style.outline =
          "3px solid #111";

        setTimeout(
          ()=>{
            card.style.outline = "";
          },
          2500
        );

        return;
      }

    }

  }


  /* =======================================================
     ARRANQUE
  ======================================================= */

  function igBoot(){

    /*
      Pantalla de inicio.
    */

    igStartSplash();

    /*
      Productos.
    */

    let productAttempts = 0;

    const productTimer =
      setInterval(
        function(){

          if(
            igObserveProducts()
          ){

            clearInterval(
              productTimer
            );

            return;
          }

          productAttempts++;

          if(
            productAttempts > 80
          ){

            clearInterval(
              productTimer
            );

          }

        },
        250
      );


    /*
      Panel de administración.
      Esperamos a que la aplicación original
      cree su panel.
    */

    let adminAttempts = 0;

    const adminTimer =
      setInterval(
        function(){

          if(
            igCreateAdminPanel()
          ){

            clearInterval(
              adminTimer
            );

            return;
          }

          adminAttempts++;

          if(
            adminAttempts > 80
          ){

            clearInterval(
              adminTimer
            );

          }

        },
        250
      );


    /*
      Enlaces compartidos.
    */

    igOpenSharedProduct();

  }


  if(
    document.readyState ===
    "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      igBoot,
      {once:true}
    );

  }else{

    igBoot();

  }


  /*
    Exponemos solamente funciones nuevas.
    No reemplazamos ninguna función existente.
  */

  window.InternationalGatewaySplash = {

    show:igShowSplash,
    hide:igHideSplash,
    reload:igLoadSplashSettings

  };

  window.InternationalGatewayProductShare = {

    share:igShareProduct

  };

})();
</script>
  <script>
/* ============================================================
   INTERNATIONAL GATEWAY
   PARCHE: COMPARTIR PRODUCTO + FOTO
   No modifica productos, carrito, Supabase ni administración.
   ============================================================ */
(function () {
  "use strict";

  const VERSION = "IG-PRODUCT-SHARE-FILE-1.0.0";

  function getProductFromButton(button) {
    const card = button.closest(".product-card");
    if (!card) return null;

    let productId =
      card.dataset.productId ||
      card.getAttribute("data-product-id") ||
      "";

    if (productId && Array.isArray(window.products)) {
      const found = window.products.find(
        p => String(p.id) === String(productId)
      );
      if (found) return found;
    }

    const nameEl =
      card.querySelector("h3") ||
      card.querySelector(".product-name") ||
      card.querySelector("[class*='product-name']");

    const name = nameEl ? nameEl.textContent.trim() : "";

    if (name && Array.isArray(window.products)) {
      const found = window.products.find(
        p => String(p.name || "").trim() === name
      );
      if (found) return found;
    }

    return {
      id: productId || "",
      name: name || "Producto",
      description: "",
      price: "",
      images: []
    };
  }

  function getProductImage(product, card) {
    /* Primero intentamos utilizar la imagen almacenada en el producto */
    if (product && Array.isArray(product.ig_product_images)) {
      const images = [...product.ig_product_images]
        .sort((a, b) => {
          if (a.is_primary !== b.is_primary) {
            return a.is_primary ? -1 : 1;
          }
          return Number(a.sort_order || 0) - Number(b.sort_order || 0);
        });

      const first = images.find(
        img => img.public_url || img.url
      );

      if (first) {
        return first.public_url || first.url;
      }
    }

    /* También buscamos la imagen visible de la tarjeta */
    if (card) {
      const img = card.querySelector("img");
      if (img && img.src) return img.src;
    }

    return "";
  }

  function getProductUrl(product) {
    const url = new URL(window.location.href);

    if (product && product.id) {
      url.searchParams.set("producto", product.id);
    }

    return url.toString();
  }

  async function imageUrlToFile(imageUrl, productName) {
    if (!imageUrl) return null;

    try {
      const response = await fetch(imageUrl, {
        mode: "cors",
        cache: "no-cache"
      });

      if (!response.ok) return null;

      const blob = await response.blob();

      if (!blob || !blob.size) return null;

      let extension = "jpg";

      if (blob.type === "image/png") extension = "png";
      else if (blob.type === "image/webp") extension = "webp";
      else if (blob.type === "image/jpeg") extension = "jpg";

      const safeName = String(productName || "producto")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9_-]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .substring(0, 60) || "producto";

      return new File(
        [blob],
        safeName + "." + extension,
        {
          type: blob.type || "image/jpeg"
        }
      );

    } catch (error) {
      console.warn(
        "[IG Product Share] No se pudo obtener la imagen:",
        error
      );
      return null;
    }
  }

  async function shareProduct(button) {
    const product = getProductFromButton(button);
    const card = button.closest(".product-card");

    if (!product) {
      console.warn("[IG Product Share] No se encontró el producto.");
      return;
    }

    const name =
      product.name ||
      "Producto International Gateway";

    const description =
      product.description ||
      product.characteristics ||
      "";

    const url = getProductUrl(product);

    const shareText =
      "🛍️ " + name +
      "\n\n" +
      (description ? description + "\n\n" : "") +
      "Ver producto:\n" +
      url;

    /* Evita dobles clics */
    if (button.dataset.sharing === "1") return;

    button.dataset.sharing = "1";

    const originalText = button.textContent;

    try {
      button.textContent = "📤 Preparando...";

      const imageUrl = getProductImage(product, card);
      const imageFile = await imageUrlToFile(imageUrl, name);

      /*
       * PRIMERA OPCIÓN:
       * Compartir FOTO + TEXTO + ENLACE.
       */
      if (
        imageFile &&
        navigator.share &&
        navigator.canShare
      ) {
        const shareData = {
          title: name,
          text: shareText,
          files: [imageFile]
        };

        if (navigator.canShare(shareData)) {
          button.textContent = "📤 Compartiendo...";

          await navigator.share(shareData);

          return;
        }
      }

      /*
       * SEGUNDA OPCIÓN:
       * Si el navegador no admite archivos,
       * mantenemos el compartir tradicional.
       */
      if (navigator.share) {
        button.textContent = "📤 Compartiendo...";

        await navigator.share({
          title: name,
          text: shareText,
          url: url
        });

        return;
      }

      /*
       * TERCERA OPCIÓN:
       * Navegadores sin Web Share API.
       */
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(url);

        alert(
          "Enlace del producto copiado al portapapeles."
        );

        return;
      }

      window.prompt(
        "Copia el enlace del producto:",
        url
      );

    } catch (error) {

      /*
       * Cancelar el menú nativo de compartir
       * NO debe considerarse un error.
       */
      if (
        error &&
        error.name === "AbortError"
      ) {
        return;
      }

      console.warn(
        "[IG Product Share] Error al compartir:",
        error
      );

      /*
       * Último respaldo:
       * copiar solamente el enlace.
       */
      try {
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(url);

          alert(
            "No se pudo compartir la foto directamente.\n\n" +
            "El enlace del producto fue copiado."
          );

          return;
        }
      } catch (_) {}

      window.prompt(
        "Copia el enlace del producto:",
        url
      );

    } finally {
      button.dataset.sharing = "0";
      button.textContent = originalText;
    }
  }

  /*
   * Delegación de eventos.
   * No necesitamos modificar las tarjetas originales.
   */
  document.addEventListener(
    "click",
    function (event) {

      const button =
        event.target.closest(
          ".ig-product-share, .product-share"
        );

      if (!button) return;

      event.preventDefault();
      event.stopPropagation();

      shareProduct(button);
    },
    true
  );

  /*
   * También permite que el parche encuentre botones
   * creados posteriormente por renderProducts().
   */
  window.InternationalGatewayProductShareFile = {
    version: VERSION,
    share: shareProduct
  };

  console.log(
    "[International Gateway] " +
    VERSION +
    " activo."
  );

})();
</script>

          ?.value
          .trim(),

      delivery_notes:
        document
          .getElementById("igShipNotes")
          ?.value
          .trim()

    };

  /* =========================================================
     CREAR PEDIDO CON ENVÍO PENDIENTE
     ========================================================= */

  async function igCreateOrderWithShipping(){

    if(!cart || !cart.length){

      showToast("El carrito está vacío.");
      return;

    }

    const name =
      document
        .getElementById("customerName")
        ?.value
        .trim();

    const phone =
      document
        .getElementById("customerPhone")
        ?.value
        .trim();

    const email =
      document
        .getElementById("customerEmail")
        ?.value
        .trim();

    const paymentMethod =
      document
        .getElementById("paymentMethod")
        ?.value;

    const shipping =
      igReadShipping();

    if(
      !name ||
      !phone ||
      !email ||
      !paymentMethod
    ){

      igMsg(
        "Completá todos los datos del cliente y seleccioná un método de pago.",
        "error"
      );

      return;

    }

    const requiredShipping = [

      shipping.full_name,
      shipping.phone,
      shipping.address,
      shipping.address_number,
      shipping.locality,
      shipping.province,
      shipping.postal_code,
      shipping.country

    ];

    if(
      requiredShipping.some(
        value=>!value
      )
    ){

      igMsg(
        "Completá todos los datos necesarios para presupuestar el envío.",
        "error"
      );

      return;

    }

    const button =
      document.getElementById(
        "finishOrderButton"
      );

    if(button){

      button.disabled=true;
      button.textContent=
        "Registrando pedido...";

    }

    let orderId=null;

    try{

      /* -----------------------------------------------------
         VERIFICAR PRODUCTOS ACTUALES
         ----------------------------------------------------- */

      const ids =
        cart.map(
          item=>item.id
        );

      const {
        data:currentProducts,
        error:productsError
      } =
        await supabaseClient
          .from("ig_products")
          .select(`
            id,
            name,
            price,
            available,
            active
          `)
          .in("id",ids);

      if(productsError){
        throw productsError;
      }

      let validItems=[];
      let subtotal=0;

      for(
        const item of cart
      ){

        const product =
          (currentProducts || [])
            .find(
              p=>p.id===item.id
            );

        if(
          !product ||
          !product.active ||
          !product.available
        ){

          throw new Error(
            `El producto "${item.name}" ya no está disponible.`
          );

        }

        const quantity =
          Math.max(
            1,
            Number(item.quantity)
          );

        const price =
          Number(product.price);

        const itemSubtotal =
          price * quantity;

        validItems.push({

          product_id:
            product.id,

          product_name:
            product.name,

          product_price:
            price,

          quantity:
            quantity,

          subtotal:
            itemSubtotal

        });

        subtotal +=
          itemSubtotal;

      }


      /* -----------------------------------------------------
         CREAR PEDIDO
         ----------------------------------------------------- */

      orderId =
        crypto.randomUUID();

      const orderNumber =
        Date.now();

      const {
        error:orderError
      } =
        await supabaseClient
          .from("ig_orders")
          .insert({

            id:
              orderId,

            order_number:
              orderNumber,

            customer_name:
              name,

            customer_phone:
              phone,

            customer_email:
              email,

            payment_method:
              paymentMethod,

            payment_status:
              "pending",

            order_status:
              "pending",

            subtotal:
              subtotal,

            total:
              subtotal

          });

      if(orderError){
        throw orderError;
      }


      /* -----------------------------------------------------
         ITEMS
         ----------------------------------------------------- */

      const {
        error:itemsError
      } =
        await supabaseClient
          .from("ig_order_items")
          .insert(
            validItems.map(
              item=>({

                order_id:
                  orderId,

                ...item

              })
            )
          );

      if(itemsError){
        throw itemsError;
      }


      /* -----------------------------------------------------
         SOLICITUD DE ENVÍO
         ----------------------------------------------------- */

      const {
        data:shippingRow,
        error:shippingError
      } =
        await supabaseClient
          .from("ig_shipping_quotes")
          .insert({

            order_id:
              orderId,

            full_name:
              shipping.full_name,

            phone:
              shipping.phone,

            email:
              email,

            address:
              shipping.address,

            address_number:
              shipping.address_number,

            floor_department:
              shipping.floor_department || null,

            locality:
              shipping.locality,

            province:
              shipping.province,

            postal_code:
              shipping.postal_code,

            country:
              shipping.country,

            delivery_notes:
              shipping.delivery_notes || null,

            shipping_cost:
              0,

            status:
              "pending"

          })
          .select(
            "id,access_token"
          )
          .single();

      if(shippingError){
        throw shippingError;
      }


      /* -----------------------------------------------------
         GUARDAR REFERENCIA LOCAL
         ----------------------------------------------------- */

      localStorage.setItem(
        "ig_shipping_order",
        JSON.stringify({

          order_number:
            orderNumber,

          phone:
            shipping.phone,

          access_token:
            shippingRow?.access_token ||
            null

        })
      );


      /* -----------------------------------------------------
         LIMPIAR CARRITO
         ----------------------------------------------------- */

      cart=[];

      saveCart();
      updateCartCount();


      /* -----------------------------------------------------
         CONFIRMACIÓN
         ----------------------------------------------------- */

      igShowPendingConfirmation({

        order_number:
          orderNumber,

        subtotal:
          subtotal,

        paymentMethod:
          paymentMethod

      });

    }catch(error){

      console.error(
        "IG shipping checkout:",
        error
      );

      /*
        Limpieza para evitar pedidos huérfanos
        si falla algún paso posterior.
      */

      if(orderId){

        await supabaseClient
          .from("ig_shipping_quotes")
          .delete()
          .eq("order_id",orderId);

        await supabaseClient
          .from("ig_order_items")
          .delete()
          .eq("order_id",orderId);

        await supabaseClient
          .from("ig_orders")
          .delete()
          .eq("id",orderId);

      }

      igMsg(
        error.message ||
        "No se pudo registrar el pedido.",
        "error"
      );

    }finally{

      if(button){

        button.disabled=false;

        button.textContent=
          "Confirmar pedido";

      }

    }

  }
