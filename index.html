  /* =========================================================
     CONSULTAR COTIZACIÓN
     ========================================================= */

  async function igCheckClientQuote(){

    const saved =
      JSON.parse(
        localStorage.getItem(
          "ig_shipping_order"
        ) || "null"
      );

    const result =
      document.getElementById(
        "igClientQuoteResult"
      );

    if(!saved || !result){
      return;
    }

    result.innerHTML=
      "🔄 Consultando cotización...";

    try{

      const {
        data,
        error
      } =
        await supabaseClient
          .rpc(
            "ig_get_shipping_quote",
            {

              p_order_number:
                Number(saved.order_number),

              p_phone:
                saved.phone,

              p_access_token:
                saved.access_token || null

            }
          );

      if(error){
        throw error;
      }

      const quote =
        Array.isArray(data)
          ? data[0]
          : data;

      if(!quote){

        result.innerHTML=`
          <div class="ig-shipping-status">

            🕐 Envío pendiente de cotización.

          </div>
        `;

        return;

      }

      if(
        quote.shipping_status !==
        "quoted"
      ){

        result.innerHTML=`
          <div class="ig-shipping-status">

            🕐 El administrador todavía
            no ha confirmado el costo del envío.

          </div>
        `;

        return;

      }

      const subtotal =
        Number(
          quote.subtotal || 0
        );

      const shipping =
        Number(
          quote.shipping_cost || 0
        );

      const total =
        subtotal + shipping;

      result.innerHTML=`

        <div class="ig-shipping-status success">

          ✅ <strong>Envío cotizado</strong>

        </div>

        <div class="ig-shipping-detail">

          Productos:
          <strong>${igMoney(subtotal)}</strong>

          <br>

          Envío:
          <strong>${igMoney(shipping)}</strong>

        </div>

        <div class="ig-shipping-final-total">

          TOTAL FINAL:
          ${igMoney(total)}

        </div>

        ${
          quote.admin_notes
            ? `
              <div class="ig-shipping-detail">
                📝 ${igEsc(quote.admin_notes)}
              </div>
            `
            : ""
        }

        <br>

        ${
          settings.mercadopago_url
            ? `
              <button
                type="button"
                class="button success full"
                onclick="window.open('${igEsc(settings.mercadopago_url)}','_blank')">

                💳 Pagar con Mercado Pago

              </button>

              <br><br>

              <small>
                Importe final informado:
                <strong>${igMoney(total)}</strong>
              </small>
            `
            : `
              <div class="ig-shipping-status">
                El administrador todavía no configuró
                el enlace de Mercado Pago.
              </div>
            `
        }

      `;

    }catch(error){

      console.error(
        "IG shipping quote:",
        error
      );

      result.innerHTML=`
        <div class="ig-shipping-status">
          No se pudo consultar la cotización.
          Intentá nuevamente.
        </div>
      `;

    }

  }

  /* =========================================================
     CONFIRMAR ENVÍO DESDE ADMIN
     ========================================================= */

  async function igConfirmShipping(
    orderId,
    quoteId
  ){

    const costInput =
      document.getElementById(
        "igShipCost_" + orderId
      );

    const noteInput =
      document.getElementById(
        "igShipNote_" + orderId
      );

    if(!costInput)return;

    const shippingCost =
      Number(
        costInput.value
      );

    if(
      !Number.isFinite(shippingCost) ||
      shippingCost < 0
    ){

      showToast(
        "Ingresá un costo de envío válido."
      );

      return;

    }

    try{

      const {
        data:order,
        error:orderError
      } =
        await supabaseClient
          .from("ig_orders")
          .select(
            "subtotal"
          )
          .eq(
            "id",
            orderId
          )
          .single();

      if(orderError){
        throw orderError;
      }

      const finalTotal =
        Number(order.subtotal || 0) +
        shippingCost;


      /* -----------------------------------------------------
         ACTUALIZAR COTIZACIÓN
         ----------------------------------------------------- */

      const {
        error:quoteError
      } =
        await supabaseClient
          .from("ig_shipping_quotes")
          .update({

            shipping_cost:
              shippingCost,

            status:
              "quoted",

            admin_notes:
              noteInput?.value.trim() ||
              null,

            updated_at:
              new Date().toISOString()

          })
          .eq(
            "id",
            quoteId
          )
          .eq(
            "order_id",
            orderId
          );

      if(quoteError){
        throw quoteError;
      }


      /* -----------------------------------------------------
         ACTUALIZAR TOTAL DEL PEDIDO
         ----------------------------------------------------- */

      const {
        error:updateOrderError
      } =
        await supabaseClient
          .from("ig_orders")
          .update({

            total:
              finalTotal,

            updated_at:
              new Date().toISOString()

          })
          .eq(
            "id",
            orderId
          );

      if(updateOrderError){
        throw updateOrderError;
      }


      showToast(
        "Cotización de envío confirmada."
      );

      await loadAdminOrders();

    }catch(error){

      console.error(
        "IG confirm shipping:",
        error
      );

      showToast(
        error.message ||
        "No se pudo guardar la cotización."
      );

    }

  }

  window.igConfirmShipping =
    igConfirmShipping;


  /* =========================================================
     DECORAR PEDIDOS DEL ADMIN
     ========================================================= */

  function igWrapAdminOrders(){

    if(
      typeof window.loadAdminOrders !==
      "function"
    ){

      return false;

    }

    if(
      window.loadAdminOrders
        .__igShippingWrapped
    ){

      return true;

    }

    const original =
      window.loadAdminOrders;

    async function wrapped(){

      await original();

      try{

        const quotes =
          await igGetShippingQuotes();

        if(!quotes.length){
          return;
        }

        const {
          data:orders,
          error
        } =
          await supabaseClient
            .from("ig_orders")
            .select(
              "id,order_number,subtotal"
            );

        if(error){
          throw error;
        }

        const container =
          document.getElementById(
            "adminOrdersList"
          );

        if(!container)return;

        const cards =
          Array.from(
            container.querySelectorAll(
              ".order-card"
            )
          );

        (orders || []).forEach(
          order=>{

            const quote =
              quotes.find(
                q=>q.order_id===order.id
              );

            if(!quote)return;

            const card =
              cards.find(
                card=>{

                  const strong =
                    card.querySelector(
                      ".order-head strong"
                    );

                  if(!strong)return false;

                  return strong.textContent
                    .includes(
                      "#" +
                      order.order_number
                    );

                }
              );

            if(!card)return;

            if(
              card.querySelector(
                "[data-ig-shipping='1']"
              )
            ){

              const old =
                card.querySelector(
                  "[data-ig-shipping='1']"
                );

              old.remove();

            }

            const wrapper =
              document.createElement(
                "div"
              );

            wrapper.innerHTML =
              igAdminShippingHtml(
                order,
                quote
              );

            card.appendChild(
              wrapper.firstElementChild
            );

          }
        );

      }catch(error){

        console.error(
          "IG admin shipping decoration:",
          error
        );

      }

    }

    wrapped.__igShippingWrapped=true;

    window.loadAdminOrders =
      wrapped;

    return true;

  }


  /* =========================================================
     INTERCEPTAR CHECKOUT
     ========================================================= */

  function igInstallCheckout(){

    const form =
      document.getElementById(
        "checkoutForm"
      );

    if(!form)return false;

    if(
      form.dataset.igShippingInstalled
    ){

      return true;

    }

    igInjectShippingForm();

    form.addEventListener(
      "submit",
      function(event){

        /*
          CAPTURE:
          este listener se ejecuta antes
          del listener original createOrder().
        */

        event.preventDefault();
        event.stopImmediatePropagation();

        igCreateOrderWithShipping();

      },
      true
    );

    form.dataset.igShippingInstalled =
      "1";

    return true;

  }


  /* =========================================================
     ARRANQUE SEGURO
     ========================================================= */

  function igBoot(){

    igInstallCheckout();
    igWrapAdminOrders();

  }

  igBoot();

  setTimeout(
    igBoot,
    300
  );

  setTimeout(
    igBoot,
    1000
  );

  setTimeout(
    igBoot,
    2000
  );

  const observer =
    new MutationObserver(
      function(){

        igBoot();

      }
    );

  if(document.body){

    observer.observe(
      document.body,
      {
        childList:true,
        subtree:true
      }
    );

  }

  window.InternationalGatewayShipping = {

    version:"1.0",

    refresh:
      igCheckClientQuote,

    install:
      igBoot

  };

})();
</script>

<script>
(function () {
    "use strict";

    const VISITOR_KEY = "ig_visitor_id";
    const SESSION_KEY = "ig_visit_registered";

    // No contar varias veces durante la misma sesión
    if (sessionStorage.getItem(SESSION_KEY)) {
        return;
    }

    // Obtener o crear identificador anónimo del visitante
    let visitorId = localStorage.getItem(VISITOR_KEY);

    if (!visitorId) {
        visitorId =
            "ig_" +
            Date.now().toString(36) +
            "_" +
            Math.random().toString(36).substring(2, 15);

        localStorage.setItem(VISITOR_KEY, visitorId);
    }

    // Detectar dispositivo
    const userAgent = navigator.userAgent.toLowerCase();

    let device = "desktop";

    if (
        /ipad|tablet|playbook|silk/.test(userAgent)
    ) {
        device = "tablet";
    } else if (
        /mobile|android|iphone|ipod/.test(userAgent)
    ) {
        device = "mobile";
    }

    // Página actual
    const page =
        window.location.pathname ||
        "/";

    // Buscar el cliente Supabase existente
    function registrarVisita() {

        // Compatible con las formas habituales de inicializar Supabase
        let cliente = null;

        if (
            typeof window.supabaseClient !== "undefined" &&
            window.supabaseClient
        ) {
            cliente = window.supabaseClient;
        }

        if (
            !cliente &&
            typeof window.supabase !== "undefined" &&
            window.supabase &&
            typeof window.supabase.rpc === "function"
        ) {
            cliente = window.supabase;
        }

        if (!cliente) {
            console.warn(
                "International Gateway: no se encontró el cliente Supabase."
            );
            return;
        }

        cliente
            .rpc(
                "registrar_visita_international_gateway",
                {
                    p_visitor_id: visitorId,
                    p_page: page,
                    p_device: device
                }
            )
            .then(function (resultado) {

                if (resultado.error) {
                    console.warn(
                        "Contador de visitas:",
                        resultado.error.message
                    );
                    return;
                }

                // Marcar la sesión como registrada
                sessionStorage.setItem(
                    SESSION_KEY,
                    "1"
                );

                // Guardar estadísticas disponibles
                if (resultado.data) {
                    window.internationalGatewayStats =
                        resultado.data;

                    console.log(
                        "International Gateway — visita registrada",
                        resultado.data
                    );
                }
            })
            .catch(function (error) {
                console.warn(
                    "International Gateway — error del contador:",
                    error
                );
            });
    }

    // Esperar a que cargue la aplicación
    if (
        document.readyState === "loading"
    ) {
        document.addEventListener(
            "DOMContentLoaded",
            registrarVisita
        );
    } else {
        registrarVisita();
    }

})();
</script>
<!-- ============================================================
     INTERNATIONAL GATEWAY
     VISOR DE ENTRADAS / CONTADOR DE VISITAS
     
     MÓDULO AISLADO
     - No modifica productos
     - No modifica carrito

  function showError(message){

  function hideError(){

    const error =
      document.getElementById(

      );

    if(error){
      error.style.display = "none";
      error.textContent = "";

  }


  async function loadStatistics(){

    if(loading){
      return;
    }

    loading = true;

    const status =
      document.getElementById(
        "igVisitsStatus"
      );

    const refresh =
      document.getElementById(
        "igVisitsRefreshButton"
      );

    hideError();

    if(status){
      status.textContent =

    }

    if(refresh){
      refresh.disabled = true;
      refresh.textContent = "Cargando...";
    }

    try{

      const client = getSupabase();

      if(!client){

        throw new Error(
          "No se encontró la conexión con Supabase."
        );

      }

      /*

      */

      const sessionResult =
        await client.auth.getSession();

      const session =
        sessionResult?.data?.session;

      if(!session){

        throw new Error(
          "Inicia sesión como administrador para ver las estadísticas."
        );

      }


      /*
        CONSULTA ÚNICAMENTE.
        No registra ni incrementa visitas.
      */

      const result =
        await client.rpc(
          "obtener_estadisticas_visitas_international_gateway"
        );

      if(result.error){

        throw result.error;

      }

      const data =
        result.data || {};


      setValue(
        "igVisitsTotal",
        data.total
      );

      setValue(
        "igVisitsToday",
        data.today
      );

      setValue(
        "igVisitsWeek",
        data.last_7_days
      );

      setValue(

        data.this_month
      );

      setValue(
        "igVisitsUnique",
        data.unique_visitors
      );


      if(status){

        const now =
          new Date();

        status.textContent =
          "Última actualización: " +
          now.toLocaleString(
            "es-AR",

              dateStyle:"short",

      console.error(

      showError(

      );

      if(status){
        status.textContent =
          "No se pudieron actualizar las estadísticas.";
      }

    }finally{

      loading = false;

      if(refresh){

        refresh.disabled = false;
        refresh.textContent =
          "↻ Actualizar";

      }

    }

  }


  function isAdminPanelVisible(){

    const panel =
      document.getElementById(
        "adminPanel"
      );

    const style =
      window.getComputedStyle(panel);

    return (
      style.display !== "none" &&
      !panel.classList.contains("hidden")
    );

  }


  function boot(){

      setTimeout(

      );

      return;

    }

    const viewer =
      createViewer();

    if(!viewer){

      setTimeout(
        boot,
        800
      );

      return;

    }

    initialized = true;

    loadStatistics();

  }


  /*

    Solo comprobamos periódicamente hasta encontrar
    el panel de administración y luego terminamos.
  */

  if(

    boot();

    API opcional para actualizar manualmente

  */

  window.InternationalGatewayVisits = {

    version: VERSION,

    refresh: loadStatistics,

    show: function(){

      const viewer =
        document.getElementById(
          "igVisitsViewer"
        );

      if(viewer){
        viewer.style.display = "";
      }

    },

    hide: function(){

      const viewer =
        document.getElementById(
          "igVisitsViewer"
        );

      if(viewer){
        viewer.style.display = "none";
      }

    }

  };

})();

<script>
(function () {
  "use strict";

  const VISITOR_KEY = "ig_visitor_id_repair";

  function obtenerVisitante() {
    let id = localStorage.getItem(VISITOR_KEY);

    if (!id) {
      if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
      ) {
        id = "ig_" + window.crypto.randomUUID();
      } else {
        id =
          "ig_" +
          Date.now().toString(36) +
          "_" +
          Math.random().toString(36).slice(2) +
          "_" +
          Math.random().toString(36).slice(2);
      }

      localStorage.setItem(VISITOR_KEY, id);
    }

    return id;
  }

  function detectarDispositivo() {
    const ua = navigator.userAgent || "";

    if (/tablet|ipad/i.test(ua)) {
      return "tablet";
    }

    if (/mobile|android|iphone|ipod/i.test(ua)) {
      return "mobile";
    }

    return "desktop";
  }

  async function registrar() {
    try {
      /*
       * IMPORTANTE:
       * Utilizamos exactamente el cliente Supabase
       * que ya utiliza International Gateway.
       */
      if (
        typeof supabaseClient === "undefined" ||
        !supabaseClient ||
        typeof supabaseClient.rpc !== "function"
      ) {
        console.warn(
          "International Gateway: supabaseClient no disponible."
        );
        return;
      }

      const visitorId = obtenerVisitante();

      const resultado = await supabaseClient.rpc(
        "registrar_visita_international_gateway",
        {
          p_visitor_id: visitorId,
          p_page: window.location.pathname || "/",
          p_device: detectarDispositivo()
        }
      );

      if (resultado.error) {
        console.error(
          "International Gateway: error registrando visita:",
          resultado.error
        );
        return;
      }

      console.log(
        "International Gateway: visita registrada correctamente.",
        resultado.data
      );

    } catch (error) {
      console.error(
        "International Gateway: error inesperado en visitas:",
        error
      );
    }
  }

  /*
   * Esperamos a que el documento esté listo.
   * El cliente Supabase ya debe existir porque este bloque
   * se coloca antes de </body>.
   */
  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      registrar,
      { once: true }
    );
  } else {
    registrar();
  }

})();
</script>

<script>
(function(){

  "use strict";

  /*
   * Evita que el código pueda instalarse dos veces.
   */
  if(window.__IG_PRODUCT_SEARCH_LOADED){
    return;
  }

  window.__IG_PRODUCT_SEARCH_LOADED = true;


  function iniciarBuscador(){

    const productsContainer =
      document.getElementById("productsContainer");

    if(!productsContainer){
      console.warn(
        "[IG Buscador] productsContainer no encontrado."
      );
      return;
    }


    /*
     * Si ya existe, no lo volvemos a crear.
     */
    if(document.getElementById("igProductSearchBox")){
      return;
    }


    /*
     * Creamos solamente la interfaz del buscador.
     * NO tocamos productsContainer.
     */
    const searchBox =
      document.createElement("div");

    searchBox.id =
      "igProductSearchBox";

    searchBox.innerHTML = `
      <input
        id="igProductSearchInput"
        type="search"
        placeholder="🔎 Buscar productos..."
        autocomplete="off"
        aria-label="Buscar productos">

      <div
        id="igProductSearchStatus"
        aria-live="polite">
      </div>
    `;


    /*
     * Lo colocamos antes de la lista de productos.
     */
    productsContainer.parentNode.insertBefore(
      searchBox,
      productsContainer
    );


    const input =
      document.getElementById(
        "igProductSearchInput"
      );

    const status =
      document.getElementById(
        "igProductSearchStatus"
      );


    function normalizar(texto){

      return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();

    }


    function buscar(){

      try{

        const termino =
          normalizar(input.value);


        /*
         * Obtenemos solamente las tarjetas
         * actualmente existentes.
         *
         * querySelectorAll devuelve una lista
         * estática, por lo que no interferimos
         * con el renderizado de la aplicación.
         */
        const cards =
          productsContainer.querySelectorAll(
            ".product-card"
          );


        /*
         * Si todavía no hay productos,
         * simplemente no hacemos nada.
         */
        if(!cards.length){

          status.textContent =
            termino
              ? "Buscando..."
              : "";

          return;

        }


        /*
         * Categoría actualmente seleccionada.
         *
         * Si el sistema de categorías está disponible,
         * respetamos su selección.
         */
        let categoriaActual =
          "all";

        try{

          if(
            window.InternationalGatewayCategories &&
            typeof
              window.InternationalGatewayCategories.current ===
              "function"
          ){

            categoriaActual =
              window
                .InternationalGatewayCategories
                .current() || "all";

          }

        }catch(error){

          categoriaActual = "all";

        }


        let visibles = 0;


        cards.forEach(function(card){

          const categoriaElement =
            card.querySelector(
              ".product-category"
            );


          const categoriaProducto =
            normalizar(
              categoriaElement
                ? categoriaElement.textContent
                : ""
            );


          /*
           * Primero respetamos la categoría
           * seleccionada.
           */
          const coincideCategoria =
            categoriaActual === "all" ||
            categoriaProducto ===
              normalizar(categoriaActual);


          /*
           * Después comprobamos el texto.
           *
           * Busca en:
           * - nombre
           * - categoría
           * - descripción
           * - características
           */
          const textoProducto =
            normalizar(
              card.textContent
            );


          const coincideBusqueda =
            !termino ||
            textoProducto.includes(termino);


          const mostrar =
            coincideCategoria &&
            coincideBusqueda;


          card.style.display =
            mostrar ? "" : "none";


          if(mostrar){
            visibles++;
          }

        });


        /*
         * Mensaje pequeño debajo del buscador.
         * No modificamos el contenedor de productos.
         */
        if(!termino){

          status.textContent = "";

        }else if(visibles === 0){

          status.textContent =
            "No encontramos productos con esa búsqueda.";

        }else if(visibles === 1){

          status.textContent =
            "1 producto encontrado.";

        }else{

          status.textContent =
            visibles +
            " productos encontrados.";

        }

      }catch(error){

        /*
         * MUY IMPORTANTE:
         * Un error del buscador nunca debe
         * detener la tienda.
         */
        console.error(
          "[IG Buscador] Error:",
          error
        );

      }

    }


    /*
     * Evento de escritura.
     */
    input.addEventListener(
      "input",
      buscar
    );


    /*
     * Permite borrar rápidamente con
     * Escape.
     */
    input.addEventListener(
      "keydown",
      function(event){

        if(event.key === "Escape"){

          input.value = "";

          buscar();

          input.blur();

        }

      }
    );


    /*
     * Cuando se pulsa una categoría,
     * actualizamos el buscador sin crear
     * ningún MutationObserver.
     */
    document.addEventListener(
      "click",
      function(event){

        const button =
          event.target.closest(
            ".ig-public-category-button"
          );

        if(!button){
          return;
        }

        /*
         * Esperamos a que el sistema de
         * categorías termine su propio trabajo.
         */
        setTimeout(
          buscar,
          0
        );

      }
    );


    /*
     * Primera comprobación.
     */
    buscar();


    console.log(
      "[IG Buscador] Buscador instalado correctamente."
    );

  }


  /*
   * Como este bloque está al final del body,
   * normalmente el DOM ya está disponible.
   *
   * Esta comprobación también permite que
   * funcione si el navegador ejecuta el script
   * antes de terminar de construir el documento.
   */
  if(document.readyState === "loading"){

    document.addEventListener(
      "DOMContentLoaded",
      iniciarBuscador,
      {once:true}
    );

  }else{

    iniciarBuscador();

  }

})();
</script>

<script>
(function(){

  "use strict";


  /*
   * Evita instalar el sistema dos veces.
   */
  if(window.__IG_FAVORITES_LOADED){
    return;
  }

  window.__IG_FAVORITES_LOADED = true;


  const STORAGE_KEY =
    "ig_favorite_products_v2";


  let favorites = [];


  /*
   * -------------------------------------------------------
   * ALMACENAMIENTO
   * -------------------------------------------------------
   */

  function cargarFavoritos(){

    try{

      const guardados =
        localStorage.getItem(
          STORAGE_KEY
        );

      if(!guardados){

        favorites = [];

        return;
      }


      const parsed =
        JSON.parse(guardados);


      if(Array.isArray(parsed)){

        favorites =
          parsed
            .map(String)
            .filter(Boolean);

      }else{

        favorites = [];

      }

    }catch(error){

      console.warn(
        "[IG Favoritos] No se pudieron cargar los favoritos.",
        error
      );

      favorites = [];

    }

  }


  function guardarFavoritos(){

    try{

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(favorites)
      );

    }catch(error){

      console.warn(
        "[IG Favoritos] No se pudieron guardar los favoritos.",
        error
      );

    }

  }


  function esFavorito(id){

    return favorites.includes(
      String(id)
    );

  }


  function actualizarContador(){

    const count =
      document.getElementById(
        "igFavoritesCount"
      );

    if(!count){
      return;
    }

    count.textContent =
      favorites.length;

  }


  /*
   * -------------------------------------------------------
   * BOTONES DE PRODUCTOS
   * -------------------------------------------------------
   */

  function actualizarBoton(button){

    const id =
      String(
        button.dataset.productId || ""
      );

    const activo =
      esFavorito(id);


    button.classList.toggle(
      "active",
      activo
    );


    button.innerHTML =
      activo
        ? "♥"
        : "♡";


    button.setAttribute(
      "aria-pressed",
      activo
        ? "true"
        : "false"
    );


    button.setAttribute(
      "aria-label",
      activo
        ? "Quitar de favoritos"
        : "Agregar a favoritos"
    );


    button.title =
      activo
        ? "Quitar de favoritos"
        : "Agregar a favoritos";

  }


  function actualizarTodosLosBotones(){

    document
      .querySelectorAll(
        ".ig-favorite-button"
      )
      .forEach(
        actualizarBoton
      );

  }


  function alternarFavorito(id){

    id =
      String(id);


    if(!id){
      return;
    }


    if(esFavorito(id)){

      favorites =
        favorites.filter(
          function(item){
            return item !== id;
          }
        );

    }else{

      favorites.push(id);

    }


    guardarFavoritos();

    actualizarTodosLosBotones();

    actualizarContador();

    renderFavoritesPanel();

  }


  /*
   * -------------------------------------------------------
   * AÑADIR BOTÓN A CADA TARJETA
   * -------------------------------------------------------
   */

  function decorarProductos(){

    const container =
      document.getElementById(
        "productsContainer"
      );


    if(!container){
      return;
    }


    const cards =
      container.querySelectorAll(
        ".product-card"
      );


    cards.forEach(
      function(card){

        /*
         * Ya decorada.
         */
        if(
          card.querySelector(
            ".ig-favorite-button"
          )
        ){

          actualizarBoton(
            card.querySelector(
              ".ig-favorite-button"
            )
          );

          return;
        }


        /*
         * Obtenemos el ID real del producto
         * desde el botón del carrito.
         */
        const cartButton =
          card.querySelector(
            "[onclick*=\"addToCart\"]"
          );


        if(!cartButton){
          return;
        }


        const match =
          cartButton
            .getAttribute("onclick")
            ?.match(
              /addToCart\(['"]([^'"]+)['"]\)/
            );


        if(!match || !match[1]){
          return;
        }


        const productId =
          String(match[1]);


        const favoriteButton =
          document.createElement(
            "button"
          );


        favoriteButton.type =
          "button";


        favoriteButton.className =
          "ig-favorite-button";


        favoriteButton.dataset.productId =
          productId;


        favoriteButton.addEventListener(
          "click",
          function(event){

            /*
             * Evita que el toque pueda
             * activar accidentalmente
             * otro elemento de la tarjeta.
             */
            event.preventDefault();

            event.stopPropagation();


            alternarFavorito(
              productId
            );

          }
        );


      const image =
  card.querySelector(
    ".product-image"
  );

if(image){

  image.style.position =
    "relative";

  image.appendChild(
    favoriteButton
  );

}else{

  card.appendChild(
    favoriteButton
  );

}


        actualizarBoton(
          favoriteButton
        );

      }
    );

  }


  /*
   * -------------------------------------------------------
   * PANEL DE FAVORITOS
   * -------------------------------------------------------
   */

  function crearPanel(){

    if(
      document.getElementById(
        "igFavoritesPanel"
      )
    ){
      return;
    }


    const panel =
      document.createElement(
        "div"
      );


    panel.id =
      "igFavoritesPanel";


    panel.innerHTML = `

      <div
        id="igFavoritesBox"
        role="dialog"
        aria-modal="true"
        aria-labelledby="igFavoritesTitle">

        <div id="igFavoritesHeader">

          <h2 id="igFavoritesTitle">
            ❤️ Mis favoritos
          </h2>

          <button
            id="igFavoritesClose"
            type="button"
            aria-label="Cerrar favoritos">
            ×
          </button>

        </div>

        <div id="igFavoritesList"></div>

      </div>

    `;


    document.body.appendChild(
      panel
    );


    document
      .getElementById(
        "igFavoritesClose"
      )
      .addEventListener(
        "click",
        cerrarPanel
      );


    /*
     * Cerrar tocando fuera del cuadro.
     */
    panel.addEventListener(
      "click",
      function(event){

        if(
          event.target === panel
        ){

          cerrarPanel();

        }

      }
    );


    /*
     * Escape.
     */
    document.addEventListener(
      "keydown",
      function(event){

        if(
          event.key === "Escape" &&
          panel.classList.contains("open")
        ){

          cerrarPanel();

        }

      }
    );

  }


  function abrirPanel(){

    crearPanel();

    renderFavoritesPanel();


    const panel =
      document.getElementById(
        "igFavoritesPanel"
      );


    if(panel){

      panel.classList.add(
        "open"
      );

      document.body.style.overflow =
        "hidden";

    }

  }


  function cerrarPanel(){

    const panel =
      document.getElementById(
        "igFavoritesPanel"
      );


    if(panel){

      panel.classList.remove(
        "open"
      );

    }


    document.body.style.overflow =
      "";

  }


  /*
   * -------------------------------------------------------
   * CONSTRUIR LISTA DE FAVORITOS
   * -------------------------------------------------------
   */

  function renderFavoritesPanel(){

    const list =
      document.getElementById(
        "igFavoritesList"
      );


    if(!list){
      return;
    }


    /*
     * Buscamos los productos actuales
     * en las tarjetas ya renderizadas.
     *
     * No modificamos productsContainer.
     */
    const cards =
      Array.from(
        document.querySelectorAll(
          "#productsContainer .product-card"
        )
      );


    const items =
      [];


    favorites.forEach(
      function(id){

        const card =
          cards.find(
            function(item){

              const cartButton =
                item.querySelector(
                  "[onclick*=\"addToCart\"]"
                );


              if(!cartButton){
                return false;
              }


              const match =
                cartButton
                  .getAttribute("onclick")
                  ?.match(
                    /addToCart\(['"]([^'"]+)['"]\)/
                  );


              return(
                match &&
                String(match[1]) ===
                  String(id)
              );

            }
          );


        if(card){

          items.push({
            id:id,
            card:card
          });

        }

      }
    );


    if(!items.length){

      list.innerHTML = `

        <div class="ig-favorites-empty">

          <div style="font-size:40px;margin-bottom:10px">
            ♡
          </div>

          <strong>
            Todavía no tienes favoritos.
          </strong>

          <div style="margin-top:6px">
            Toca el corazón de un producto
            para guardarlo aquí.
          </div>

        </div>

      `;

      return;

    }


    list.innerHTML =
      "";


    items.forEach(
      function(item){

        const card =
          item.card;


        const titleElement =
          card.querySelector(
            "h3"
          );


        const priceElement =
          card.querySelector(
            ".price"
          );


        const image =
          card.querySelector(
            ".product-image img"
          );


        const title =
          titleElement
            ? titleElement.textContent.trim()
            : "Producto";


        const price =
          priceElement
            ? priceElement.textContent.trim()
            : "";


        const row =
          document.createElement(
            "div"
          );


        row.className =
          "ig-favorite-item";


        const imageBox =
          document.createElement(
            "div"
          );


        imageBox.className =
          "ig-favorite-item-image";


        if(image){

          const img =
            document.createElement(
              "img"
            );


          img.src =
            image.src;


          img.alt =
            title;


          imageBox.appendChild(
            img
          );

        }else{

          imageBox.textContent =
            "🛍️";

        }


        const info =
          document.createElement(
            "div"
          );


        info.className =
          "ig-favorite-item-info";


        info.innerHTML =
          "<strong></strong>" +
          "<div class=\"ig-favorite-item-price\"></div>";


        info
          .querySelector("strong")
          .textContent =
            title;


        info
          .querySelector(
            ".ig-favorite-item-price"
          )
          .textContent =
            price;


        const remove =
          document.createElement(
            "button"
          );


        remove.type =
          "button";


        remove.className =
          "ig-favorite-remove";


        remove.textContent =
          "♥";


        remove.title =
          "Quitar de favoritos";


        remove.setAttribute(
          "aria-label",
          "Quitar " + title + " de favoritos"
        );


        remove.addEventListener(
          "click",
          function(){

            alternarFavorito(
              item.id
            );

          }
        );


        row.appendChild(
          imageBox
        );


        row.appendChild(
          info
        );


        row.appendChild(
          remove
        );


        list.appendChild(
          row
        );

      }
    );

  }


  /*
   * -------------------------------------------------------
   * BOTÓN FLOTANTE
   * -------------------------------------------------------
   */

  function crearLauncher(){

    if(
      document.getElementById(
        "igFavoritesLauncher"
      )
    ){
      return;
    }


    const button =
      document.createElement(
        "button"
      );


    button.id =
      "igFavoritesLauncher";


    button.type =
      "button";


    button.innerHTML =
      "❤️ <span>Favoritos</span> " +
      "<span id=\"igFavoritesCount\">0</span>";


    button.setAttribute(
      "aria-label",
      "Abrir favoritos"
    );


    button.addEventListener(
      "click",
      abrirPanel
    );


    document.body.appendChild(
      button
    );


    actualizarContador();

  }


  /*
   * -------------------------------------------------------
   * INICIALIZACIÓN
   * -------------------------------------------------------
   */

  function iniciar(){

    cargarFavoritos();

    crearLauncher();

    crearPanel();

    decorarProductos();

    actualizarTodosLosBotones();

    actualizarContador();


    /*
     * Esperamos a que el renderizado inicial
     * de productos haya terminado.
     */
    setTimeout(
      decorarProductos,
      300
    );


    setTimeout(
      decorarProductos,
      1000
    );


    console.log(
      "[IG Favoritos] Sistema instalado correctamente."
    );

  }


  if(
    document.readyState ===
    "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      iniciar,
      {once:true}
    );

  }else{

    iniciar();

  }


})();
</script>

        error
      );

      favorites = [];

    }

  }


  function saveFavorites(){

    try{

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(favorites)
      );

    }catch(error){

      console.warn(
        "[IG Favoritos] Error guardando favoritos:",
        error
      );

    }

  }


  function isFavorite(id){

    return favorites.indexOf(
      String(id)
    ) !== -1;

  }


  function getProductId(card){

  if(!card){
    return null;
  }


  /*
   * PRODUCTOS ESPECIALES
   *
   * Granja lo de Nico e Iberian Mediterránea
   * guardan el ID directamente en la tarjeta.
   */
  if(
    card.dataset &&
    card.dataset.igSpecialProductId
  ){

    return String(
      card.dataset.igSpecialProductId
    );

  }


  /*
   * PRODUCTOS ESPECIALES
   *
   * Segundo método: botón específico.
   */
  const specialButton =
    card.querySelector(
      "[data-ig-special-add]"
    );


  if(
    specialButton &&
    specialButton.dataset &&
    specialButton.dataset.igSpecialAdd
  ){

    return String(
      specialButton.dataset.igSpecialAdd
    );

  }


  /*
   * PRODUCTOS NORMALES
   *
   * Extraemos el ID del onclick original.
   */
  const cartButton =
    card.querySelector(
      "button[onclick*='addToCart']"
    );


  if(cartButton){

    const onclick =
      cartButton.getAttribute(
        "onclick"
      ) || "";


    const match =
      onclick.match(
        /addToCart\s*\(\s*['"]([^'"]+)['"]\s*\)/
      );


    if(match && match[1]){

      return String(
        match[1]
      );

    }

  }


  return null;

}


  /* =======================================================
     ACTUALIZAR CORAZONES
     ======================================================= */

  function updateHeart(button){

    const id =
      button.dataset.productId;


    if(!id){
      return;
    }


    const active =
      isFavorite(id);


    button.classList.toggle(
      "active",
      active
    );


    button.textContent =
      active
        ? "♥"
        : "♡";


    button.setAttribute(
      "aria-pressed",
      active
        ? "true"
        : "false"
    );


    button.setAttribute(
      "aria-label",
      active
        ? "Quitar de favoritos"
        : "Agregar a favoritos"
    );

  }


  function updateAllHearts(){

    document
      .querySelectorAll(
        ".ig-favorite-button"
      )
      .forEach(
        updateHeart
      );

  }


  /* =======================================================
     AGREGAR CORAZÓN A LAS TARJETAS
     ======================================================= */

  function installHearts(){

    const container =
      document.getElementById(
        "productsContainer"
      );


    if(!container){
      return;
    }


    const cards =
      container.querySelectorAll(
        ".product-card"
      );


    cards.forEach(
      function(card){

        /*
         * Si ya tiene corazón,
         * simplemente actualizamos su estado.
         */
        let heart =
          card.querySelector(
            ".ig-favorite-button"
          );


        if(heart){

          updateHeart(heart);

          return;

        }


        /*
         * Obtener ID real.
         */
        const productId =
          getProductId(card);


        /*
         * Si todavía no existe el botón
         * de carrito, esperamos al siguiente
         * ciclo de renderizado.
         */
        if(!productId){

          return;

        }


        heart =
          document.createElement(
            "button"
          );


        heart.type =
          "button";


        heart.className =
          "ig-favorite-button";


        heart.dataset.productId =
          productId;


        heart.innerHTML =
          "♡";


        heart.title =
          "Agregar a favoritos";


        heart.addEventListener(
          "click",
          function(event){

            event.preventDefault();

            event.stopPropagation();


            const id =
              String(
                this.dataset.productId
              );


            if(isFavorite(id)){

              favorites =
                favorites.filter(
                  function(item){

                    return item !== id;

                  }
                );

            }else{

              favorites.push(id);

            }


            saveFavorites();

            updateAllHearts();

            updateCounter();

            renderFavorites();

          }
        );


        /*
         * AHORA sí se inserta directamente
         * dentro de la tarjeta del producto.
         */
        
const photo =
  card.querySelector(
    ".product-image"
  );

if(photo){

  photo.style.position =
    "relative";

  photo.appendChild(
    heart
  );

}else{

  card.appendChild(
    heart
  );

}

        updateHeart(
          heart
        );

      }
    );

  }


  /* =======================================================
     CONTADOR
     ======================================================= */

  function updateCounter(){

    const counter =
      document.getElementById(
        "igFavoritesCount"
      );


    if(counter){

      counter.textContent =
        favorites.length;

    }

  }


  /* =======================================================
     PANEL
     ======================================================= */

  function createPanel(){

    if(
      document.getElementById(
        "igFavoritesPanel"
      )
    ){

      return;

    }


    const panel =
      document.createElement(
        "div"
      );


    panel.id =
      "igFavoritesPanel";


    panel.innerHTML = `

      <div id="igFavoritesBox">

        <div id="igFavoritesHeader">

          <h2>
            ❤️ Mis favoritos
          </h2>

          <button
            id="igFavoritesClose"
            type="button"
            aria-label="Cerrar favoritos">
            ×
          </button>

        </div>

        <div id="igFavoritesList"></div>

      </div>

    `;


    document.body.appendChild(
      panel
    );


    document
      .getElementById(
        "igFavoritesClose"
      )
      .addEventListener(
        "click",
        closePanel
      );


    panel.addEventListener(
      "click",
      function(event){

        if(
          event.target === panel
        ){

          closePanel();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event){

        if(
          event.key === "Escape" &&
          panel.classList.contains("open")
        ){

          closePanel();

        }

      }
    );

  }


  function openPanel(){

    createPanel();

    renderFavorites();


    const panel =
      document.getElementById(
        "igFavoritesPanel"
      );


    if(panel){

      panel.classList.add(
        "open"
      );

      document.body.style.overflow =
        "hidden";

    }

  }


  function closePanel(){

    const panel =
      document.getElementById(
        "igFavoritesPanel"
      );


    if(panel){

      panel.classList.remove(
        "open"
      );

    }


    document.body.style.overflow =
      "";

  }


  /* =======================================================
     OBTENER INFORMACIÓN DE PRODUCTOS
     ======================================================= */

  function getCardData(card){

    const id =
      getProductId(card);


    if(!id){
      return null;
    }


    const titleElement =
      card.querySelector(
        "h3"
      );


    const priceElement =
      card.querySelector(
        ".price"
      );


    const imageElement =
      card.querySelector(
        ".product-image img"
      );


    return {

      id:String(id),

      name:
        titleElement
          ? titleElement.textContent.trim()
          : "Producto",

      price:
        priceElement
          ? priceElement.textContent.trim()
          : "",

      image:
        imageElement
          ? imageElement.src
          : ""

    };

  }


  function renderFavorites(){

  const list =
    document.getElementById(
      "igFavoritesList"
    );

  if(!list){
    return;
  }

  /*
   * =====================================================
   * FAVORITOS — RECONSTRUCCIÓN DIRECTA DESDE PRODUCTS
   * =====================================================
   *
   * No dependemos de las tarjetas HTML visibles.
   * Los IDs guardados en localStorage se cruzan
   * directamente con el array global products.
   */

  const favoriteProducts = [];

  if(
    Array.isArray(products) &&
    Array.isArray(favorites)
  ){

    favorites.forEach(
      function(favoriteId){

        const id =
          String(favoriteId);

        const product =
          products.find(
            function(item){

              return (
                item &&
                String(item.id) === id
              );

            }
          );

        if(product){

          const image =
            (
              product.ig_product_images ||
              []
            )[0];

          favoriteProducts.push({

            id:id,

            name:
              product.name ||
              "Producto",

            price:
              typeof money === "function"
                ? money(product.price)
                : String(
                    product.price ?? ""
                  ),

            image:
              image &&
              image.public_url
                ? image.public_url
                : ""

          });

        }

      }
    );

  }

  /*
   * =====================================================
   * SIN FAVORITOS
   * =====================================================
   */

  if(!favoriteProducts.length){

    list.innerHTML = `

      <div class="ig-favorites-empty">

        <div
          style="
            font-size:42px;
            margin-bottom:10px
          ">
          ♡
        </div>

        <strong>
          Todavía no tienes favoritos.
        </strong>

        <div style="margin-top:6px">
          Toca el corazón de un producto
          para guardarlo aquí.
        </div>

      </div>

    `;

    return;

  }

  /*
   * =====================================================
   * MOSTRAR FAVORITOS
   * =====================================================
   */

  list.innerHTML = "";

  favoriteProducts.forEach(
    function(product){

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "ig-favorite-item";


      /*
       * IMAGEN
       */

      const imageBox =
        document.createElement(
          "div"
        );

      imageBox.className =
        "ig-favorite-item-image";


      if(product.image){

        const img =
          document.createElement(
            "img"
          );

        img.src =
          product.image;

        img.alt =
          product.name;

        imageBox.appendChild(
          img
        );

      }else{

        imageBox.textContent =
          "🛍️";

      }


      /*
       * INFORMACIÓN
       */

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "ig-favorite-item-info";


      const name =
        document.createElement(
          "strong"
        );

      name.textContent =
        product.name;


      const price =
        document.createElement(
          "div"
        );

      price.className =
        "ig-favorite-item-price";

      price.textContent =
        product.price;


      info.appendChild(
        name
      );

      info.appendChild(
        price
      );


      /*
       * BOTÓN ELIMINAR
       */

      const remove =
        document.createElement(
          "button"
        );

      remove.type =
        "button";

      remove.className =
        "ig-favorite-remove";

      remove.textContent =
        "♥";

      remove.title =
        "Quitar de favoritos";

      remove.setAttribute(
        "aria-label",
        "Quitar " +
        product.name +
        " de favoritos"
      );


      remove.addEventListener(
        "click",
        function(){

          favorites =
            favorites.filter(
              function(id){

                return String(id) !==
                  String(product.id);

              }
            );

          saveFavorites();

          updateAllHearts();

          updateCounter();

          renderFavorites();

        }
      );


      /*
       * MONTAR ELEMENTO
       */

      item.appendChild(
        imageBox
      );

      item.appendChild(
        info
      );

      item.appendChild(
        remove
      );

      list.appendChild(
        item
      );

    }
  );

}


  /* =======================================================
     BOTÓN FLOTANTE
     ======================================================= */

  function createLauncher(){

    if(
      document.getElementById(
        "igFavoritesLauncher"
      )
    ){

      return;

    }


    const button =
      document.createElement(
        "button"
      );


    button.id =
      "igFavoritesLauncher";


    button.type =
      "button";


    button.innerHTML =
      "❤️ Favoritos " +
      "<span id=\"igFavoritesCount\">0</span>";


    button.addEventListener(
      "click",
      openPanel
    );


    document.body.appendChild(
      button
    );


    updateCounter();

  }


  /* =======================================================
     INICIO
     ======================================================= */

    
function start(){

  loadFavorites();

  createLauncher();

  createPanel();

    /*
   * Instalar inmediatamente si las tarjetas
   * ya existen.
   */
  installHearts();

  /*
   * REPARACIÓN QUIRÚRGICA DE FAVORITOS
   *
   * Observamos únicamente productsContainer.
   * No observamos toda la página.
   * No observamos atributos.
   * No modificamos Supabase.
   */
  const productsContainer =
    document.getElementById(
      "productsContainer"
    );

  if(
    productsContainer &&
    !productsContainer.__IG_FAVORITES_OBSERVER
  ){

    const observer =
      new MutationObserver(
        function(mutations){

          let productCardsChanged =
            false;

          for(
            const mutation of mutations
          ){

            if(
              mutation.type ===
              "childList" &&
              mutation.addedNodes &&
              mutation.addedNodes.length
            ){

              productCardsChanged =
                true;

              break;
            }
          }

          if(productCardsChanged){

            installHearts();
          }

        }
      );

    observer.observe(
      productsContainer,
      {
        childList:true
      }
    );

    productsContainer.__IG_FAVORITES_OBSERVER =
      observer;
  }

  updateCounter();

}

  if(
    document.readyState ===
    "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      start,
      {once:true}
    );

  }else{

    start();

  }


})();
</script>

<script>

(function(){

  "use strict";


  /*
   * Evita cargar este bloque dos veces.
   */
  if(window.__IG_CART_CONFIRMATION_LOADED){

    return;

  }

  window.__IG_CART_CONFIRMATION_LOADED = true;


  let toastTimer = null;


  /* =======================================================
     CREAR AVISO
     ======================================================= */

  function createToast(){

    if(
      document.getElementById(
        "igCartToast"
      )
    ){

      return;

    }


    const toast =
      document.createElement(
        "div"
      );


    toast.id =
      "igCartToast";


    toast.setAttribute(
      "role",
      "status"
    );


    toast.setAttribute(
      "aria-live",
      "polite"
    );


    toast.innerHTML = `

      <div id="igCartToastIcon">
        ✓
      </div>

      <div id="igCartToastText">

        <div id="igCartToastTitle">
          Producto agregado al carrito
        </div>

        <div id="igCartToastSubtitle">
          Tu producto fue añadido correctamente.
        </div>

      </div>

    `;


    document.body.appendChild(
      toast
    );

  }


  /* =======================================================
     MOSTRAR AVISO
     ======================================================= */

  function showToast(){

    createToast();


    const toast =
      document.getElementById(
        "igCartToast"
      );


    if(!toast){

      return;

    }


    clearTimeout(
      toastTimer
    );


    /*
     * Reiniciamos la animación.
     */
    toast.classList.remove(
      "ig-show"
    );


    void toast.offsetWidth;


    toast.classList.add(
      "ig-show"
    );


    toastTimer =
      setTimeout(
        function(){

          toast.classList.remove(
            "ig-show"
          );

        },
        2600
      );

  }


  /* =======================================================
     INSTALAR SOBRE addToCart
     
     No reemplazamos la función.
     Guardamos la original y la ejecutamos exactamente
     como antes.
     ======================================================= */

  function install(){

    if(
      typeof window.addToCart !==
      "function"
    ){

      /*
       * addToCart todavía no existe.
       * Esperamos a que la aplicación termine
       * de cargar sus funciones.
       */
      setTimeout(
        install,
        250
      );

      return;

    }


    /*
     * Evitar instalar el hook dos veces.
     */
    if(
      window.addToCart.__IG_CART_WRAPPED
    ){

      return;

    }


    const originalAddToCart =
      window.addToCart;


    function wrappedAddToCart(){

      let result;


      try{

        /*
         * Ejecutamos EXACTAMENTE la función
         * original con los mismos argumentos.
         */
        result =
          originalAddToCart.apply(
            this,
            arguments
          );

      }catch(error){

        /*
         * Si el carrito original produce
         * un error, no mostramos falso éxito.
         */
        throw error;

      }


      /*
       * Si addToCart devuelve una Promise,
       * esperamos a que termine correctamente.
       */
      if(
        result &&
        typeof result.then ===
        "function"
      ){

        return result.then(
          function(value){

            showToast();

            return value;

          }
        );

      }


      /*
       * Si es una función normal,
       * mostramos la confirmación.
       */
      showToast();


      return result;

    }


    wrappedAddToCart.__IG_CART_WRAPPED =
      true;


    wrappedAddToCart.__IG_CART_ORIGINAL =
      originalAddToCart;


    window.addToCart =
      wrappedAddToCart;

  }


  /* =======================================================
     INICIO
     ======================================================= */

  function start(){

    createToast();

    install();

  }


  if(
    document.readyState ===
    "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      start,
      {once:true}
    );

  }else{

    start();

  }

})();

</script>

    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }

  .ig-order-number{
    font-size:22px;
    font-weight:800;
  }

  .ig-order-date{
    color:var(--muted,#666);
    font-size:14px;
    margin-top:4px;
  }

  .ig-order-badge{
    display:inline-flex;
    align-items:center;
    padding:8px 12px;
    border-radius:999px;
    font-size:14px;
    font-weight:800;
    background:#eee;
  }

  .ig-status-timeline{
    position:relative;
    display:grid;
    gap:0;
    margin:24px 0;
  }

  .ig-status-step{
    position:relative;
    display:grid;
    grid-template-columns:42px 1fr;
    gap:12px;
    min-height:65px;
  }

  .ig-status-step:not(:last-child)::before{
    content:"";
    position:absolute;
    left:19px;
    top:40px;
    width:4px;
    height:calc(100% - 15px);
    background:#ddd;
    border-radius:10px;
  }

  .ig-status-step.done:not(:last-child)::before,
  .ig-status-step.current:not(:last-child)::before{
    background:#16803c;
  }

  .ig-status-dot{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#e5e5e5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    position:relative;
    z-index:2;
  }

  .ig-status-step.done .ig-status-dot,
  .ig-status-step.current .ig-status-dot{
    background:#16803c;
    color:#fff;
  }

  .ig-status-step.current .ig-status-dot{
    box-shadow:0 0 0 5px rgba(22,128,60,.12);
  }

  .ig-status-title{
    font-weight:800;
    padding-top:3px;
  }

  .ig-status-description{
    color:var(--muted,#666);
    font-size:14px;
    margin-top:3px;
  }

  .ig-cancelled{
    padding:15px;
    border-radius:10px;
    background:#fff0f0;
    border:1px solid #efcccc;
    color:#991b1b;
    font-weight:700;
    margin:20px 0;
  }

  .ig-order-items{
    border-top:1px solid var(--border,#ddd);
    margin-top:20px;
    padding-top:18px;
  }

  .ig-order-item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:11px 0;
    border-bottom:1px solid #eee;
  }

  .ig-order-item:last-child{
    border-bottom:0;
  }

  .ig-order-item-name{
    font-weight:700;
  }

  .ig-order-item-meta{
    color:var(--muted,#666);
    font-size:14px;
    margin-top:3px;
  }

  .ig-order-item-price{
    font-weight:800;
    white-space:nowrap;
  }

  .ig-order-total{
    display:flex;
    justify-content:space-between;
    gap:15px;
    font-size:21px;
    font-weight:900;
    border-top:2px solid var(--border,#ddd);
    margin-top:12px;
    padding-top:15px;
  }

  .ig-order-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:20px;
  }

  .ig-order-info-box{
    background:#f7f7f7;
    border-radius:10px;
    padding:12px;
  }

  .ig-order-info-box small{
    display:block;
    color:#666;
    margin-bottom:4px;
  }

  .ig-tracking-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
  }

  .ig-tracking-refresh{
    flex:1;
    min-width:180px;
  }

  .ig-tracking-clear{
    min-width:140px;
  }

  @media(max-width:600px){
    #igOrderTrackingSection .ig-tracking-card{
      padding:17px;
    }

    .ig-order-info{
      grid-template-columns:1fr;
    }

    .ig-order-item{
      align-items:flex-start;
    }

    .ig-order-total{
      font-size:19px;
    }
  }
</style>

<script>
(function(){

  "use strict";

  if(window.__IG_ORDER_TRACKING_LOADED){
    return;
  }

  window.__IG_ORDER_TRACKING_LOADED=true;

  let currentOrder=null;
  let refreshTimer=null;

  const STATUS_STEPS=[
    {
      key:"pending",
      icon:"📥",
      title:"Pedido recibido",
      description:"Recibimos correctamente tu pedido."
    },
    {
      key:"confirmed",
      icon:"✅",
      title:"Pedido confirmado",
      description:"Tu pedido fue confirmado."
    },
    {
      key:"preparing",
      icon:"🛠️",
      title:"Preparando",
      description:"Estamos preparando tus productos."
    },
    {
      key:"ready",
      icon:"📦",
      title:"Pedido listo",
      description:"Tu pedido está listo para entregar."
    },
    {
      key:"delivered",
      icon:"🏠",
      title:"Entregado",
      description:"El pedido fue entregado."
    }
  ];

  function createTrackingSection(){

    if(document.getElementById(
      "igOrderTrackingSection"
    )){
      return;
    }

    const productsSection=
      document.getElementById(
        "productsSection"
      );

    if(!productsSection){
      return;
    }

    const section=
      document.createElement("section");

    section.id=
      "igOrderTrackingSection";

    section.className=
      "section";

    section.innerHTML=`

      <div class="container">

        <div class="ig-tracking-card">

          <h2>
            📦 Seguimiento de mi pedido
          </h2>

          <p class="ig-tracking-intro">
            Consultá el estado de tu compra
            usando tu número de pedido y el
            correo electrónico utilizado al comprar.
          </p>

          <form
            id="igOrderTrackingForm"
            class="ig-tracking-form">

            <div>
              <label for="igTrackingOrderNumber">
                Número de pedido
              </label>

              <input
                id="igTrackingOrderNumber"
                type="number"
                min="1"
                inputmode="numeric"
                placeholder="Ej.: 1757601234567"
                required>
            </div>

            <div>
              <label for="igTrackingEmail">
                Correo electrónico
              </label>

              <input
                id="igTrackingEmail"
                type="email"
                autocomplete="email"
                placeholder="El correo usado en la compra"
                required>
            </div>

            <button
              id="igTrackingButton"
              class="button full"
              type="submit">

              🔎 Consultar pedido

            </button>

          </form>

          <div
            id="igTrackingResult"
            class="ig-tracking-result">
          </div>

        </div>

      </div>

    `;

    productsSection
      .parentNode
      .insertBefore(
        section,
        productsSection.nextSibling
      );

    document
      .getElementById(
        "igOrderTrackingForm"
      )
      .addEventListener(
        "submit",
        consultOrder
      );
  }

  function statusIndex(status){

    return STATUS_STEPS.findIndex(
      step=>step.key===status
    );
  }

  function statusLabel(status){

    const found=
      STATUS_STEPS.find(
        step=>step.key===status
      );

    if(found){
      return found.title;
    }

    if(status==="cancelled"){
      return "Pedido cancelado";
    }

    return status || "Sin estado";
  }

  function paymentLabel(method){

    if(method==="mercado_pago"){
      return "Mercado Pago";
    }

    if(method==="cash"){
      return "Pago al contado";
    }

    return method || "No informado";
  }

  function paymentStatusLabel(status){

    const map={
      pending:"Pendiente",
      paid:"Pagado",
      rejected:"Rechazado",
      cancelled:"Cancelado"
    };

    return map[status] || status || "Sin información";
  }

  function formatDate(value){

    if(!value){
      return "Sin fecha";
    }

    try{

      return new Date(value)
        .toLocaleString(
          "es-AR",
          {
            dateStyle:"medium",
            timeStyle:"short"
          }
        );

    }catch(error){

      return value;
    }
  }

  async function consultOrder(event){

    event.preventDefault();

    const orderNumber=
      Number(
        document
          .getElementById(
            "igTrackingOrderNumber"
          )
          .value
          .trim()
      );

    const email=
      document
        .getElementById(
          "igTrackingEmail"
        )
        .value
        .trim();

    const button=
      document.getElementById(
        "igTrackingButton"
      );

    const result=
      document.getElementById(
        "igTrackingResult"
      );

    if(
      !orderNumber ||
      !email
    ){

      result.innerHTML=`
        <div class="ig-tracking-error">
          Completá el número de pedido y el correo electrónico.
        </div>
      `;

      return;
    }

    button.disabled=true;

    button.textContent=
      "Consultando...";

    result.innerHTML="";

    try{

      const {
        data,
        error
      }=
        await supabaseClient.rpc(
          "consultar_pedido_international_gateway",
          {
            p_order_number:orderNumber,
            p_customer_email:email
          }
        );

      if(error){
        throw error;
      }

      if(!data){
        throw new Error(
          "No encontramos un pedido con esos datos."
        );
      }

      currentOrder=data;

      renderOrder(data);

      localStorage.setItem(
        "ig_last_order_number",
        String(orderNumber)
      );

      startAutoRefresh();

    }catch(error){

      console.error(
        "International Gateway — seguimiento:",
        error
      );

      result.innerHTML=`
        <div class="ig-tracking-error">
          ${escapeHtml(
            error.message ||
            "No encontramos un pedido con esos datos."
          )}
        </div>
      `;

    }finally{

      button.disabled=false;

      button.textContent=
        "🔎 Consultar pedido";

    }
  }

  function renderTimeline(status){

    if(status==="cancelled"){

      return`
        <div class="ig-cancelled">
          ❌ Este pedido fue cancelado.
        </div>
      `;
    }

    const current=
      statusIndex(status);

    return`
      <div class="ig-status-timeline">

        ${
          STATUS_STEPS
            .map((step,index)=>{

              let className="";

              if(index<current){
                className="done";
              }

              if(index===current){
                className="current";
              }

              return`

                <div
                  class="ig-status-step ${className}">

                  <div class="ig-status-dot">
                    ${step.icon}
                  </div>

                  <div>

                    <div class="ig-status-title">
                      ${step.title}
                    </div>

                    <div class="ig-status-description">
                      ${step.description}
                    </div>

                  </div>

                </div>

              `;

            })
            .join("")
        }

      </div>
    `;
  }

  function renderOrder(order){

    const result=
      document.getElementById(
        "igTrackingResult"
      );

    if(!result){
      return;
    }

    const items=
      Array.isArray(order.items)
        ? order.items
        : [];

    result.innerHTML=`

      <div class="ig-order-header">

        <div>

          <div class="ig-order-number">
            Pedido #${escapeHtml(
              String(order.order_number)
            )}
          </div>

          <div class="ig-order-date">
            Realizado el
            ${escapeHtml(
              formatDate(order.created_at)
            )}
          </div>

        </div>

        <span class="ig-order-badge">
          ${escapeHtml(
            statusLabel(order.order_status)
          )}
        </span>

      </div>

      ${renderTimeline(order.order_status)}

      <div class="ig-order-info">

        <div class="ig-order-info-box">

          <small>
            Estado del pago
          </small>

          <strong>
            ${escapeHtml(
              paymentStatusLabel(
                order.payment_status
              )
            )}
          </strong>

        </div>

        <div class="ig-order-info-box">

          <small>
            Método de pago
          </small>

          <strong>
            ${escapeHtml(
              paymentLabel(
                order.payment_method
              )
            )}
          </strong>

        </div>

      </div>

      <div class="ig-order-items">

        <h3>
          Productos
        </h3>

        ${
          items.length
            ? items.map(item=>`

              <div class="ig-order-item">

                <div>

                  <div class="ig-order-item-name">
                    ${escapeHtml(
                      item.product_name
                    )}
                  </div>

                  <div class="ig-order-item-meta">
                    ${escapeHtml(
                      String(item.quantity)
                    )}
                    ×
                    ${money(item.product_price)}
                  </div>

                </div>

                <div class="ig-order-item-price">
                  ${money(item.subtotal)}
                </div>

              </div>

            `).join("")
            : `
              <p>
                No hay productos asociados a este pedido.
              </p>
            `
        }

        <div class="ig-order-total">

          <span>
            Total
          </span>

          <strong>
            ${money(order.total)}
          </strong>

        </div>

      </div>

      <div class="ig-tracking-actions">

        <button
          type="button"
          class="button ig-tracking-refresh"
          onclick="window.IGRefreshOrderTracking()">

          🔄 Actualizar estado

        </button>

        <button
          type="button"
          class="button secondary ig-tracking-clear"
          onclick="window.IGClearOrderTracking()">

          Limpiar

        </button>

      </div>

    `;
  }

  async function refreshOrder(){

    if(!currentOrder){
      return;
    }

    const result=
      document.getElementById(
        "igTrackingResult"
      );

    try{

      const {
        data,
        error
      }=
        await supabaseClient.rpc(
          "consultar_pedido_international_gateway",
          {
            p_order_number:
              Number(
                currentOrder.order_number
              ),

            p_customer_email:
              document
                .getElementById(
                  "igTrackingEmail"
                )
                .value
                .trim()
          }
        );

      if(error){
        throw error;
      }

      if(data){

        const oldStatus=
          currentOrder.order_status;

        currentOrder=data;

        renderOrder(data);

        if(
          oldStatus &&
          oldStatus!==data.order_status
        ){

          showToast(
            "El estado de tu pedido fue actualizado."
          );
        }

      }

    }catch(error){

      console.error(
        "Error actualizando pedido:",
        error
      );

      if(result){

        const notice=
          document.createElement("div");

        notice.className=
          "ig-tracking-error";

        notice.textContent=
          "No pudimos actualizar el pedido. Intentá nuevamente.";

        result.prepend(notice);
      }
    }
  }

  function startAutoRefresh(){

    if(refreshTimer){
      clearInterval(refreshTimer);
    }

    refreshTimer=
      setInterval(
        refreshOrder,
        15000
      );
  }

  function clearTracking(){

    currentOrder=null;

    if(refreshTimer){
      clearInterval(refreshTimer);
      refreshTimer=null;
    }

    const result=
      document.getElementById(
        "igTrackingResult"
      );

    if(result){
      result.innerHTML="";
    }

    const orderInput=
      document.getElementById(
        "igTrackingOrderNumber"
      );

    const emailInput=
      document.getElementById(
        "igTrackingEmail"
      );

    if(orderInput){
      orderInput.value="";
    }

    if(emailInput){
      emailInput.value="";
    }

    localStorage.removeItem(
      "ig_last_order_number"
    );
  }

  window.IGRefreshOrderTracking=
    refreshOrder;

  window.IGClearOrderTracking=
    clearTracking;

  function initialize(){

    createTrackingSection();

    const savedNumber=
      localStorage.getItem(
        "ig_last_order_number"
      );

    const input=
      document.getElementById(
        "igTrackingOrderNumber"
      );

    if(
      savedNumber &&
      input
    ){

      input.value=
        savedNumber;
    }
  }

  if(
    document.readyState==="loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      initialize,
      {once:true}
    );

  }else{

    initialize();

  }

})();
</script>
