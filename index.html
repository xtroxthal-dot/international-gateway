<body>

<div id="app"></div>

<div id="toast" class="toast"></div>

<!-- MODAL ADMIN LOGIN -->

<div id="adminLoginModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h2>Administrador</h2>

      <button
        class="close"
        onclick="closeAdminLogin()">
        ×
      </button>
    </div>

    <form id="loginForm" class="form">

      <div class="field">
        <label>Correo del administrador</label>

        <input
          id="loginEmail"
          type="email"
          required
          autocomplete="email">
      </div>

      <div class="field">
        <label>Contraseña</label>

        <input
          id="loginPassword"
          type="password"
          required
          autocomplete="current-password">
      </div>

      <button
        class="button full"
        type="submit">
        Iniciar sesión
      </button>

      <button
        class="button secondary full"
        type="button"
        onclick="resetAdminPassword()">
        Recuperar contraseña
      </button>

      <div id="loginMessage"></div>

    </form>

  </div>

</div>

<!-- MODAL PRODUCTO -->

<div id="productModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="productModalTitle">
        Nuevo producto
      </h2>

      <button
        class="close"
        onclick="closeProductModal()">
        ×
      </button>

    </div>

    <form id="productForm" class="form">

      <input
        id="productId"
        type="hidden">

      <div class="form-grid">

        <div class="field">

          <label>
            Nombre del producto *
          </label>

          <input
            id="productName"
            required>

        </div>

        <div class="field">

          <label>
            Precio *
          </label>

          <input
            id="productPrice"
            type="number"
            min="0"
            step="0.01"
            required>

        </div>

        <div class="field">

          <label>
            Categoría
          </label>

          <input
            id="productCategory">

        </div>

        <div class="field">

          <label>
            Disponibilidad
          </label>

          <select id="productAvailable">

            <option value="true">
              Disponible
            </option>

            <option value="false">
              Agotado
            </option>

          </select>

        </div>

        <div class="field full-field">

          <label>
            Descripción
          </label>

          <textarea
            id="productDescription"></textarea>

        </div>

        <div class="field full-field">

          <label>
            Características
          </label>

          <textarea
            id="productCharacteristics"
            placeholder="Ejemplo:
5 velocidades
600 W
Vaso de 1,5 L
Función pulso"></textarea>

        </div>

        <div class="field full-field">

          <label>
            Fotos del producto
          </label>

          <input
            id="productImagesInput"
            type="file"
            accept="image/*"
            multiple>

          <small>
            Podés seleccionar varias fotos directamente desde el celular.
          </small>

          <div
            id="productImageList"
            class="image-list">
          </div>

        </div>

      </div>

      <div id="productFormMessage"></div>

      <button
        class="button full"
        type="submit">
        Guardar producto
      </button>

    </form>

  </div>

</div>

<script>

/* =========================================================
   INTERNATIONAL GATEWAY
   APLICACIÓN COMPLETA
   ========================================================= */

const SUPABASE_URL =
  "https://hxtzlrsmjwrpqgjgbzyl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cv6J952zB8hmDtXSHMbtCQ_xGJZHN1J";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const STORAGE_BUCKET =
  "international-gateway";

let products = [];

let cart =
  JSON.parse(
    localStorage.getItem("ig_cart") || "[]"
  );

let adminUser = null;

let adminProducts = [];

let editingProduct = null;

let installPrompt = null;

let settings = {
  store_name:"International Gateway",
  logo_url:"",
  mercadopago_url:""
};


/* =========================================================
   UTILIDADES
   ========================================================= */

function money(value){

  return new Intl.NumberFormat(
    "es-AR",
    {
      style:"currency",
      currency:"ARS",
      maximumFractionDigits:2
    }
  ).format(
    Number(value || 0)
  );

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent=message;

  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },3000);

}


function setMessage(
  id,
  message,
  type=""
){

  const el =
    document.getElementById(id);

  if(!el)return;

  el.innerHTML =
    message
      ? `<div class="notice ${type}">
          ${escapeHtml(message)}
        </div>`
      : "";

}


function saveCart(){

  localStorage.setItem(
    "ig_cart",
    JSON.stringify(cart)
  );

}


function cartCount(){

  return cart.reduce(
    (sum,item)=>
      sum+item.quantity,
    0
  );

}


function cartTotal(){

  return cart.reduce(
    (sum,item)=>
      sum+
      (
        Number(item.price)*
        item.quantity
      ),
    0
  );

}


/* =========================================================
   PWA — INSTALACIÓN
   ========================================================= */

function setupInstallPrompt(){

  window.addEventListener(
    "beforeinstallprompt",
    event=>{

      event.preventDefault();

      installPrompt=event;

      updateInstallButtons();

    }
  );


  window.addEventListener(
    "appinstalled",
    ()=>{

      installPrompt=null;

      updateInstallButtons();

      showToast(
        "International Gateway fue instalada correctamente."
      );

    }
  );


  updateInstallButtons();

}


function updateInstallButtons(){

  const button =
    document.getElementById(
      "installAppButton"
    );

  if(!button)return;

  if(installPrompt){

    button.hidden=false;

  }else{

    button.hidden=true;

  }

}


async function installApp(){

  if(!installPrompt){

    showToast(
      "La instalación todavía no está disponible en este navegador."
    );

    return;

  }

  const promptEvent=
    installPrompt;

  installPrompt=null;

  updateInstallButtons();

  try{

    const result=
      await promptEvent.prompt();

    if(result?.outcome==="accepted"){

      showToast(
        "Instalación aceptada."
      );

    }else{

      showToast(
        "Instalación cancelada."
      );

    }

  }catch(error){

    console.error(
      "Error de instalación:",
      error
    );

  }

}


/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

async function loadSettings(){

  const {
    data,
    error
  }=
    await supabaseClient
      .from("ig_site_settings")
      .select("key,value");

  if(error){

    console.error(error);

    return;

  }

  if(data){

    data.forEach(row=>{

      if(
        row.key==="store_name"
      ){

        settings.store_name =
          row.value ||
          "International Gateway";

      }

      if(
        row.key==="logo_url"
      ){

        settings.logo_url =

async function loadProducts(){

  const {
    data,
    error
  }=
    await supabaseClient
      .from("ig_products")
      .select(`
        id,
        name,
        description,
        characteristics,
        price,
        category,
        available,
        active,
        ig_product_images(
          id,
          storage_path,
          public_url,
          is_primary,
          sort_order
        )
      `)
      .eq("active",true)
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    console.error(error);

    products=[];

    return;

  }

  products =
    (data || [])
      .map(product=>{

        product.ig_product_images =
          (
            product.ig_product_images ||
            []
          ).sort((a,b)=>{

            if(
              a.is_primary &&
              !b.is_primary
            ){

              return -1;

            }

            if(
              !a.is_primary &&
              b.is_primary
            ){

              return 1;

            }

            return (
              a.sort_order -
              b.sort_order
            );

          });

        return product;

      });

  renderProducts();

}


function productImage(product){

  if(image?.public_url){

        alt="${escapeHtml(product.name)}">

  }

  return `
    <span>

  `;

}

function addToCart(productId){

  const product =
    products.find(
      p=>p.id===productId
    );

  if(
    !product ||
    !product.available
  ){

    showToast(
      "Este producto no está disponible."
    );

    return;

  }

  const existing =
    cart.find(
      item=>item.id===productId
    );

  if(existing){

    existing.quantity++;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:Number(product.price),

      image:
        product
          .ig_product_images?.[0]
          ?.public_url ||
        "",

      quantity:1

    });

  }

  saveCart();

  updateCartCount();

  showToast(
    "Producto agregado al carrito."
  );

}


function updateCartCount(){

  const el =
    document.getElementById(
      "cartCount"
    );

  if(el){

    el.textContent =
      cartCount();

  }

}

function changeCartQuantity(
  id,
  delta
){

  const item =
    cart.find(
      x=>x.id===id
    );

  if(!item)return;

  item.quantity += delta;

  if(item.quantity<=0){

    cart =
      cart.filter(
        x=>x.id!==id
      );

  }

  saveCart();

  renderCart();

  updateCartCount();

}


function removeFromCart(id){

  cart =
    cart.filter(
      x=>x.id!==id
    );

  saveCart();

  renderCart();

  updateCartCount();

}

      `).join("")}

async function createOrder(event){

  event.preventDefault();

  if(!cart.length){

    showToast(
      "El carrito está vacío."
    );

    return;

  }

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();

  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();

  const email =
    document
      .getElementById("customerEmail")
      .value
      .trim();

  const paymentMethod =
    document
      .getElementById("paymentMethod")
      .value;

  if(
    !name ||
    !phone ||
    !email ||
    !paymentMethod
  ){

    setMessage(
      "checkoutMessage",
      "Completá todos los datos y seleccioná un método de pago.",
      "error"
    );

    return;

  }

  const button =
    document.getElementById(
      "finishOrderButton"
    );

  button.disabled=true;

  button.textContent=
    "Creando pedido...";

  try{

    const ids =
      cart.map(
        item=>item.id
      );

    const {
      data:currentProducts,
      error:productsError
    }=
      await supabaseClient
        .from("ig_products")
        .select(`
          id,
          name,
          price,
          available,
          active,
          ig_product_images(
            public_url,
            is_primary,
            sort_order
          )
        `)
        .in("id",ids);

    if(productsError)
      throw productsError;

    const normalized =
      (currentProducts || [])
        .map(p=>{

          p.ig_product_images =
            (
              p.ig_product_images ||
              []
            ).sort((a,b)=>{

              if(
                a.is_primary &&
                !b.is_primary
              ){

                return -1;

              }

              if(
                !a.is_primary &&
                b.is_primary
              ){

                return 1;

              }

              return (
                a.sort_order -
                b.sort_order
              );

            });

          return p;

        });


    let validItems=[];

    let total=0;


    for(
      const item of cart
    ){

      const p =
        normalized.find(
          x=>x.id===item.id
        );

      if(
        !p ||
        !p.active ||
        !p.available
      ){

        throw new Error(
          `El producto "${item.name}" ya no está disponible.`
        );

      }

      const quantity =
        Math.max(
          1,
          Number(item.quantity)
        );

      const price =
        Number(p.price);

      const subtotal =
        price*quantity;

      validItems.push({

        product_id:p.id,

        product_name:p.name,

        product_price:price,

        quantity,

        subtotal

      });

      total += subtotal;

    }


    /*
      Generamos el ID del pedido
      en el navegador.

      Esto permite crear el pedido
      sin hacer SELECT posterior
      sobre ig_orders.
    */

    const orderId =
      crypto.randomUUID();

    const orderNumber =
      Date.now();


    const {
      error:orderError
    }=
      await supabaseClient
        .from("ig_orders")
        .insert({

          id:orderId,

          order_number:orderNumber,

          customer_name:name,

          customer_phone:phone,

          customer_email:email,

          payment_method:
            paymentMethod,

          payment_status:
            "pending",

          order_status:
            "pending",

          subtotal:total,

          total:total

        });


    if(orderError)
      throw orderError;


    const items =
      validItems.map(item=>({

        order_id:orderId,

        ...item

      }));


    const {
      error:itemsError
    }=
      await supabaseClient
        .from("ig_order_items")
        .insert(items);


    if(itemsError){

      await supabaseClient
        .from("ig_orders")
        .delete()
        .eq(
          "id",
          orderId
        );

      throw itemsError;

    }


    cart=[];

    saveCart();

    updateCartCount();


    showConfirmation(
      {
        id:orderId,
        order_number:orderNumber,
        total:total
      },
      paymentMethod
    );


  }catch(error){

    console.error(error);

    setMessage(
      "checkoutMessage",
      error.message ||
        "No se pudo crear el pedido.",
      "error"
    );


  }finally{

    button.disabled=false;

    button.textContent=
      "Confirmar pedido";

  }

}


function showConfirmation(
  order,
  paymentMethod
){

  document
    .getElementById("storeView")
    .classList.add("hidden");

  document
    .getElementById("cartView")
    .classList.add("hidden");

  document
    .getElementById("checkoutView")
    .classList.add("hidden");

  document
    .getElementById("confirmationView")
    .classList.remove("hidden");


  document
    .getElementById("confirmationNumber")
    .textContent =
      "#" + order.order_number;


  document
    .getElementById("confirmationTotal")
    .textContent =
      money(order.total);


  const paymentBox =
    document.getElementById(
      "paymentAction"
    );


  if(
    paymentMethod==="mercado_pago"
  ){

    if(settings.mercadopago_url){

      paymentBox.innerHTML=`

        <div class="notice success">

          Tu pedido fue registrado correctamente.

        </div>

        <br>

        <button
          class="button success full"
          onclick="window.open('${escapeHtml(settings.mercadopago_url)}','_blank')">

          Pagar con Mercado Pago

        </button>

        <br><br>

        <small>

          Después del pago,
          el administrador podrá
          confirmar el estado del pedido.

        </small>

      `;

    }else{

      paymentBox.innerHTML=`

        <div class="notice warning">

          El pedido fue registrado,
          pero Mercado Pago todavía
          no está configurado.

          El administrador debe agregar
          el enlace de Mercado Pago
          desde Configuración.

        </div>

      `;

    }

  }else{

    paymentBox.innerHTML=`

      <div class="notice">

        Elegiste pago al contado.

        El administrador se pondrá
        en contacto para coordinar
        el pago.

      </div>

    `;

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

async function verifyAdmin(user){

  if(!user)return false;


  const {
    data,
    error
  }=
    await supabaseClient
      .from("ig_admins")
      .select("user_id")
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(error){

    console.error(error);

    return false;

  }


  return !!data;

}


async function loginAdmin(event){

  event.preventDefault();


  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("loginPassword")
      .value;


  setMessage(
    "loginMessage",
    "Ingresando..."
  );


  const {
    data,
    error
  }=
    await supabaseClient
      .auth
      .signInWithPassword({
        email,
        password
      });


  if(error){

    setMessage(
      "loginMessage",
      error.message,
      "error"
    );

    return;

  }


  const ok =
    await verifyAdmin(
      data.user
    );


  if(!ok){

    await supabaseClient
      .auth
      .signOut();

    setMessage(
      "loginMessage",
      "El usuario existe, pero no tiene permisos de administrador.",
      "error"
    );

    return;

  }


  adminUser =
    data.user;

  closeAdminLogin();

  openAdminPanel();

}


async function resetAdminPassword(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  if(!email){

    setMessage(
      "loginMessage",
      "Escribí primero el correo del administrador.",
      "warning"
    );

    return;

  }


  const {
    error
  }=
    await supabaseClient
      .auth
      .resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin
        }
      );


  if(error){

    setMessage(
      "loginMessage",
      error.message,
      "error"
    );

    return;

  }


  setMessage(
    "loginMessage",
    "Si el correo es válido, recibirás instrucciones para recuperar la contraseña.",
    "success"
  );

}

      );
    });


  const target =
    document.getElementById(
      "admin-"+section

    target.classList.add(

    );

  }

    document.querySelector(

}

async function loadAdminDashboard(){

  const {
    data:orders,
    error
  }=
    await supabaseClient
      .from("ig_orders")
      .select(
        "total,payment_status,order_status"
      );


  if(error){

    console.error(error);

    return;

  }


  const all =
    orders || [];


  const paid =
    all.filter(
      o=>o.payment_status==="paid"
    );


  const revenue =
    paid.reduce(
      (sum,o)=>
        sum+
        Number(
          o.total || 0
        ),
      0
    );


  document
    .getElementById("statOrders")
    .textContent =
      all.length;


  document
    .getElementById("statPaid")
    .textContent =
      paid.length;


  document
    .getElementById("statRevenue")
    .textContent =
      money(revenue);


  const pending =
    all.filter(
      o=>o.order_status==="pending"
    ).length;


  document
    .getElementById("statPending")
    .textContent =
      pending;

}

async function saveProduct(
  event
){

  event.preventDefault();


  if(!adminUser){

    showToast(
      "No hay sesión de administrador."
    );

    return;

  }


  const id =
    document
      .getElementById(
        "productId"
      )
      .value;


  const name =
    document
      .getElementById(
        "productName"
      )
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById(
          "productPrice"
        )
        .value
    );


  const category =
    document
      .getElementById(
        "productCategory"
      )
      .value
      .trim();


  const available =
    document
      .getElementById(
        "productAvailable"
      )
      .value==="true";


  const description =
    document
      .getElementById(
        "productDescription"
      )
      .value
      .trim();


  const characteristics =
    document
      .getElementById(
        "productCharacteristics"
      )
      .value
      .trim();


  if(!name){

    setMessage(
      "productFormMessage",
      "El nombre es obligatorio.",
      "error"
    );

    return;

  }


  if(
    price<0 ||
    Number.isNaN(price)
  ){

    setMessage(
      "productFormMessage",
      "El precio no es válido.",
      "error"
    );

    return;

  }


  const payload={

    name,

    description,

    characteristics,

    price,

    category,

    available,

    active:true

  };


  let productId=id;


  try{

    if(id){

      const {
        error
      }=
        await supabaseClient
          .from("ig_products")
          .update(payload)
          .eq("id",id);

      if(error)
        throw error;

    }else{

      const {
        data,
        error
      }=
        await supabaseClient
          .from("ig_products")
          .insert(payload)
          .select()
          .single();

      if(error)
        throw error;

      productId=
        data.id;

    }


    const files=[
      ...document
        .getElementById(
          "productImagesInput"
        )
        .files
    ];


    for(
      let i=0;
      i<files.length;
      i++
    ){

      const file =
        files[i];


      if(
        !file.type.startsWith(
          "image/"
        )
      ){

        continue;

      }


      const safeName =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "-"
        );


      const path =
        `products/${productId}/${Date.now()}-${i}-${safeName}`;


      const {
        error:uploadError
      }=
        await supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .upload(
            path,
            file,
            {
              cacheControl:"3600",
              upsert:false
            }
          );


      if(uploadError)
        throw uploadError;


      const {
        data:publicData
      }=
        supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .getPublicUrl(
            path
          );


      const {
        error:imageError
      }=
        await supabaseClient
          .from(
            "ig_product_images"
          )
          .insert({

            product_id:
              productId,

            storage_path:
              path,

            public_url:
              publicData.publicUrl,

            is_primary:
              i===0 &&
              !id,

            sort_order:
              i

          });


      if(imageError)
        throw imageError;

    }


    showToast(
      id
        ? "Producto actualizado."
        : "Producto creado."
    );


    closeProductModal();


    await loadAdminProducts();

    await loadProducts();


  }catch(error){

    console.error(error);


    setMessage(
      "productFormMessage",
      error.message ||
        "No se pudo guardar el producto.",
      "error"
    );

  }

}


async function deleteProduct(id){

  const product =
    adminProducts.find(
      p=>p.id===id
    );


  if(!product)return;


  const confirmed =
    confirm(
      `¿Eliminar definitivamente "${product.name}"?\n\n`+
      `Si nunca tuvo ventas, se eliminarán también sus fotos.\n`+
      `Si tuvo ventas, se conservará el historial del pedido.`
    );


  if(!confirmed)return;


  try{

    const {
      data:items,
      error:itemsError
    }=
      await supabaseClient
        .from(
          "ig_order_items"
        )
        .select("id")
        .eq(
          "product_id",
          id
        )
        .limit(1);


    if(itemsError)
      throw itemsError;


    const hadOrders =
      (items || []).length>0;


    const images =
      product.ig_product_images ||
      [];


    const paths =
      images
        .map(
          image=>image.storage_path
        )
        .filter(Boolean);


    if(paths.length){

      const {
        error:storageError
      }=
        await supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .remove(paths);


      if(storageError){

        console.warn(
          "No se pudieron eliminar algunas fotos:",
          storageError
        );

      }

    }


    const {
      error:deleteError
    }=
      await supabaseClient
        .from(
          "ig_products"
        )
        .delete()
        .eq(
          "id",
          id
        );


    if(deleteError)
      throw deleteError;


    if(hadOrders){

      showToast(
        "Producto eliminado del catálogo. El historial de pedidos se conserva."
      );

    }else{

      showToast(
        "Producto y sus fotos eliminados completamente."
      );

    }


    await loadAdminProducts();

    await loadProducts();


  }catch(error){

    console.error(error);


    showToast(
      error.message ||
        "No se pudo eliminar el producto."
    );

  }

}

async function deleteProductImage(
  imageId,
  path
){

  if(
    !confirm(
      "¿Eliminar esta foto?"
    )

  }


  try{

    const {
      error:storageError
    }=
      await supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .remove([path]);


    if(storageError)
      throw storageError;


    const {
      error
    }=

        .from(

  );

async function uploadLogo(){

  const input =
    document.getElementById(
      "logoInput"
    );


  const file =
    input.files[0];


  if(!file){

    showToast(
      "Seleccioná una foto."
    );

    return;

  }


  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    showToast(
      "El archivo debe ser una imagen."
    );

    return;

  }


  try{

    const path =
      `site/logo-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"-")}`;


    const {
      error:uploadError
    }=
      await supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .upload(
          path,
          file,
          {
            cacheControl:"3600",
            upsert:false
          }
        );


    if(uploadError)
      throw uploadError;


    const {
      data:publicData
    }=
      supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .getPublicUrl(
          path
        );


    const oldLogo =
      settings.logo_url;


    const {
      error:dbError
    }=
      await supabaseClient
        .from(
          "ig_site_settings"
        )
        .upsert(
          {
            key:"logo_url",
            value:
              publicData.publicUrl
          },
          {
            onConflict:"key"
          }
        );


    if(dbError)
      throw dbError;


    settings.logo_url =
      publicData.publicUrl;


    if(oldLogo){

      const oldPath =
        extractStoragePath(
          oldLogo
        );


      if(oldPath){

        await supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .remove(
            [oldPath]
          );

      }

    }


    document
      .getElementById(
        "logoPreview"
      )
      .innerHTML=
        `
          <img
            src="${escapeHtml(settings.logo_url)}"
            alt="Logotipo">
        `;


    updateBrand();


    showToast(
      "Logotipo actualizado."
    );


  }catch(error){

    console.error(error);


    showToast(
      error.message ||
        "No se pudo subir el logotipo."
    );

  }

}


function extractStoragePath(
  url
){

  if(!url)return null;


  const marker =
    `/storage/v1/object/public/${STORAGE_BUCKET}/`;


  const index =
    url.indexOf(marker);


  if(index===-1)
    return null;


  return decodeURIComponent(
    url.substring(
      index+
      marker.length
    )
  );

}

}

  if(typeof escapeHtml==='function'){
    return escapeHtml(value);
  }

    .replace(/[&<>"']/g,function(m){
      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'

async function loadCategories(){

  const {
    data,
    error
  }=
    await supabaseClient
      .from('ig_categories')
      .select(`
        id,
        name,
        slug,
        icon,
        active,
        sort_order
      `)
      .order(
        'sort_order',
        {ascending:true}
      );

  if(error){

    console.error(
      'IG categorías',
      error
    );

    return;
  }

  categories=data || [];

  renderCategories();

}


function renderCategories(){

  const box=
    document.getElementById(
      'igCategoryScrollV2'
    );

  if(!box){
    return;
  }

  const active=
    categories.filter(
      category=>category.active
    );

  const all=[
    {
      name:'Todos',
      slug:'__all__',
      icon:'🛍️'
    },
    ...active
  ];

  box.innerHTML=
    all.map(category=>`

      <button
        type="button"
        class="ig-v2-cat ${
          activeCategory===category.slug
            ? 'active'
            : ''
        }"
        data-ig-category="${
          esc(category.slug)
        }">

        ${esc(category.icon || '📦')}
        ${esc(category.name)}

      </button>

    `).join('');

  box
    .querySelectorAll(
      '[data-ig-category]'
    )
    .forEach(button=>{

      button.addEventListener(
        'click',
        function(){

          activeCategory=
            button.dataset.igCategory;

          renderCategories();

          renderFilteredProducts();

          document
            .getElementById(
              'productsSection'
            )
            ?.scrollIntoView({
              behavior:'smooth',
              block:'start'
            });

        }
      );

    });

}


/* =========================================================
   PRODUCTOS
   ========================================================= */

const originalRenderProducts=
  window.renderProducts;


function renderFilteredProducts(){

  if(
    typeof originalRenderProducts!==
    'function'
  ){
    return;
  }

  if(
    activeCategory===
    '__all__'
  ){

    originalRenderProducts();

    decorateProducts();

    return;
  }

  const originalProducts=
    products;

  products=
    originalProducts.filter(
      product=>{

        const category=
          String(
            product.category || ''
          )
          .trim();

        const categorySlug=
          category
            .toLowerCase()
            .replace(/\s+/g,'-');

        const selected=
          categories.find(
            c=>
              c.slug===
              activeCategory
          );

        return(
          categorySlug===
          activeCategory ||
          category===
          selected?.name
        );

      }
    );

  originalRenderProducts();

  products=
    originalProducts;

  decorateProducts();

}


window.renderProducts=
  function(){

    if(
      activeCategory===
      '__all__'
    ){

      originalRenderProducts();

    }else{

      renderFilteredProducts();

    }

    decorateProducts();

  };


function decorateProducts(){

  const container=
    document.getElementById(
      'productsContainer'
    );

  if(!container){
    return;
  }

  const cards=[
    ...container.querySelectorAll(
      '.product-card'
    )
  ];

  const visible=
    activeCategory===
    '__all__'
      ? products
      : products.filter(
          product=>{

            const category=
              String(
                product.category || ''
              )
              .trim();

            const slug=
              category
                .toLowerCase()
                .replace(/\s+/g,'-');

            const selected=
              categories.find(
                c=>
                  c.slug===
                  activeCategory
              );

            return(
              slug===
              activeCategory ||
              category===
              selected?.name
            );

          }
        );

  cards.forEach(
    (card,index)=>{

      const product=
        visible[index];

      if(!product){
        return;
      }

      card.dataset.igProductId=
        product.id;

      let actions=
        card.querySelector(
          '.ig-v2-product-actions'
        );

      if(!actions){

        actions=
          document.createElement(
            'div'
          );

        actions.className=
          'ig-v2-product-actions';

        card
          .querySelector(
            '.product-content'
          )
          ?.appendChild(
            actions
          );

      }

      actions.innerHTML=`

        <button
          type="button"
          class="button secondary"
          data-ig-detail="${esc(product.id)}">

          👁️ Ver producto

        </button>

        <button
          type="button"
          class="button secondary"
          data-ig-share="${esc(product.id)}">

          📤 Compartir

        </button>

      `;

    }
  );


  container
    .querySelectorAll(
      '[data-ig-detail]'
    )
    .forEach(button=>{

      button.addEventListener(
        'click',
        function(){

          openProductDetail(
            button.dataset.igDetail
          );

        }
      );

    });


  container
    .querySelectorAll(
      '[data-ig-share]'
    )
    .forEach(button=>{

      button.addEventListener(
        'click',
        function(){

          shareProduct(
            button.dataset.igShare
          );

        }
      );

    });

}

function openProductDetail(id){

  const product=
    products.find(
      p=>p.id===id
    ) ||
    (
      window.adminProducts ||
      []
    ).find(
      p=>p.id===id
    );

  if(!product){
    return;
  }

  const modal=
    document.getElementById(
      'igProductDetailV2'
    );

  const body=
    document.getElementById(
      'igDetailBodyV2'
    );

  if(!modal || !body){
    return;
  }

  const images=
    (
      product.ig_product_images ||
      []
    )
    .slice()
    .sort(
      (a,b)=>{

        if(
          a.is_primary &&
          !b.is_primary
        ){
          return -1;
        }

        if(
          !a.is_primary &&
          b.is_primary
        ){
          return 1;
        }

        return(
          (a.sort_order || 0)-
          (b.sort_order || 0)
        );

      }
    );

  const main=
    images[0]?.public_url || '';

  body.innerHTML=`

    ${
      main
        ? `
          <img
            id="igDetailMainV2"
            class="ig-v2-detail-main"
            src="${esc(main)}"
            alt="${esc(product.name)}">
        `
        : ''
    }

    <div class="ig-v2-gallery">

      ${
        images.map(
          (image,index)=>`

            <img
              class="${
                index===0
                  ? 'active'
                  : ''
              }"
              src="${esc(
                image.public_url || ''
              )}"
              alt=""
              data-main="${esc(
                image.public_url || ''
              )}">

          `
        ).join('')
      }

    </div>

    <p>
      ${esc(product.description || '')}
    </p>

    ${
      product.characteristics
        ? `
          <div class="characteristics">
            ${esc(
              product.characteristics
            )}
          </div>
        `
        : ''
    }

    <div class="ig-v2-detail-price">
      ${money(product.price)}
    </div>

    <button
      type="button"
      class="button full"
      ${
        product.available
          ? ''
          : 'disabled'
      }
      data-ig-add-detail>

      ${
        product.available
          ? '🛒 Agregar al carrito'
          : 'Agotado'
      }

    </button>

    <br><br>

    <button
      type="button"
      class="button secondary full"
      data-ig-share-detail>

      📤 Compartir producto

    </button>

  `;


  document
    .getElementById(
      'igDetailTitleV2'
    )
    .textContent=
      product.name;


  body
    .querySelectorAll(
      '[data-main]'
    )
    .forEach(image=>{

      image.addEventListener(
        'click',
        function(){

          const mainImage=
            document.getElementById(
              'igDetailMainV2'
            );

          if(mainImage){
            mainImage.src=
              image.dataset.main;
          }

          body
            .querySelectorAll(
              '[data-main]'
            )
            .forEach(
              item=>
                item.classList.remove(
                  'active'
                )
            );

          image.classList.add(
            'active'
          );

        }
      );

    });


  body
    .querySelector(
      '[data-ig-add-detail]'
    )
    ?.addEventListener(
      'click',
      function(){

        addToCart(id);

        modal.classList.remove(
          'open'
        );

      }
    );


  body
    .querySelector(
      '[data-ig-share-detail]'
    )
    ?.addEventListener(
      'click',
      function(){

        shareProduct(id);

      }
    );


  modal.classList.add(
    'open'
  );

}


function productUrl(id){

  const url=
    new URL(
      window.location.href
    );

  url.searchParams.set(
    'producto',
    id
  );

  return url.toString();

}


async function shareProduct(id){

  const product=
    products.find(
      p=>p.id===id
    ) ||
    (
      window.adminProducts ||
      []
    ).find(
      p=>p.id===id
    );

  if(!product){
    return;
  }

  const shareData={

    title:
      product.name,

    text:
      `🛍️ ${product.name} — International Gateway`,

    url:
      productUrl(product.id)

  };

  try{

    if(navigator.share){

      await navigator.share(
        shareData
      );

    }else{

      await navigator.clipboard
        .writeText(
          shareData.url
        );

      toast(
        '📋 Enlace del producto copiado'
      );

    }

  }catch(error){

    if(
      error?.name===
      'AbortError'
    ){
      return;
    }

    try{

      await navigator.clipboard
        .writeText(
          shareData.url
        );

      toast(
        '📋 Enlace del producto copiado'
      );

    }catch(_){}

  }

}

async function loadSlides(){

  const {
    data,
    error
  }=
    await supabaseClient
      .from('ig_home_slides')
      .select(`
        id,
        title,
        subtitle,
        button_text,
        button_target,
        image_url,
        storage_path,
        active,
        sort_order
      `)
      .eq(
        'active',
        true
      )
      .order(
        'sort_order',
        {ascending:true}
      );

  if(error){

    console.error(
      'IG portada',
      error
    );

    return;
  }

  slides=data || [];

  renderSlides();

}


function renderSlides(){

  const box=
    document.getElementById(
      'igSlidesV2'
    );

  const dots=
    document.getElementById(
      'igSlideDotsV2'
    );

  if(!box || !dots){
    return;
  }

  if(!slides.length){

    box.innerHTML='';
    dots.innerHTML='';

    return;

  }

  if(
    currentSlide>=
    slides.length
  ){

    currentSlide=0;

  }

  box.innerHTML=
    slides.map(
      (slide,index)=>`

        <div
          class="
            ig-v2-slide
            ${
              index===currentSlide
                ? 'active'
                : ''
            }
          "
          style="
            background-image:
              url('${esc(
                slide.image_url
              )}')
          ">

          <div
            class="ig-v2-slide-content">

            ${
              slide.title
                ? `
                  <h2>
                    ${esc(slide.title)}
                  </h2>
                `
                : ''
            }

            ${
              slide.subtitle
                ? `
                  <p>
                    ${esc(
                      slide.subtitle
                    )}
                  </p>
                `
                : ''
            }

            ${
              slide.button_text
                ? `
                  <button
                    type="button"
                    class="button"
                    data-slide-target="${
                      esc(
                        slide.button_target ||
                        'products'
                      )
                    }">

                    ${esc(
                      slide.button_text
                    )}

                  </button>
                `
                : ''
            }

          </div>

        </div>

      `
    ).join('');


  dots.innerHTML=
    slides.map(
      (_,index)=>`

        <button
          type="button"
          class="
            ig-v2-dot
            ${
              index===currentSlide
                ? 'active'
                : ''
            }
          "
          data-slide-dot="${index}"
          aria-label="
            Diapositiva ${index+1}
          ">
        </button>

      `
    ).join('');


  box
    .querySelectorAll(
      '[data-slide-target]'
    )
    .forEach(button=>{

      button.addEventListener(
        'click',
        function(){

          const target=
            button.dataset.slideTarget;

          if(
            target.startsWith(
              'http'
            )
          ){

            window.open(
              target,
              '_blank',
              'noopener'
            );

          }else{

            document
              .getElementById(
                'productsSection'
              )
              ?.scrollIntoView({
                behavior:'smooth'
              });

          }

        }
      );

    });


  dots
    .querySelectorAll(
      '[data-slide-dot]'
    )
    .forEach(button=>{

      button.addEventListener(
        'click',
        function(){

          currentSlide=
            Number(
              button.dataset.slideDot
            );

          renderSlides();

          startSlideTimer();

        }
      );

    });

}


function startSlideTimer(){

  clearInterval(
    slideTimer
  );

  if(
    slides.length<2
  ){
    return;
  }

  slideTimer=
    setInterval(
      function(){

        currentSlide=
          (
            currentSlide+1
          )%
          slides.length;

        renderSlides();

      },
      5000
    );

}

async function seedCategories(){

    error
  }=
    await supabaseClient
      .from('ig_categories')
      .select('slug');

    toast(
      error.message
    );

    return;

  }

  const have=
    new Set(
      (existing || [])
        .map(
          item=>item.slug
        )
    );


  const rows=
    CATEGORIES
      .filter(
        category=>
          !have.has(
            category[1]
          )
      )
      .map(
        (category,index)=>({

          name:category[0],

          slug:category[1],

          icon:category[2],

async function saveSlide(event){

  event.preventDefault();

  const file=
    document
      .getElementById(
        'igSlideFile'
      )
      .files[0];

  if(!file){

    toast(
      'Seleccioná una imagen.'
    );

    return;

  }


  const safe=
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      '-'
    );


  const path=
    `home-slides/${Date.now()}-${safe}`;


  try{

    const upload=
      await supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .upload(
          path,
          file,
          {
            cacheControl:'3600',
            upsert:false
          }
        );


    if(upload.error){
      throw upload.error;
    }


    const publicUrl=
      supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .getPublicUrl(
          path
        )
        .data
        .publicUrl;


    const {
      data:last
    }=
      await supabaseClient
        .from(
          'ig_home_slides'
        )
        .select(
          'sort_order'
        )
        .order(
          'sort_order',
          {
            ascending:false
          }
        )
        .limit(1);


    const order=
      (
        last?.[0]?.sort_order ||
        0
      )+1;


    const {
      error
    }=
      await supabaseClient
        .from(
          'ig_home_slides'
        )
        .insert({

          title:
            document
              .getElementById(
                'igSlideTitle'
              )
              .value
              .trim() ||
            null,

          subtitle:
            document
              .getElementById(
                'igSlideSubtitle'
              )
              .value
              .trim() ||
            null,

          button_text:
            document
              .getElementById(
                'igSlideButton'
              )
              .value
              .trim() ||
            null,

          button_target:
            document
              .getElementById(
                'igSlideTarget'
              )
              .value
              .trim() ||
            'products',

          image_url:
            publicUrl,

          storage_path:
            path,

          active:true,

          sort_order:
            order

        });


    if(error){
      throw error;
    }


    document
      .getElementById(
        'igSlideForm'
      )
      .reset();


    await loadAdminSlides();

    await loadSlides();

    startSlideTimer();


    toast(
      'Diapositiva agregada.'
    );


  }catch(error){

    console.error(
      error
    );

    toast(
      error.message ||
      'No se pudo guardar la diapositiva.'
    );

  }

}

  if(

      '¿Eliminar esta diapositiva?'
    )
  ){
    return;
  }


  try{

    if(path){

      await supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .remove(
          [path]
        );

    }


    const {
      error
    }=
      await supabaseClient
        .from(
          'ig_home_slides'
        )
        .delete()
        .eq(
          'id',
          id
        );


    if(error){
      throw error;
    }


    await loadAdminSlides();

    await loadSlides();

    startSlideTimer();


    toast(
      'Diapositiva eliminada.'
    );


  }catch(error){

    toast(
      error.message ||
      'No se pudo eliminar.'
    );

  }

}


/* =========================================================
   INTEGRACIÓN CON EL ADMINISTRADOR EXISTENTE
   ========================================================= */

const originalShowAdminSection=
  window.showAdminSection;


if(
  typeof originalShowAdminSection===
  'function'
){

  window.showAdminSection=
    function(section){

      originalShowAdminSection(
        section
      );

      if(
        section==='home'
      ){

        loadAdminHome();

      }

    };

}


/* =========================================================
   ARRANQUE
   ========================================================= */

async function boot(){

  injectStyles();

  injectPublicUI();


  const originalShowStore=
    window.showStore;


  if(
    typeof originalShowStore===
    'function'
  ){

    window.showStore=
      function(){

        originalShowStore();

        renderCategories();

        renderSlides();

      };

  }


  await Promise.all([
    loadCategories(),
    loadSlides()
  ]);


  startSlideTimer();


  if(
    typeof window.renderProducts===
    'function'
  ){

    decorateProducts();

  }


  const params=
    new URLSearchParams(
      window.location.search
    );

  const productId=
    params.get(
      'producto'
    );


  if(productId){

    setTimeout(
      function(){

        openProductDetail(
          productId
        );

      },
      700
    );

  }

}


boot();

})();
</script>
</body>
</html>
