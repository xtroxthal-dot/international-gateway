  <!-- =========================================================
     INTERNATIONAL GATEWAY
     REPARACIÓN DEFINITIVA:
     CONFIRMAR COTIZACIÓN → NOTIFICACIÓN DEL CLIENTE
     
     V2 — independiente
     No modifica checkout, carrito, productos ni cuentas.
     ========================================================= --><script>
(function () {
  "use strict";

  if (window.__IG_SHIPPING_NOTIFICATION_BRIDGE_V2) return;
  window.__IG_SHIPPING_NOTIFICATION_BRIDGE_V2 = true;

  const processedClicks = new Set();

  function money(value) {
    const number = Number(value) || 0;

    try {
      return number.toLocaleString("es-AR", {
        style: "currency",
        currency: "ARS",
        minimumFractionDigits: 2
      });
    } catch (error) {
      return "$ " + number.toFixed(2);
    }
  }

  function extraerDatosBoton(button) {
    if (!button) return null;

    const onclick =
      button.getAttribute("onclick") || "";

    /*
     * Busca:
     * igConfirmShipping('ORDER_ID','QUOTE_ID')
     */
    const match = onclick.match(
      /igConfirmShipping\s*\s*['"]([^'"]+)['"]\s*,\s*['"]([^'"]+)['"]\s*/i
    );

    if (!match) return null;

    return {
      orderId: match[1],
      quoteId: match[2]
    };
  }

  async function crearNotificacion(orderId, quoteId) {
    try {
      if (!orderId || !quoteId) return;

      if (
        typeof supabaseClient === "undefined" ||
        !supabaseClient
      ) {
        console.warn(
          "IG Notificaciones: Supabase no disponible."
        );
        return;
      }

      /*
       * Esperamos a que el administrador termine
       * de guardar la cotización.
       */
      await new Promise(function (resolve) {
        setTimeout(resolve, 1800);
      });

      const quoteResult =
        await supabaseClient
          .from("ig_shipping_quotes")
          .select(
            "shipping_cost,status,order_id"
          )
          .eq("id", quoteId)
          .eq("order_id", orderId)
          .maybeSingle();

      if (quoteResult.error) {
        console.error(
          "IG Notificaciones: error leyendo cotización:",
          quoteResult.error
        );
        return;
      }

      const quote = quoteResult.data;

      if (!quote) {
        console.warn(
          "IG Notificaciones: no se encontró la cotización."
        );
        return;
      }

      /*
       * Solo notificamos cuando realmente está confirmada.
       */
      if (quote.status !== "quoted") {
        console.warn(
          "IG Notificaciones: la cotización todavía no está confirmada."
        );
        return;
      }

      const cost =
        Number(quote.shipping_cost) || 0;

      const title =
        "🚚 Cotización de envío disponible";

      const message =
        cost > 0
          ? "El administrador confirmó el costo de envío de tu pedido: " +
            money(cost) +
            ". Puedes consultar los detalles desde Mi cuenta."
          : "El administrador actualizó la cotización de envío de tu pedido. " +
            "Puedes consultar los detalles desde Mi cuenta.";

      const notificationResult =
        await supabaseClient.rpc(
          "ig_notify_customer_order_update",
          {
            p_order_id: orderId,
            p_title: title,
            p_message: message,
            p_type: "shipping_quote"
          }
        );

      if (notificationResult.error) {
        console.error(
          "IG Notificaciones: error creando aviso:",
          notificationResult.error
        );
        return;
      }

      console.log(
        "IG Notificaciones: aviso creado correctamente.",
        notificationResult.data
      );

    } catch (error) {
      console.error(
        "IG Notificaciones: error inesperado:",
        error
      );
    }
  }

  /*
   * Capturamos directamente los clics del administrador.
   *
   * Esto funciona aunque la función original haya sido
   * definida por otro script.
   */
  document.addEventListener(
    "click",
    function (event) {

      const button =
        event.target.closest(
          'button[onclick*="igConfirmShipping"]'
        );

      if (!button) return;

      const data =
        extraerDatosBoton(button);

      if (!data) return;

      const clickKey =
        data.orderId +
        "|" +
        data.quoteId +
        "|" +
        Date.now();

      /*
       * Evita dobles ejecuciones accidentales
       * en el mismo instante.
       */
      if (processedClicks.has(clickKey)) {
        return;
      }

      processedClicks.add(clickKey);

      /*
       * Limpiamos memoria después de unos segundos.
       */
      setTimeout(function () {
        processedClicks.delete(clickKey);
      }, 10000);

      /*
       * Dejamos que el código original del administrador
       * haga su trabajo primero.
       */
      setTimeout(function () {
        crearNotificacion(
          data.orderId,
          data.quoteId
        );
      }, 2200);

    },
    true
  );

  console.log(
    "International Gateway: puente V2 de cotizaciones → campanita activo."
  );

})();
</script><!-- FIN REPARACIÓN V2 -->

<script id="igProductGalleryFinalScript">
(function(){
  "use strict";

  if(window.__IG_PRODUCT_GALLERY_FINAL_V2) return;
  window.__IG_PRODUCT_GALLERY_FINAL_V2 = true;

  let overlay = null;
  let mainImage = null;
  let titleElement = null;
  let counterElement = null;
  let thumbsElement = null;
  let messageElement = null;

  let images = [];
  let currentIndex = 0;
  let currentProductId = null;
  let currentProductName = "";

  function getProductId(card){
    if(!card) return null;

    const elements = card.querySelectorAll("[onclick]");

    for(const element of elements){
      const onclick = element.getAttribute("onclick") || "";

      const match = onclick.match(
        /addToCart\s*\(\s*['"]([^'"]+)['"]\s*\)/
      );

      if(match && match[1]){
        return match[1];
      }
    }

    return null;
  }

  function getProductName(card){
    if(!card) return "";

    const selectors = [
      ".product-name",
      ".product-title",
      "h3",
      "h4"
    ];

    for(const selector of selectors){
      const element = card.querySelector(selector);

      if(element && element.textContent.trim()){
        return element.textContent.trim();
      }
    }

    return "";
  }

  function createOverlay(){
    if(document.getElementById("igProductGalleryOverlay")){
      overlay = document.getElementById("igProductGalleryOverlay");
      mainImage = document.getElementById("igProductGalleryMain");
      titleElement = document.getElementById("igProductGalleryTitle");
      counterElement = document.getElementById("igProductGalleryCounter");
      thumbsElement = document.getElementById("igProductGalleryThumbs");
      messageElement = document.getElementById("igProductGalleryMessage");
      return;
    }

    overlay = document.createElement("div");
    overlay.id = "igProductGalleryOverlay";
    overlay.setAttribute("role","dialog");
    overlay.setAttribute("aria-modal","true");
    overlay.setAttribute("aria-label","Galería de imágenes del producto");

    overlay.innerHTML = `
      <div id="igProductGalleryBox">

        <button
          id="igProductGalleryClose"
          type="button"
          aria-label="Cerrar galería"
          title="Cerrar">
          ×
        </button>

        <div id="igProductGalleryTitle"></div>

        <div id="igProductGalleryMainWrap">

          <button
            id="igProductGalleryPrev"
            class="ig-gallery-control"
            type="button"
            aria-label="Foto anterior"
            title="Foto anterior">
            ‹
          </button>

          <img
            id="igProductGalleryMain"
            alt=""
            draggable="false">

          <button
            id="igProductGalleryNext"
            class="ig-gallery-control"
            type="button"
            aria-label="Foto siguiente"
            title="Foto siguiente">
            ›
          </button>

          <div id="igProductGalleryMessage"></div>
        </div>

        <div id="igProductGalleryCounter"></div>

        <div id="igProductGalleryThumbs"></div>

      </div>
    `;

    document.body.appendChild(overlay);

    mainImage = document.getElementById("igProductGalleryMain");
    titleElement = document.getElementById("igProductGalleryTitle");
    counterElement = document.getElementById("igProductGalleryCounter");
    thumbsElement = document.getElementById("igProductGalleryThumbs");
    messageElement = document.getElementById("igProductGalleryMessage");

    document
      .getElementById("igProductGalleryClose")
      .addEventListener("click", closeGallery);

    document
      .getElementById("igProductGalleryPrev")
      .addEventListener("click", function(event){
        event.stopPropagation();
        showPrevious();
      });

    document
      .getElementById("igProductGalleryNext")
      .addEventListener("click", function(event){
        event.stopPropagation();
        showNext();
      });

    overlay.addEventListener("click",function(event){
      if(event.target === overlay){
        closeGallery();
      }
    });
  }

  function setLoadingState(){
    mainImage.style.display = "none";
    messageElement.style.display = "block";
    messageElement.textContent = "Cargando fotos…";

    thumbsElement.innerHTML = "";
    counterElement.textContent = "";
  }

  function showError(){
    mainImage.style.display = "none";
    messageElement.style.display = "block";
    messageElement.textContent =
      "No se pudieron cargar las fotos de este producto.";

    thumbsElement.innerHTML = "";
    counterElement.textContent = "";
  }

  function renderGallery(){
    if(!images.length){
      showError();
      return;
    }

    messageElement.style.display = "none";
    mainImage.style.display = "block";

    if(currentIndex < 0) currentIndex = images.length - 1;
    if(currentIndex >= images.length) currentIndex = 0;

    const image = images[currentIndex];

    mainImage.src = image.url;
    mainImage.alt =
      currentProductName
        ? currentProductName + " - foto " + (currentIndex + 1)
        : "Foto del producto";

    counterElement.textContent =
      (currentIndex + 1) + " / " + images.length;

    thumbsElement.innerHTML = "";

    images.forEach(function(item,index){
      const button = document.createElement("button");

      button.type = "button";
      button.className = "ig-gallery-thumb";

      if(index === currentIndex){
        button.classList.add("ig-gallery-active");
      }

      button.setAttribute(
        "aria-label",
        "Ver foto " + (index + 1)
      );

      const img = document.createElement("img");
      img.src = item.url;
      img.alt = "";

      button.appendChild(img);

      button.addEventListener("click",function(event){
        event.stopPropagation();
        currentIndex = index;
        renderGallery();
      });

      thumbsElement.appendChild(button);
    });

    const prev =
      document.getElementById("igProductGalleryPrev");

    const next =
      document.getElementById("igProductGalleryNext");

    const multiple = images.length > 1;

    prev.style.display = multiple ? "block" : "none";
    next.style.display = multiple ? "block" : "none";

    requestAnimationFrame(function(){
      const active =
        thumbsElement.querySelector(".ig-gallery-active");

      if(active){
        active.scrollIntoView({
          behavior:"smooth",
          block:"nearest",
          inline:"center"
        });
      }
    });
  }

  async function loadProductImages(productId){
    if(
      typeof supabaseClient === "undefined" ||
      !supabaseClient ||
      typeof supabaseClient.from !== "function"
    ){
      throw new Error("Supabase no disponible.");
    }

    /*
      ESTRUCTURA REAL DE ig_product_images:

      product_id
      public_url
      is_primary
      sort_order
    */

    const result =
      await supabaseClient
        .from("ig_product_images")
        .select("product_id,public_url,is_primary,sort_order")
        .eq("product_id",productId)
        .order("sort_order",{ascending:true});

    if(result.error){
      console.error(
        "International Gateway — error cargando imágenes:",
        result.error
      );

      throw result.error;
    }

    const rows = Array.isArray(result.data)
      ? result.data
      : [];

    /*
      La imagen principal va primero.
      Después se respeta sort_order.
    */
    rows.sort(function(a,b){
      const primaryA = a.is_primary === true ? 0 : 1;
      const primaryB = b.is_primary === true ? 0 : 1;

      if(primaryA !== primaryB){
        return primaryA - primaryB;
      }

      return Number(a.sort_order || 0) -
             Number(b.sort_order || 0);
    });

    /*
      Eliminamos URLs repetidas para que
      una misma foto no aparezca dos veces.
    */
    const seen = new Set();

    images = rows
      .map(function(row){
        return String(row.public_url || "").trim();
      })
      .filter(function(url){
        if(!url || seen.has(url)) return false;

        seen.add(url);
        return true;
      })
      .map(function(url){
        return {url:url};
      });

    if(!images.length){
      throw new Error("Este producto no tiene imágenes.");
    }
  }

  async function openGallery(productId,productName){
    if(!productId) return;

    createOverlay();

    currentProductId = productId;
    currentProductName = productName || "";
    currentIndex = 0;
    images = [];

    titleElement.textContent = currentProductName;

    overlay.classList.add("ig-gallery-open");

    document.body.style.overflow = "hidden";

    setLoadingState();

    try{
      await loadProductImages(productId);
      renderGallery();
    }catch(error){
      console.error(
        "International Gateway — galería:",
        error
      );

      showError();
    }
  }

  function closeGallery(){
    if(!overlay) return;

    overlay.classList.remove("ig-gallery-open");

    document.body.style.overflow = "";

    if(mainImage){
      mainImage.removeAttribute("src");
    }

    currentProductId = null;
    currentProductName = "";
    images = [];
    currentIndex = 0;
  }

  function showPrevious(){
    if(images.length < 2) return;

    currentIndex--;

    if(currentIndex < 0){
      currentIndex = images.length - 1;
    }

    renderGallery();
  }

  function showNext(){
    if(images.length < 2) return;

    currentIndex++;

    if(currentIndex >= images.length){
      currentIndex = 0;
    }

    renderGallery();
  }

  function handleKeyboard(event){
    if(!overlay || !overlay.classList.contains("ig-gallery-open")){
      return;
    }

    if(event.key === "Escape"){
      event.preventDefault();
      closeGallery();
      return;
    }

    if(event.key === "ArrowLeft"){
      event.preventDefault();
      showPrevious();
      return;
    }

    if(event.key === "ArrowRight"){
      event.preventDefault();
      showNext();
    }
  }

  document.addEventListener("keydown",handleKeyboard);

  function activateCard(card){
    if(!card || card.dataset.igGalleryActivated === "1"){
      return;
    }

    const productId = getProductId(card);

    if(!productId){
      return;
    }

    const imageContainer =
      card.querySelector(".product-image");

    if(!imageContainer){
      return;
    }

    const image =
      imageContainer.tagName === "IMG"
        ? imageContainer
        : imageContainer.querySelector("img");

    if(!image){
      return;
    }

    card.dataset.igGalleryActivated = "1";

    imageContainer.style.cursor = "zoom-in";
    imageContainer.setAttribute(
      "role",
      "button"
    );
    imageContainer.setAttribute(
      "tabindex",
      "0"
    );
    imageContainer.setAttribute(
      "aria-label",
      "Ver fotos del producto"
    );

    function open(event){
      /*
        Evita que un clic en otros elementos
        de la tarjeta sea afectado.
      */
      if(
        event.target &&
        event.target.closest &&
        event.target.closest("button,a,input,select,textarea")
      ){
        return;
      }

      event.preventDefault();
      event.stopPropagation();

      openGallery(
        productId,
        getProductName(card)
      );
    }

    imageContainer.addEventListener("click",open);

    imageContainer.addEventListener(
      "keydown",
      function(event){
        if(
          event.key === "Enter" ||
          event.key === " "
        ){
          open(event);
        }
      }
    );
  }

  function scanCards(){
    const cards =
      document.querySelectorAll(".product-card");

    cards.forEach(activateCard);
  }

  function start(){
    createOverlay();
    scanCards();

    /*
      Los productos se renderizan dinámicamente,
      por eso observamos cambios sin tocar
      ninguna función existente.
    */
    const observer =
      new MutationObserver(function(){
        scanCards();
      });

    observer.observe(
      document.body,
      {
        childList:true,
        subtree:true
      }
    );
  }

  if(document.readyState === "loading"){
    document.addEventListener(
      "DOMContentLoaded",
      start,
      {once:true}
    );
  }else{
    start();
  }

})();
</script>

<script>
(function () {
  'use strict';

  console.log('🌐 International Gateway: parche de compartir cargado');

  function getProductId(product) {
    return product?.id ||
           product?.product_id ||
           product?.producto_id ||
           null;
  }

  function getProductName(product, card) {
    return product?.name ||
           product?.nombre ||
           product?.title ||
           product?.titulo ||
           card?.querySelector('[data-product-name]')?.textContent?.trim() ||
           card?.querySelector('.product-name')?.textContent?.trim() ||
           card?.querySelector('h2,h3,h4')?.textContent?.trim() ||
           'Producto';
  }

  function getProductPrice(product, card) {
    const price =
      product?.price ??
      product?.precio ??
      product?.sale_price ??
      product?.precio_venta;

    if (price !== undefined && price !== null && price !== '') {
      return price;
    }

    const priceEl =
      card?.querySelector('[data-product-price]') ||
      card?.querySelector('.product-price') ||
      card?.querySelector('.price');

    return priceEl?.textContent?.trim() || '';
  }

  function getProductDescription(product, card) {
    return product?.description ||
           product?.descripcion ||
           card?.querySelector('[data-product-description]')?.textContent?.trim() ||
           card?.querySelector('.product-description')?.textContent?.trim() ||
           '';
  }

  function getProductImage(product, card) {
    let image =
      product?.image_url ||
      product?.image ||
      product?.imagen ||
      product?.photo ||
      product?.foto;

    if (!image && Array.isArray(product?.ig_product_images)) {
      const first = product.ig_product_images[0];

      if (typeof first === 'string') {
        image = first;
      } else if (first) {
        image = first.image_url || first.url || first.image || first.imagen;
      }
    }

    if (!image && card) {
      image =
        card.querySelector('img[data-product-image]')?.src ||
        card.querySelector('img')?.src ||
        '';
    }

    return image || '';
  }

  function findProduct(productId, card) {
    const possibleArrays = [
      window.products,
      window.productos,
      window.allProducts,
      window.allProductsData,
      window.igProducts,
      window.IG_PRODUCTS
    ];

    for (const arr of possibleArrays) {
      if (Array.isArray(arr)) {
        const found = arr.find(p => String(getProductId(p)) === String(productId));
        if (found) return found;
      }
    }

    return {
      id: productId
    };
  }

  function getCardProductId(card) {
    return card?.dataset?.productId ||
           card?.dataset?.id ||
           card?.getAttribute('data-product-id') ||
           card?.getAttribute('data-id') ||
           card?.querySelector('[data-product-id]')?.getAttribute('data-product-id') ||
           null;
  }

  function absoluteUrl(url) {
    if (!url) return '';
    try {
      return new URL(url, window.location.href).href;
    } catch {
      return url;
    }
  }

  async function imageToFile(imageUrl, productName) {
    if (!imageUrl) return null;

    try {
      const response = await fetch(imageUrl, {
        mode: 'cors',
        cache: 'no-cache'
      });

      if (!response.ok) return null;

      const blob = await response.blob();

      if (!blob.type.startsWith('image/')) return null;

      let extension = 'jpg';

      if (blob.type.includes('png')) extension = 'png';
      else if (blob.type.includes('webp')) extension = 'webp';
      else if (blob.type.includes('gif')) extension = 'gif';
      else if (blob.type.includes('jpeg')) extension = 'jpg';

      const safeName = String(productName || 'producto')
        .replace(/[^\w\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .substring(0, 60);

      return new File(
        [blob],
        `${safeName || 'producto'}.${extension}`,
        { type: blob.type }
      );

    } catch (error) {
      console.warn('No se pudo obtener la imagen para compartir:', error);
      return null;
    }
  }

  async function shareInternationalGatewayProduct(product, card) {

    const productId = getProductId(product) || getCardProductId(card);

    if (!productId) {
      alert('No se pudo identificar este producto.');
      return;
    }

    const realProduct =
      findProduct(productId, card) || product || {};

    const name = getProductName(realProduct, card);
    const price = getProductPrice(realProduct, card);
    const description = getProductDescription(realProduct, card);
    const imageUrl = absoluteUrl(getProductImage(realProduct, card));

    const productUrl = new URL(
      window.location.href
    );

    productUrl.searchParams.set('producto', productId);

    /*
     * Quitamos posibles parámetros antiguos para que
     * el enlace quede limpio.
     */
    productUrl.hash = '';

    const directLink = productUrl.href;

    let shareText =
      `🌐 International Gateway\n\n` +
      `🛍️ ${name}\n`;

    if (price) {
      shareText += `💰 Precio: ${price}\n`;
    }

    if (description) {
      shareText += `\n${description}\n`;
    }

    shareText +=
      `\n🔗 Ver producto:\n${directLink}`;

    /*
     * Intentamos obtener la foto.
     */
    const imageFile = await imageToFile(imageUrl, name);

    /*
     * COMPARTIR NATIVO:
     * Android podrá mostrar la foto + texto + enlace
     * cuando la aplicación destino lo soporte.
     */
    if (navigator.share) {

      try {

        if (
          imageFile &&
          navigator.canShare &&
          navigator.canShare({ files: [imageFile] })
        ) {

          await navigator.share({
            files: [imageFile],
            title: name,
            text: shareText
          });

          return;
        }

      } catch (error) {

        if (error?.name === 'AbortError') {
          return;
        }

        console.warn(
          'Compartir con imagen no disponible:',
          error
        );
      }

      /*
       * Segundo intento: texto + enlace.
       */
      try {

        await navigator.share({
          title: name,
          text: shareText,
          url: directLink
        });

        return;

      } catch (error) {

        if (error?.name === 'AbortError') {
          return;
        }
      }
    }

    /*
     * RESPALDO PARA WHATSAPP.
     */
    const whatsappUrl =
      'https://wa.me/?text=' +
      encodeURIComponent(shareText);

    window.open(
      whatsappUrl,
      '_blank',
      'noopener,noreferrer'
    );
  }

  /*
   * Exponemos la función para que también pueda ser llamada
   * desde otros módulos de International Gateway.
   */
  window.igShareProductWithPhoto = shareInternationalGatewayProduct;

  /*
   * Detectamos botones de compartir aunque el producto
   * haya sido creado dinámicamente.
   */
  document.addEventListener(
    'click',
    function (event) {

      const button = event.target.closest(
        '[data-share-product], ' +
        '.share-product, ' +
        '.ig-share-product, ' +
        '[data-action="share-product"]'
      );

      if (!button) return;

      /*
       * Si el botón pertenece a otro sistema que ya gestiona
       * explícitamente el evento, no interferimos.
       */
      if (
        button.dataset.igShareHandled === 'true'
      ) {
        return;
      }

      const card =
        button.closest(
          '[data-product-id], ' +
          '[data-id], ' +
          '.product-card, ' +
          '.product, ' +
          'article'
        );

      const productId =
        button.dataset.productId ||
        button.getAttribute('data-product-id') ||
        getCardProductId(card);

      if (!productId) return;

      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();

      button.dataset.igShareHandled = 'true';

      const product = findProduct(productId, card);

      shareInternationalGatewayProduct(
        product,
        card
      );
    },
    true
  );

  /*
   * Compatibilidad con llamadas existentes:
   * si el código antiguo llama igShareProduct(product),
   * esta versión mejorada se utiliza también.
   */
  const oldShareProduct = window.igShareProduct;

  window.igShareProduct = function (product) {

    if (product) {
      return shareInternationalGatewayProduct(product, null);
    }

    if (typeof oldShareProduct === 'function') {
      return oldShareProduct.apply(this, arguments);
    }
  };

})();

  function prepareAdminCategory() {

    const input =
      document.getElementById("productCategory");

    if (!input) return;

    /*
     * Si ya lo convertimos, no hacemos nada.
     */

    if (
      input.tagName === "SELECT" &&
      input.dataset.igGranjaReady === "1"
    ) {
      return;
    }

    /*
     * Guardamos el valor actual.
     */

    const currentValue =
      String(input.value || "").trim();

    /*
     * Creamos un SELECT manteniendo
     * exactamente el mismo ID.
     */

    const select =
      document.createElement("select");

    select.id = "productCategory";
    select.className = input.className || "";
    select.dataset.igGranjaReady = "1";

    const categories = [
  "",
  "Granja lo de Nico",
  "Pharmacy"
];

    /*
     * Importante:
     * no eliminamos las categorías existentes.
     * Las obtenemos de los productos ya cargados.
     */

    const existingCategories = new Set();

    const arrays = [
      window.products,
      window.adminProducts
    ];

    arrays.forEach(function (array) {

      if (!Array.isArray(array)) return;

      array.forEach(function (product) {

        const category =
          String(product?.category || "").trim();

        if (category) {
          existingCategories.add(category);
        }

      });

    });

    existingCategories.forEach(function (category) {

      if (
        category &&
        !categories.includes(category)
      ) {
        categories.push(category);
      }

    });

    categories.forEach(function (category) {

      const option =
        document.createElement("option");

      option.value = category;

      option.textContent =
        category ||
        "Sin categoría";

      select.appendChild(option);

    });

    select.value =
      categories.includes(currentValue)
        ? currentValue
        : currentValue;

    /*
     * Si existe una categoría antigua que todavía
     * no apareció en products/adminProducts,
     * la conservamos.
     */

    if (
      currentValue &&
      !categories.includes(currentValue)
    ) {

      const option =
        document.createElement("option");

      option.value = currentValue;
      option.textContent = currentValue;

      select.appendChild(option);

      select.value = currentValue;
    }

    input.replaceWith(select);

    if (
      currentValue === GRANJA_CATEGORY
    ) {
      select.classList.add(
        "ig-granja-category"
      );
    }

  }


  /* =========================================================

  function createGranjaInterface() {

    const productsContainer =
      document.getElementById(
        "productsContainer"
      );

    if (!productsContainer) return;

    /*
     * Buscamos la sección que contiene
     * el listado de productos.
     */

    const productsSection =
      productsContainer.closest(
        ".section"
      );

    if (!productsSection) return;

    /*

     */

    if (

        "igGranjaCategorySection"

    ) {
      return;

    const section =

    section.id =
      "igGranjaCategorySection";

    section.className =

    section.innerHTML = `

  function renderFilteredProducts() {

    const container =
      document.getElementById(
        "productsContainer"
      );

    if (!container) return;

    const source =
      Array.isArray(window.products)
        ? window.products
        : [];

    let list = source;

    if (currentGranjaFilter) {

      list =
        source.filter(function (product) {

          return String(
            product?.category || ""
          ).trim().toLowerCase()
            === GRANJA_CATEGORY.toLowerCase();

        });

    }

    if (!list.length) {

      container.innerHTML = `

    container.innerHTML =

        const imageHtml =

  function showGranjaProducts() {

    currentGranjaFilter = true;

    const filterBar =
      document.getElementById(
        "igGranjaFilterBar"
      );

    if (filterBar) {
      filterBar.classList.add(
        "ig-active"
      );
    }

    renderFilteredProducts();

    const productsContainer =
      document.getElementById(
        "productsContainer"
      );

    if (productsContainer) {

      productsContainer.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }

  }


  function showAllProducts() {

    currentGranjaFilter = false;

    const filterBar =
      document.getElementById(
        "igGranjaFilterBar"
      );

    if (filterBar) {

      filterBar.classList.remove(
        "ig-active"
      );

    }

    /*
     * Usamos la función original para
     * conservar absolutamente todo
     * el comportamiento existente.
     */

    if (
      typeof window.renderProducts ===
      "function"
    ) {

      window.renderProducts();

    } else {

      renderFilteredProducts();

    }

    const productsContainer =
      document.getElementById(
        "productsContainer"
      );

    if (productsContainer) {

      productsContainer.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }

  }


  /*
   * Exponer funciones por si la aplicación
   * necesita llamarlas.
   */

  window.showGranjaProducts =
    showGranjaProducts;

  window.showAllProducts =
    showAllProducts;


  /* =========================================================
     REFORZAR RENDER DE PRODUCTOS
     ========================================================= */

  function patchRenderProducts() {

    if (
      typeof window.renderProducts !==
      "function"
    ) {
      return;
    }

    if (
      window.renderProducts.__igGranjaPatched
    ) {
      return;
    }

    const originalRenderProducts =
      window.renderProducts;

    function patchedRenderProducts() {

      /*
       * Si estamos dentro de Granja,
       * filtramos.
       */

      if (currentGranjaFilter) {

        renderFilteredProducts();

        return;

      }

      /*
       * Si estamos en la tienda normal,
       * dejamos trabajar a la función original.
       */

      originalRenderProducts.apply(
        this,
        arguments
      );

    }

    patchedRenderProducts.__igGranjaPatched =
      true;

    window.renderProducts =
      patchedRenderProducts;

  }


  /* =========================================================
     OBSERVADOR
     ========================================================= */

  function boot() {

    addStyles();

    prepareAdminCategory();

    createGranjaInterface();

    patchRenderProducts();

  }


  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      boot,
      { once: true }
    );

  } else {

    boot();

  }


  /*
   * El administrador y la tienda generan
   * contenido dinámicamente.
   */

  const observer =
    new MutationObserver(
      function () {

        prepareAdminCategory();

        createGranjaInterface();

        patchRenderProducts();

      }
    );

  function startObserver() {

    if (!document.body) return;

    observer.observe(
      document.body,
      {
        childList: true,
        subtree: true
      }
    );

  }

  startObserver();


  /*
   * También intentamos varias veces al inicio
   * para cubrir el render inicial de la aplicación.
   */

  setTimeout(boot, 250);
  setTimeout(boot, 700);
  setTimeout(boot, 1500);

})();

<script>
/* =========================================================
   REPARADOR DE PORTADA — GRADIENTE Y POSICIÓN
   ========================================================= */

(function(){

  "use strict";

  function repararPortadaGranja(){

    const card =
      document.getElementById(
        "igGranjaCategoryCard"
      );

    const image =
      card?.querySelector("img");

    const content =
      document.getElementById(
        "igGranjaCategoryContent"
      );

    if(!card || !image || !content){
      return;
    }

    /* Asegurar que la foto sea la portada */
    image.style.display = "block";

    /* Eliminar cualquier degradado anterior */
    card.style.background = "#000";

    /* El texto queda en la zona negra */
    content.style.background = "#000";

    /* Marcar como reparado */
    card.dataset.granjaCoverRepaired = "1";
  }


  /*
   * La categoría se genera dinámicamente,
   * por eso esperamos a que exista.
   */

  function iniciar(){

    repararPortadaGranja();

    setTimeout(
      repararPortadaGranja,
      300
    );

    setTimeout(
      repararPortadaGranja,
      800
    );

    setTimeout(
      repararPortadaGranja,
      1500
    );
  }


  if(
    document.readyState === "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      iniciar,
      {once:true}
    );

  }else{

    iniciar();

  }


  /*
   * Si la aplicación vuelve a generar
   * la portada, la reparación se aplica
   * nuevamente automáticamente.
   */

  const observer =
    new MutationObserver(function(){

      repararPortadaGranja();

    });


  function observar(){

    if(!document.body){
      return;
    }

    observer.observe(
      document.body,
      {
        childList:true,
        subtree:true
      }
    );

  }


  observar();

})();

</script>

<script>

(function(){

  "use strict";


  /* =========================================================
     CONFIGURACIÓN
     ========================================================= */

  const IBERIAN_CATEGORY =
    "Iberian Mediterránea";

  const IBERIAN_IMAGE =
    "https://raw.githubusercontent.com/xtroxthal-dot/international-gateway/main/file_000000005c60820e8dd46e40bf84e065.png";


  let iberianActive = false;


  /* =========================================================
     AÑADIR CATEGORÍA AL ADMINISTRADOR
     ========================================================= */

  function prepareIberianAdminCategory(){

    const input =
      document.getElementById(
        "productCategory"
      );

    if(!input){
      return;
    }


    /*
     * Si el sistema de Granja ya convirtió
     * el campo en SELECT, usamos ese mismo.
     */

    if(input.tagName === "SELECT"){

      if(
        !Array.from(
          input.options
        ).some(
          option =>
            option.value ===
            IBERIAN_CATEGORY
        )
      ){

        const option =
          document.createElement(
            "option"
          );

        option.value =
          IBERIAN_CATEGORY;

        option.textContent =
          IBERIAN_CATEGORY;

        input.appendChild(
          option
        );

      }

      return;
    }


    /*
     * Si todavía es el input original,
     * no lo reemplazamos.
     *
     * El administrador puede escribir
     * directamente la categoría.
     */

  }


  /* =========================================================
     CREAR PORTADA
     ========================================================= */

  function createIberianInterface(){

    const productsContainer =
      document.getElementById(
        "productsContainer"
      );

    if(!productsContainer){
      return;
    }


    const productsSection =
      productsContainer.closest(
        ".section"
      );

    if(!productsSection){
      return;
    }


    if(
      document.getElementById(
        "igIberianCategorySection"
      )
    ){
      return;
    }


    const section =
      document.createElement(
        "section"
      );

    section.id =
      "igIberianCategorySection";

    section.className =
      "section";


    section.innerHTML = `

      <div class="container">

        <div
          id="igIberianCategoryCard"
          role="button"
          tabindex="0"
          aria-label="Abrir Iberian Mediterránea">

          <img
            src="${IBERIAN_IMAGE}"
            alt="Iberian Mediterránea">

          <div
            id="igIberianCategoryContent">

            <div
              class="ig-iberian-kicker">

              Categoría especial

            </div>

            <h2>
              Iberian Mediterránea
            </h2>

            <p>
              Productos de Iberian Mediterránea
              en una sección independiente
              dentro de International Gateway.
            </p>

            <span
              id="igIberianCategoryButton">

              Ver productos →

            </span>

          </div>

        </div>

      </div>

    `;


    /*
     * La colocamos después de
     * Granja lo de Nico.
     */

    const granjaSection =
      document.getElementById(
        "igGranjaCategorySection"
      );


    if(granjaSection){

      granjaSection.parentNode.insertBefore(
        section,
        granjaSection.nextSibling
      );

    }else{

      productsSection.parentNode.insertBefore(
        section,
        productsSection
      );

    }


    const card =
      document.getElementById(
        "igIberianCategoryCard"
      );


    card.addEventListener(
      "click",
      showIberianProducts
    );


    card.addEventListener(
      "keydown",
      function(event){

        if(
          event.key === "Enter" ||
          event.key === " "
        ){

          event.preventDefault();

          showIberianProducts();

        }

      }
    );


    /*
     * Barra de navegación.
     */

    const filterBar =
      document.createElement(
        "div"
      );

    filterBar.id =
      "igIberianFilterBar";


    filterBar.innerHTML = `

      <span
        id="igIberianFilterTitle">

        Iberian Mediterránea

      </span>

      <button
        id="igIberianBackButton"
        type="button">

        ← Todos los productos

      </button>

    `;


    productsContainer.parentNode.insertBefore(
      filterBar,
      productsContainer
    );


    document
      .getElementById(
        "igIberianBackButton"
      )
      .addEventListener(
        "click",
        showAllIberianProducts
      );

  }


  /* =========================================================
     OBTENER PRODUCTOS
     ========================================================= */

  function getProducts(){

    if(
      Array.isArray(
        window.products
      )
    ){

      return window.products;

    }

    /*
     * Como respaldo, buscamos la variable
     * global disponible en la aplicación.
     */

    return [];

  }


  /* =========================================================
     ESCAPAR HTML
     ========================================================= */

  function escapeIberian(value){

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =========================================================
     DINERO
     ========================================================= */

  function moneyIberian(value){

    if(
      typeof window.money ===
      "function"
    ){

      return window.money(
        value
      );

    }

    return new Intl.NumberFormat(
      "es-AR",
      {
        style:"currency",
        currency:"ARS",
        maximumFractionDigits:2
      }
    ).format(
      Number(value || 0)
    );

  }


  /* =========================================================
     RENDER IBERIAN
     ========================================================= */

  function renderIberianProducts(){

    const container =
      document.getElementById(
        "productsContainer"
      );

    if(!container){
      return;
    }


    const products =
      getProducts();


    const list =
      products.filter(
        function(product){

          return String(
            product?.category || ""
          )
          .trim()
          .toLowerCase()
          ===
          IBERIAN_CATEGORY
            .toLowerCase();

        }
      );


    if(!list.length){

      container.innerHTML = `

        <div class="empty">

          <h3>
            Iberian Mediterránea todavía
            no tiene productos
          </h3>

          <p>
            Los productos de esta categoría
            aparecerán cuando sean agregados
            desde el administrador.
          </p>

        </div>

      `;

      return;

    }


    container.innerHTML =
      list.map(
        function(product){

          const image =
            (
              product.ig_product_images ||
              []
            )[0];


          const imageHtml =
            image?.public_url

              ? `

                <img
                  src="${escapeIberian(
                    image.public_url
                  )}"
                  alt="${escapeIberian(
                    product.name
                  )}">

              `

              : `

                <span>
                  Sin imagen
                </span>

              `;


          return `

            <article
              class="product-card">

              <div
                class="product-image">

                ${imageHtml}

              </div>


              <div
                class="product-content">

                ${
                  product.category
                    ? `

                      <div
                        class="product-category">

                        ${escapeIberian(
                          product.category
                        )}

                      </div>

                    `
                    : ""
                }


                <h3>

                  ${escapeIberian(
                    product.name
                  )}

                </h3>


                ${
                  product.description
                    ? `

                      <div
                        class="product-description">

                        ${escapeIberian(
                          product.description
                        )}

                      </div>

                    `
                    : ""
                }


                ${
                  product.characteristics
                    ? `

                      <div
                        class="characteristics">

                        ${escapeIberian(
                          product.characteristics
                        )}

                      </div>

                    `
                    : ""
                }


                <div class="price">

                  ${moneyIberian(
                    product.price
                  )}

                </div>


                <button
                  class="button full"
                  onclick="addToCart('${product.id}')"
                  ${
                    product.available
                      ? ""
                      : "disabled"
                  }>

                  ${
                    product.available
                      ? "Agregar al carrito"
                      : "Agotado"
                  }

                </button>

              </div>

            </article>

          `;

        }
      )
      .join("");

  }


  /* =========================================================
     MOSTRAR IBERIAN
     ========================================================= */

  function showIberianProducts(){

    iberianActive = true;


    const filterBar =
      document.getElementById(
        "igIberianFilterBar"
      );


    if(filterBar){

      filterBar.classList.add(
        "ig-iberian-active"
      );

    }


    renderIberianProducts();


    const container =
      document.getElementById(
        "productsContainer"
      );


    if(container){

      container.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    }

  }


  /* =========================================================
     VOLVER A TODOS
     ========================================================= */

  function showAllIberianProducts(){

    iberianActive = false;


    const filterBar =
      document.getElementById(
        "igIberianFilterBar"
      );


    if(filterBar){

      filterBar.classList.remove(
        "ig-iberian-active"
      );

    }


    /*
     * Dejamos que la aplicación original
     * vuelva a pintar todos los productos.
     */

    if(
      typeof window.renderProducts ===
      "function"
    ){

      window.renderProducts();

    }


    const container =
      document.getElementById(
        "productsContainer"
      );


    if(container){

      container.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    }

  }


  /* =========================================================
     EXPONER FUNCIONES
     ========================================================= */

  window.showIberianProducts =
    showIberianProducts;

  window.showAllIberianProducts =
    showAllIberianProducts;


  /* =========================================================
     REPARACIÓN DINÁMICA
     ========================================================= */

  function bootIberian(){

    prepareIberianAdminCategory();

    createIberianInterface();

  }


  if(
    document.readyState ===
    "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      bootIberian,
      {once:true}
    );

  }else{

    bootIberian();

  }


  /*
   * La app genera el administrador y
   * la tienda dinámicamente.
   */

  const observer =
    new MutationObserver(
      function(){

        prepareIberianAdminCategory();

        createIberianInterface();


        /*
         * Si estamos dentro de Iberian
         * y la aplicación actualiza productos,
         * volvemos a mostrar únicamente
         * esta categoría.
         */

        if(iberianActive){

          renderIberianProducts();

        }

      }
    );


  function startObserver(){

    if(!document.body){
      return;
    }


    observer.observe(
      document.body,
      {
        childList:true,
        subtree:true
      }
    );

  }


  startObserver();


  setTimeout(
    bootIberian,
    300
  );

  setTimeout(
    bootIberian,
    800
  );

  setTimeout(
    bootIberian,
    1500
  );


})();

</script>

  <script>
/*
 * INTERNATIONAL GATEWAY
 * Reparación del selector de categorías del Administrador
 *
 * Recupera las categorías originales y conserva:
 * - Granja lo de Nico
 * - Iberian Mediterránea
 *
 * No agrega "Sin categoría".
 * No modifica productos existentes.
 * No modifica imágenes.
 * No modifica el catálogo público.
 */

(function () {
    'use strict';

    const CATEGORIAS_INTERNATIONAL_GATEWAY = [
        { nombre: 'Hogar', emoji: '🏠' },
        { nombre: 'Cocina', emoji: '🍳' },
        { nombre: 'Limpieza', emoji: '🧹' },
        { nombre: 'Baño', emoji: '🛁' },
        { nombre: 'Jardín', emoji: '🪴' },
        { nombre: 'Herramientas', emoji: '🔧' },
        { nombre: 'Librería', emoji: '📚' },
        { nombre: 'Escolar', emoji: '🎒' },
        { nombre: 'Juguetes', emoji: '🧸' },
        { nombre: 'Regalería', emoji: '🎁' },
        { nombre: 'Perfumería y cuidado personal', emoji: '🧴' },
        { nombre: 'Textil y accesorios', emoji: '👕' },
        { nombre: 'Iluminación', emoji: '💡' },
        { nombre: 'Temporada', emoji: '🎄' },
        { nombre: 'Celulares', emoji: '📱' },
        { nombre: 'Electrónica', emoji: '💻' },
        { nombre: 'Electrodomésticos', emoji: '📺' },
        { nombre: 'Segunda mano', emoji: '♻️' },
        { nombre: 'Otros', emoji: '📦' },
        { nombre: 'Granja lo de Nico', emoji: '🐄' },
        { nombre: 'Iberian Mediterránea', emoji: '🇪🇸' },
{ nombre: 'Pharmacy', emoji: '💊' }
    ];

    const NORMALIZAR = texto =>
        String(texto || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .trim()
            .toLowerCase();

    const categoriasNormalizadas =
        CATEGORIAS_INTERNATIONAL_GATEWAY.map(c => NORMALIZAR(c.nombre));

    function esSelectorDeCategoriasDelAdmin(select) {
        if (!select || select.tagName !== 'SELECT') return false;

        const textos = Array.from(select.options)
            .map(option => NORMALIZAR(option.textContent));

        const tieneGranja = textos.includes(NORMALIZAR('Granja lo de Nico'));
        const tieneIberian = textos.includes(NORMALIZAR('Iberian Mediterránea'));
        const tieneSinCategoria = textos.includes(NORMALIZAR('Sin categoría'));

        /*
         * El selector problemático actual tiene las categorías
         * especiales que acabamos de añadir.
         */
        return tieneGranja || tieneIberian || tieneSinCategoria;
    }

    function repararSelector(select) {
        if (!esSelectorDeCategoriasDelAdmin(select)) return;

        // Evitar repararlo repetidamente.
        if (select.dataset.igCategoriasReparadas === 'true') return;

        const valorAnterior = select.value;

        const fragment = document.createDocumentFragment();

        CATEGORIAS_INTERNATIONAL_GATEWAY.forEach(categoria => {
            const option = document.createElement('option');

            /*
             * El value coincide con el nombre de la categoría,
             * que es el formato utilizado por los productos actuales.
             */
            option.value = categoria.nombre;
            option.textContent = categoria.emoji + ' ' + categoria.nombre;

            fragment.appendChild(option);
        });

        select.innerHTML = '';
        select.appendChild(fragment);

        /*
         * Si el producto que se estaba editando ya tenía una categoría,
         * intentamos conservarla.
         */
        const valorNormalizado = NORMALIZAR(valorAnterior);

        const opcionExistente = Array.from(select.options).find(
            option => NORMALIZAR(option.value) === valorNormalizado
        );

        if (opcionExistente) {
            select.value = opcionExistente.value;
        } else {
            select.selectedIndex = 0;
        }

        select.dataset.igCategoriasReparadas = 'true';

        /*
         * Disparamos change para que el código existente de International
         * Gateway pueda seguir trabajando normalmente.
         */
        select.dispatchEvent(new Event('change', {
            bubbles: true
        }));

        console.log(
            'International Gateway: selector de categorías reparado.',
            CATEGORIAS_INTERNATIONAL_GATEWAY.map(c => c.nombre)
        );
    }

    function buscarYReparar() {
        document.querySelectorAll('select').forEach(repararSelector);
    }

    /*
     * Primera comprobación.
     */
    buscarYReparar();

    /*
     * El administrador puede generarse dinámicamente.
     * Por eso observamos cambios en el DOM.
     */
    const observer = new MutationObserver(() => {
        buscarYReparar();
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true
    });

})();
</script>
<script>
/* ============================================================
   INTERNATIONAL GATEWAY
   REPARADOR DEFINITIVO DE CATEGORÍAS ESPECIALES

   Repara:
   - Granja lo de Nico
   - Iberian Mediterránea

   IMPORTANTE:
   - No crea productos.
   - No elimina productos.
   - No modifica imágenes.
   - No modifica precios.
   - No modifica el guardado en Supabase.
   - No modifica las categorías normales.
   - Usa los productos que ya carga la aplicación.
   ============================================================ */

(function () {
    "use strict";

    const GRANJA = "Granja lo de Nico";
    const IBERIAN = "Iberian Mediterránea";

    function normalizar(valor) {
        return String(valor || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim()
            .toLowerCase();
    }

    /*
     * ----------------------------------------------------------
     * OBTENER LA LISTA REAL DE PRODUCTOS
     * ----------------------------------------------------------
     *
     * La aplicación tiene:
     *
     *     let products = [];
     *
     * Por eso "window.products" no necesariamente existe.
     *
     * Buscamos la lista real mediante el estado de la aplicación
     * y, si no está disponible directamente, observamos el DOM
     * hasta que la aplicación haya terminado de cargar.
     */

    function obtenerProductosReales() {

        /*
         * Si la aplicación expuso products globalmente.
         */
        if (
            Array.isArray(window.products)
        ) {
            return window.products;
        }

        /*
         * Intentamos localizar una copia accesible
         * creada por otros módulos de la aplicación.
         */
        const posibles = [
            window.adminProducts,
            window.allProducts,
            window.loadedProducts,
            window.currentProducts
        ];

        for (const lista of posibles) {
            if (Array.isArray(lista)) {
                return lista;
            }
        }

        return [];
    }


    /*
     * ----------------------------------------------------------
     * SINCRONIZAR LA LISTA REAL
     * ----------------------------------------------------------
     */

    function sincronizarProductos() {

        const lista = obtenerProductosReales();

        if (!Array.isArray(lista) || !lista.length) {
            return null;
        }

        /*
         * Exponemos solamente una referencia a la misma lista.
         * No hacemos una copia destructiva ni modificamos sus datos.
         */
        window.IG_PRODUCTOS_REALES = lista;

        return lista;
    }


    /*
     * ----------------------------------------------------------
     * FILTRAR CATEGORÍA
     * ----------------------------------------------------------
     */

    function productosDeCategoria(categoria) {

        const productos =
            window.IG_PRODUCTOS_REALES ||
            sincronizarProductos() ||
            [];

        const categoriaNormalizada =
            normalizar(categoria);

        return productos.filter(function (producto) {

            return normalizar(
                producto && producto.category
            ) === categoriaNormalizada;

        });
    }


    /*
     * ----------------------------------------------------------
     * RECONSTRUIR LA REFERENCIA QUE NECESITAN LAS SECCIONES
     * ESPECIALES
     * ----------------------------------------------------------
     */

    function repararReferenciaProductos() {

        const lista = sincronizarProductos();

        if (!lista) {
            return false;
        }

        /*
         * Las funciones especiales existentes consultan
         * window.products.
         *
         * Si todavía no existe, lo enlazamos con la lista real.
         */
        if (!Array.isArray(window.products)) {

            try {

                window.products = lista;

            } catch (error) {

                console.warn(
                    "International Gateway: no se pudo exponer products.",
                    error
                );

            }

        }

        return true;
    }


    /*
     * ----------------------------------------------------------
     * RENDERIZADOR DE EMERGENCIA
     * ----------------------------------------------------------
     *
     * Solo se utiliza si la función especial existente
     * no consiguió renderizar correctamente.
     */

    function mostrarCategoria(categoria) {

        repararReferenciaProductos();

        const lista =
            productosDeCategoria(categoria);

        const container =
            document.getElementById(
                "productsContainer"
            );

        if (!container) {
            return;
        }

        /*
         * Si la función específica de la aplicación existe,
         * dejamos que ella trabaje primero.
         */

        if (
            categoria === IBERIAN &&
            typeof window.showIberianProducts === "function"
        ) {

            window.showIberianProducts();
            return;

        }

        if (
            categoria === GRANJA &&
            typeof window.showGranjaProducts === "function"
        ) {

            window.showGranjaProducts();
            return;

        }

        /*
         * Si no existe una función específica para Granja,
         * mostramos directamente los productos correspondientes.
         */

        if (!lista.length) {

            container.innerHTML = `
                <div class="empty">
                    <h3>
                        ${escapeHtmlIG(categoria)}
                        todavía no tiene productos
                    </h3>

                    <p>
                        Los productos asignados a esta categoría
                        aparecerán aquí automáticamente.
                    </p>
                </div>
            `;

            return;
        }

        container.innerHTML =
            lista.map(renderProductoIG).join("");
    }


    /*
     * ----------------------------------------------------------
     * ESCAPAR HTML
     * ----------------------------------------------------------
     */

    function escapeHtmlIG(valor) {

        return String(valor ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /*
     * ----------------------------------------------------------
     * PRECIO
     * ----------------------------------------------------------
     */

    function dineroIG(valor) {

        if (
            typeof window.money === "function"
        ) {
            return window.money(valor);
        }

        return new Intl.NumberFormat(
            "es-AR",
            {
                style: "currency",
                currency: "ARS",
                maximumFractionDigits: 2
            }
        ).format(
            Number(valor || 0)
        );
    }


    /*
     * ----------------------------------------------------------
     * RENDER DE PRODUCTO
     * ----------------------------------------------------------
     */

    function renderProductoIG(producto) {

        const imagen =
            Array.isArray(producto.ig_product_images) &&
            producto.ig_product_images.length
                ? producto.ig_product_images[0]
                : null;

        const imagenHtml =
            imagen && imagen.public_url

                ? `
                    <img
                        src="${escapeHtmlIG(imagen.public_url)}"
                        alt="${escapeHtmlIG(producto.name)}">
                  `

                : `
                    <span>Sin imagen</span>
                  `;

        const disponible =
            producto.available !== false;

        return `
            <article class="product-card">

                <div class="product-image">
                    ${imagenHtml}
                </div>

                <div class="product-content">

                    <div class="product-category">
                        ${escapeHtmlIG(producto.category || "")}
                    </div>

                    <h3>
                        ${escapeHtmlIG(producto.name)}
                    </h3>

                    ${
                        producto.description
                            ? `
                                <div class="product-description">
                                    ${escapeHtmlIG(
                                        producto.description
                                    )}
                                </div>
                              `
                            : ""
                    }

                    ${
                        producto.characteristics
                            ? `
                                <div class="characteristics">
                                    ${escapeHtmlIG(
                                        producto.characteristics
                                    )}
                                </div>
                              `
                            : ""
                    }

                    <div class="price">
                        ${dineroIG(producto.price)}
                    </div>

                    <button
                        class="button full"
                        onclick="addToCart('${escapeHtmlIG(producto.id)}')"
                        ${disponible ? "" : "disabled"}>

                        ${
                            disponible
                                ? "Agregar al carrito"
                                : "Agotado"
                        }

                    </button>

                </div>

            </article>
        `;
    }


    /*
     * ----------------------------------------------------------
     * ASEGURAR QUE LAS FUNCIONES ESPECIALES VEAN LOS PRODUCTOS
     * ----------------------------------------------------------
     */

    function instalarPuente() {

        repararReferenciaProductos();

        /*
         * Granja.
         */
        if (
            typeof window.showGranjaProducts !== "function"
        ) {

            window.showGranjaProducts =
                function () {

                    mostrarCategoria(GRANJA);

                };

        }

        /*
         * Iberian.
         *
         * Si ya existe, NO la sustituimos.
         * El código original podrá utilizar ahora
         * window.products correctamente.
         */

        if (
            typeof window.showIberianProducts !== "function"
        ) {

            window.showIberianProducts =
                function () {

                    mostrarCategoria(IBERIAN);

                };

        }
    }


    /*
     * ----------------------------------------------------------
     * BOTONES / TARJETAS DE LAS DOS CATEGORÍAS
     * ----------------------------------------------------------
     */

    function conectarEventosEspeciales() {

        /*
         * Granja.
         */
        const granja =
            document.getElementById(
                "igGranjaCategoryCard"
            );

        if (granja) {

            granja.onclick =
                function (event) {

                    event.preventDefault();

                    event.stopPropagation();

                    mostrarCategoria(GRANJA);

                };

        }


        /*
         * Iberian.
         */
        const iberian =
            document.getElementById(
                "igIberianCategoryCard"
            );

        if (iberian) {

            iberian.onclick =
                function (event) {

                    event.preventDefault();

                    event.stopPropagation();

                    mostrarCategoria(IBERIAN);

                };

        }
    }


    /*
     * ----------------------------------------------------------
     * OBSERVAR CARGA DINÁMICA
     * ----------------------------------------------------------
     */

    function reparar() {

        instalarPuente();

        conectarEventosEspeciales();

        sincronizarProductos();

    }


    /*
     * Primera ejecución.
     */

    reparar();


    /*
     * La aplicación carga productos y módulos
     * dinámicamente, así que volvemos a comprobar
     * después de la carga.
     */

    setTimeout(reparar, 300);
    setTimeout(reparar, 800);
    setTimeout(reparar, 1500);
    setTimeout(reparar, 3000);


    /*
     * Observador.
     */

    if (document.body) {

        const observer =
            new MutationObserver(function () {

                reparar();

            });

        observer.observe(
            document.body,
            {
                childList: true,
                subtree: true
            }
        );
    }


    console.log(
        "International Gateway: reparación de Granja lo de Nico e Iberian Mediterránea activa."
    );

})();

  <script>
/* ============================================================
   INTERNATIONAL GATEWAY
   REPARADOR DEFINITIVO DE SECCIONES ESPECIALES

   GRUPO:
   - Granja lo de Nico
   - Iberian Mediterránea

   SOLUCIÓN:
   Las dos secciones consultan directamente ig_products
   utilizando el campo category de Supabase.

   NO modifica:
   - productos
   - imágenes
   - precios
   - carrito
   - pedidos
   - categorías normales
   - sistema de administración
   ============================================================ */

(function () {

  "use strict";

  if (window.__IG_SPECIAL_CATEGORIES_FIX__) {
    return;
  }

  window.__IG_SPECIAL_CATEGORIES_FIX__ = true;


  /* ==========================================================
     CONFIGURACIÓN
     ========================================================== */

  const CATEGORIA_GRANJA =
    "Granja lo de Nico";

  const CATEGORIA_IBERIAN =
    "Iberian Mediterránea";


  /* ==========================================================
     NORMALIZAR TEXTO
     ========================================================== */

  function normalizar(texto) {

    return String(texto || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .toLowerCase();

  }


  /* ==========================================================
     ESCAPAR HTML
     ========================================================== */

  function esc(texto) {

    return String(texto ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ==========================================================
     OBTENER CLIENTE SUPABASE
     ========================================================== */

  function getSupabase() {

    try {

      if (
        typeof supabaseClient !== "undefined" &&
        supabaseClient
      ) {
        return supabaseClient;
      }

    } catch (error) {}

    return window.supabaseClient || null;

  }


  /* ==========================================================
     OBTENER PRODUCTOS DE LA CATEGORÍA DIRECTAMENTE
     DESDE SUPABASE
     ========================================================== */

  async function obtenerProductosCategoria(categoria) {

    const client =
      getSupabase();

    if (!client) {

      console.error(
        "[IG Special Categories] Supabase no disponible."
      );

      return [];

    }


    try {

      const resultado =
        await client
          .from("ig_products")
          .select(`
            id,
            name,
            description,
            characteristics,
            price,
            category,
            available,
            active,
            ig_product_images(
              id,
              storage_path,
              public_url,
              is_primary,
              sort_order
            )
          `)
          .eq("active", true)
          .eq("category", categoria)
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (resultado.error) {

        console.error(
          "[IG Special Categories] Error Supabase:",
          resultado.error
        );

        return [];

      }


      const lista =
        Array.isArray(resultado.data)
          ? resultado.data
          : [];


      lista.forEach(producto => {

        producto.ig_product_images =
          (
            producto.ig_product_images || []
          ).sort((a, b) => {

            if (
              a.is_primary &&
              !b.is_primary
            ) {
              return -1;
            }

            if (
              !a.is_primary &&
              b.is_primary
            ) {
              return 1;
            }

            return (
              Number(a.sort_order || 0) -
              Number(b.sort_order || 0)
            );

          });

      });


      return lista;


    } catch (error) {

      console.error(
        "[IG Special Categories] Error inesperado:",
        error
      );

      return [];

    }

  }


  /* ==========================================================
     IMAGEN
     ========================================================== */

  function imagenProducto(producto) {

    const imagen =
      (
        producto.ig_product_images || []
      )[0];


    if (
      imagen &&
      imagen.public_url
    ) {

      return `
        <img
          src="${esc(imagen.public_url)}"
          alt="${esc(producto.name)}">
      `;

    }


    return `
      <span>
        Sin imagen
      </span>
    `;

  }


  /* ==========================================================
     PRECIO
     ========================================================== */

  function precioProducto(valor) {

    try {

      if (
        typeof money === "function"
      ) {

        return money(valor);

      }

    } catch (error) {}


    return new Intl.NumberFormat(
      "es-AR",
      {
        style: "currency",
        currency: "ARS",
        maximumFractionDigits: 2
      }
    ).format(
      Number(valor || 0)
    );

  }


  /* ==========================================================
     TARJETA DEL PRODUCTO
     ========================================================== */

  function tarjetaProducto(producto) {

    const disponible =
      producto.available !== false;


    return `

      <article
        class="product-card"
        data-ig-special-product-id="${esc(producto.id)}">

        <div class="product-image">

          ${imagenProducto(producto)}

        </div>


        <div class="product-content">

          ${
            producto.category
              ? `
                <div class="product-category">
                  ${esc(producto.category)}
                </div>
              `
              : ""
          }


          <h3>
            ${esc(producto.name)}
          </h3>


          ${
            producto.description
              ? `
                <div class="product-description">
                  ${esc(producto.description)}
                </div>
              `
              : ""
          }


          ${
            producto.characteristics
              ? `
                <div class="characteristics">
                  ${esc(producto.characteristics)}
                </div>
              `
              : ""
          }


          <div class="price">

            ${precioProducto(producto.price)}

          </div>


          <button
            class="button full"
            type="button"
            data-ig-special-add="${esc(producto.id)}"
            ${disponible ? "" : "disabled"}>

            ${
              disponible
                ? "Agregar al carrito"
                : "Agotado"
            }

          </button>


          <button
            class="ig-product-share"
            type="button"
            data-ig-special-share="${esc(producto.id)}">

            📤 Compartir producto

          </button>

        </div>

      </article>

    `;

  }


  /* ==========================================================
     RENDERIZAR PRODUCTOS ESPECIALES
     ========================================================== */

  function renderEspeciales(
    categoria,
    productos
  ) {

    const container =
      document.getElementById(
        "productsContainer"
      );


    if (!container) {

      console.warn(
        "[IG Special Categories] No se encontró productsContainer."
      );

      return;

    }


    if (!productos.length) {

      const emoji =
        categoria === CATEGORIA_GRANJA
          ? "🐄"
          : "🇪🇸";


      container.innerHTML = `

        <div class="empty">

          <h3>
            ${emoji}
            ${esc(categoria)}
            todavía no tiene productos
          </h3>

          <p>
            Los productos asignados a esta categoría
            aparecerán aquí automáticamente.
          </p>

        </div>

      `;

      return;

    }


    container.innerHTML =
      productos
        .map(tarjetaProducto)
        .join("");


    /* ========================================================
       BOTONES AGREGAR AL CARRITO
       ======================================================== */

    container
      .querySelectorAll(
        "[data-ig-special-add]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          function () {

            const id =
              button.dataset.igSpecialAdd;


            const producto =
              productos.find(
                p =>
                  String(p.id) ===
                  String(id)
              );


            if (!producto) {
              return;
            }


            /*
             * Utilizamos el sistema de carrito
             * original de International Gateway.
             */

            try {

              if (
                typeof addToCart ===
                "function"
              ) {

                addToCart(
                  producto.id
                );

                return;

              }

            } catch (error) {

              console.warn(
                "[IG Special Categories] addToCart:",
                error
              );

            }


            /* Respaldo mínimo si la función original
               no está disponible. */

            if (
              Array.isArray(window.cart)
            ) {

              const existente =
                window.cart.find(
                  item =>
                    String(item.id) ===
                    String(producto.id)
                );


              if (existente) {

                existente.quantity++;

              } else {

                window.cart.push({

                  id: producto.id,

                  name: producto.name,

                  price:
                    Number(producto.price),

                  image:
                    producto
                      .ig_product_images?.[0]
                      ?.public_url || "",

                  quantity: 1

                });

              }

            }

          }
        );

      });


    /* ========================================================
       BOTONES COMPARTIR
       ======================================================== */

    container
      .querySelectorAll(
        "[data-ig-special-share]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          async function () {

            const id =
              button.dataset.igSpecialShare;


            const producto =
              productos.find(
                p =>
                  String(p.id) ===
                  String(id)
              );


            if (!producto) {
              return;
            }


            const url =
              new URL(
                window.location.href
              );


            url.search = "";

            url.hash = "";


            url.searchParams.set(
              "producto",
              producto.id
            );


            try {

              if (
                navigator.share
              ) {

                await navigator.share({

                  title:
                    producto.name,

                  text:
                    "🛍️ " +
                    producto.name +
                    " — International Gateway",

                  url:
                    url.toString()

                });

              } else {

                await navigator.clipboard.writeText(
                  url.toString()

                if (
                  typeof showToast ===
                  "function"

                    "✓ Enlace del producto copiado"

                }

              if (
                error &&

                "AbortError"
              ) {

                return;

              }

              console.warn(
                "[IG Special Categories] compartir:",
                error
              );

            }

          }
        );

      });

  }


  /* ==========================================================

  async function mostrarCategoriaEspecial(

      document.querySelector(
        "#productsSection .section-title"
      );

        ${

        <button

          ">

          ← Todos los productos

        </button>

      `;


      const back =
        document.getElementById(
          "igSpecialBack"
        );


      if (back) {

                back.onclick =
          function () {

            const granjaFilterBar =
              document.getElementById(
                "igGranjaFilterBar"
              );

            const iberianFilterBar =
              document.getElementById(
                "igIberianFilterBar"
              );

            if (granjaFilterBar) {
              granjaFilterBar.classList.remove(
                "ig-active"
              );

            if (iberianFilterBar) {
              iberianFilterBar.classList.remove(
                "ig-iberian-active"
              );

            ) {

                  if (

                    typeof window.InternationalGatewayCategories.showAll ===
                      "function"
                  ) {

                    window.InternationalGatewayCategories.showAll();

                  }

                }
              );

            }

              "Productos";

          };

      }

    }


    /*
     * Mensaje de carga.
     */

    container.innerHTML = `

      <div class="loading">

        Cargando productos de
        <strong>
          ${esc(categoria)}
        </strong>...

      </div>

    `;


    /*
     * CONSULTA REAL A SUPABASE.
     */

    const productos =
      await obtenerProductosCategoria(

      );

     * Render final.
     */

    renderEspeciales(

    );


    /*
     * Subimos hasta la sección.
     */

    const section =

      });
